<script>
// Parking lot (asked as LLD and as HLD). Taught HERE: spot allocation by size + nearest-to-gate (Strategy pattern),
// the allocation race (CAS on spot state vs Redis atomic pop), spot state FREE → RESERVED → OCCUPIED, fee + idempotent
// exit, live availability counters, reservations with a hold TTL, a lot-local edge server that works offline.
// Redis, Kafka, DB scaling and gateway basics live in 00_Core_Components.html; seat holds come from 03 Ticket Booking,
// payments/outbox from 05 E-commerce, rate limits from 02 Rate Limiter, push messages from 04 Notification System.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Row colours for spots, tickets, reservations and journal entries.
const ST = {
  FREE: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  RES: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  OCC: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  PAY: { fill: '#faf6fd', stroke: PURPLE, color: PURPLE },
  DONE: { fill: '#f6f7fb', stroke: '#c9ced3', color: GREY },
  LOG: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
// SVG collapses normal spaces, so pad with non-breaking ones to keep the monospace columns aligned.
const pad = (str, n) => str.padEnd(n, ' ');
const S = (spot, size, state, rest = '') => `${pad(spot, 7)}${pad(size, 6)}${pad(state, 9)}${rest}`;   // spot row
const K = (id, plate, status, rest = '') => `${pad(id, 7)}${pad(plate, 10)}${pad(status, 7)}${rest}`;  // ticket / reservation row
const J = (seq, rest) => `${pad(seq, 5)}${rest}`;                                                      // journal / event row
const P1 = 'KA01-1234', P2 = 'KA05-7781';

// State drawn next to the components: spots, tickets, clock, gates, lot server, board, app, city, payment, PSP.
function setup(s, v, { spots = [], tks = [], spotTitle = 'SPOTS · lot 7 · floor L1', tkTitle = 'TICKETS · lot 7', clock = '09:10',
  drv = `${P1} · car`, ent = 'G1 ready', ex = 'exit ready', lot = 'free L1·car: 41', brd = 'L1 car 41 · bike 30', app = 'app: lot 7 car 41',
  city = 'lot 7 · online', pay = 'payments: —', psp = 'provider up' } = {}) {
  v.clock = s.chip(440, 505, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.sp = s.store(885, 196, 205, spotTitle, { color: BLUE });
  v.tk = s.store(885, 366, 205, tkTitle, { color: PURPLE });
  v.rows = {};
  spots.forEach(([key, txt, st]) => { s.row(v.sp, txt, { ...ST[st], now: true }); v.rows[key] = v.sp.rows[v.sp.rows.length - 1]; });
  tks.forEach(([key, txt, st]) => { s.row(v.tk, txt, { ...ST[st ?? 'LOG'], now: true }); v.rows[key] = v.tk.rows[v.tk.rows.length - 1]; });
  v.c = {
    drv: s.chip(90, 134, drv, { color: GREY }),
    ent: s.chip(90, 314, ent, { color: GREY }),
    ex: s.chip(90, 494, ex, { color: GREY }),
    lot: s.chip(295, 215, lot, { mono: true, color: GREY }),
    brd: s.chip(295, 494, brd, { mono: true, color: GREY }),
    app: s.chip(295, 134, app, { color: GREY }),
    city: s.chip(770, 134, city, { color: GREY }),
    pay: s.chip(770, 222, pay, { color: GREY }),
    psp: s.chip(770, 494, psp, { color: GREY }),
  };
  return v;
}
// Add or update a row (spot or ticket) by key; new rows go to the given store.
async function put(s, v, key, txt, st, store = 'sp') {
  const r = v.rows[key];
  if (!r) { v.rows[key] = await s.row(v[store], txt, ST[st]); return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
// Append to the second store (keeps the last 5 visible).
async function log(s, v, txt, st = 'LOG') {
  if (v.tk.rows.length >= 5) await s.unrow(v.tk, v.tk.rows[0]);
  return s.row(v.tk, txt, ST[st]);
}
async function clearRows(s, v) { for (const st of [v.sp, v.tk]) for (const r of [...st.rows]) await s.unrow(st, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const say = (s, v, key, txt, color = GREY) => s.setChip(v.c[key], txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, warn = { mono: true, color: AMBER, stroke: AMBER, fill: '#fdf6ea' };
// Floor L1 near the entry: C07 is nearest, then C08, C12 (distance in metres from gate G1).
const L1 = [
  ['C07', S('L1-C07', 'car', 'FREE', '12 m'), 'FREE'],
  ['C08', S('L1-C08', 'car', 'FREE', '15 m'), 'FREE'],
  ['C12', S('L1-C12', 'car', 'FREE', '31 m'), 'FREE'],
  ['B03', S('L1-B03', 'bike', 'FREE', '9 m'), 'FREE'],
];

    { id: 'cloud', title: 'Cloud services', x0: 670, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',

  ],
  layersIntro: {

  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Read the plate, claim the nearest fitting spot atomically, charge once at the exit, count everything live.',
    points: [
      { t: 'Enter', color: BLUE, d: '**ANPR** at the gate → **lot server** pops the nearest free spot of the right size from **Redis**.' },
      { t: 'Claim', color: PURPLE, d: 'Conditional update `state: FREE → OCCUPIED` in the **Lot DB** + ticket: one car per spot.' },
      { t: 'Count', color: TEAL, d: 'Boards update locally; the event goes through **Kafka** to the **app** and **City DB**.' },
      { t: 'Exit & pay', color: GREEN, d: 'Fee by **pricing strategy**, charged once (key = ticketId), spot back to FREE, barrier opens.' },
    ],
    stats: [['500', 'lots in the city'], ['200 k', 'spots'], ['< 2 s', 'at the barrier'], ['1', 'car per spot']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v, { spots: L1 }); v.ready = true; }
    await clearRows(s, v);
    for (const [key, txt, st] of L1) await put(s, v, key, txt, st);
    tick(s, v, '09:12'); say(s, v, 'drv', `${P1} · car`); say(s, v, 'ent', 'G1 ready'); say(s, v, 'ex', 'exit ready');
    say(s, v, 'lot', 'free L1·car: 41'); say(s, v, 'brd', 'L1 car 41 · bike 30'); say(s, v, 'app', 'app: lot 7 car 41'); say(s, v, 'pay', 'payments: —');

    ui.say(0); ui.cap('**Enter** · the camera reads the plate; the lot server pops the nearest free car spot');
    await s.send(['driver', 'entry', 'lotsvc'], `${P1} car`, BLUE, { ms: 400 });
    await s.send(['lotsvc', 'redis'], 'ZPOPMIN car', BLUE, { ms: 380 });
    await s.send(['redis', 'lotsvc'], 'L1-C07', BLUE, { ms: 380 });
    ui.say(1); ui.cap('**Claim** · FREE → OCCUPIED only if still FREE, ticket written in the same transaction');
    await s.send(['lotsvc', 'pdb'], 'CAS C07 FREE→OCC', PURPLE, { ms: 380 });
    await put(s, v, 'C07', S('L1-C07', 'car', 'OCCUPIED', 'TK501'), 'OCC');
    await log(s, v, K('TK-501', P1, 'OPEN', 'C07'), 'OCC');
    await s.send(['lotsvc', 'entry'], 'open → L1-C07', GREEN, { ms: 360 });
    say(s, v, 'ent', 'barrier up · L1-C07', GREEN);
    ui.say(2); ui.cap('**Count** · boards update on the LAN; the event flows to the cloud and the app');
    await s.send(['lotsvc', 'board'], 'car 40', TEAL, { ms: 340 });
    say(s, v, 'brd', 'L1 car 40 · bike 30', TEAL); say(s, v, 'lot', 'free L1·car: 40', TEAL);
    await s.send(['lotsvc', 'kafka', 'api'], 'entered #812', TEAL, { ms: 340 });
    say(s, v, 'app', 'app: lot 7 car 40', TEAL);
    ui.say(3); ui.cap('**Exit & pay** · 3 h 28 min → ₹130, charged once with key TK-501, spot freed');
    tick(s, v, '12:40'); say(s, v, 'ex', `${P1} at exit`, BLUE);
    await s.send(['exit', 'lotsvc', 'pay', 'psp'], '₹130 · TK-501', GREEN, { ms: 340 });
    say(s, v, 'pay', 'TK-501 paid ✓', GREEN);
    await s.send(['lotsvc', 'pdb'], 'close + free C07', GREEN, { ms: 340 });
    await put(s, v, 'C07', S('L1-C07', 'car', 'FREE', '12 m'), 'FREE');
    await put(s, v, 'TK-501', K('TK-501', P1, 'CLOSED', '₹130'), 'DONE', 'tk');
    await s.send(['lotsvc', 'exit'], 'open', GREEN, { ms: 340 });
    say(s, v, 'ex', 'barrier up ✓', GREEN); say(s, v, 'brd', 'L1 car 41 · bike 30', TEAL);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------

    {
      id: 'entry', title: 'A car enters', sub: 'ANPR · size · nearest spot', color: BLUE,

        {
          title: 'Already inside? Check for an open ticket',
          text: 'A plate can only have one open ticket per lot: a unique index on `{ plate, status: OPEN }` (partial index). A misread or a tailgating car that never exited is flagged for the attendant instead of creating a second ticket.',
          observe: 'No open ticket for KA01-1234: go ahead.',
          focus: v => [v.n.pdb],
          async run(s, v) {
            await s.send(['lotsvc', 'pdb'], 'open ticket? KA01', GREY);
            await s.flash(535, 400, 'none → continue', ok, 600);
          },
        },
        {
          title: 'Strategy: nearest free spot that fits',
          text: 'The `NearestToGateStrategy` tries sizes that fit a car (car, then large if allowed) and floors in order of distance. In Redis each floor and size has a sorted set scored by metres from G1: `ZPOPMIN free:7:L1:car` returns **L1-C07 (12 m)** and removes it in one atomic step.',

          async run(s, v) {
            await s.send(['lotsvc', 'redis'], 'ZPOPMIN L1:car', BLUE);

      "I'd start with the object model, because a parking lot is usually an LLD question first. A **ParkingLot** has floors and gates; each floor has **ParkingSpots** with a size, small, medium or large, and a state: free, reserved or occupied. **Vehicle** is a small hierarchy, bike, car and truck, and each one knows which spot sizes it fits. A **Ticket** links a plate to a spot with the entry time, and at the exit a **Payment** closes it.",

      { t: 'LLD model: vehicles, spots, two strategies', code: `public enum SpotSize { BIKE, CAR, LARGE }
public enum SpotState { FREE, RESERVED, OCCUPIED }

public sealed interface Vehicle permits Bike, Car, Truck {
  String plate();
  List<SpotSize> fits();                                   // smallest first: may upsize, never downsize
}
public record Bike(String plate) implements Vehicle { public List<SpotSize> fits() { return List.of(SpotSize.BIKE, SpotSize.CAR); } }
public record Car(String plate) implements Vehicle { public List<SpotSize> fits() { return List.of(SpotSize.CAR, SpotSize.LARGE); } }
public record Truck(String plate) implements Vehicle { public List<SpotSize> fits() { return List.of(SpotSize.LARGE); } }

public record Ticket(String id, String plate, String spotId, Instant entryAt) {}

public interface SpotAllocationStrategy {                  // Strategy: nearest-to-gate, lowest-floor, EV-first
  Optional<ParkingSpot> allocate(Vehicle v, Gate gate);
  void release(ParkingSpot spot);
}
public interface PricingStrategy {                         // Strategy: hourly slab, event flat rate, weekend
  long feeInPaise(Ticket t, Instant exitAt);
}

public final class HourlySlabPricing implements PricingStrategy {
  public long feeInPaise(Ticket t, Instant exitAt) {
    long hours = Math.max(1, (Duration.between(t.entryAt(), exitAt).toMinutes() + 59) / 60);  // round up
    return Math.min(40_00 + (hours - 1) * 30_00, 300_00);  // ₹40 first hour, ₹30 after, ₹300 cap
  }
}` },
      { t: 'Thread-safe allocate() in one JVM', code: `public final class ParkingSpot implements Comparable<ParkingSpot> {
  private final String id; private final SpotSize size; private final int metres;
  private final AtomicReference<SpotState> state = new AtomicReference<>(SpotState.FREE);

  boolean tryOccupy()  { return state.compareAndSet(SpotState.FREE, SpotState.OCCUPIED); }
  boolean tryFree()    { return state.compareAndSet(SpotState.OCCUPIED, SpotState.FREE); }
  public int compareTo(ParkingSpot o) {                     // nearest first, id breaks ties
    int c = Integer.compare(metres, o.metres); return c != 0 ? c : id.compareTo(o.id);
  }
  // getters …
}

public final class NearestToGateStrategy implements SpotAllocationStrategy {
  // filled once at start-up, then only the sets change: safe to share between gate threads
  private final Map<SpotSize, ConcurrentSkipListSet<ParkingSpot>> free = new EnumMap<>(SpotSize.class);

  public Optional<ParkingSpot> allocate(Vehicle v, Gate gate) {
    for (SpotSize size : v.fits()) {
      ParkingSpot s;
      while ((s = free.get(size).pollFirst()) != null) {    // atomic: each spot leaves the set once
        if (s.tryOccupy()) return Optional.of(s);          // CAS FREE → OCCUPIED (skips RESERVED)
      }
    }
    return Optional.empty();                               // full for this vehicle
  }
  public void release(ParkingSpot s) {
    if (s.tryFree()) free.get(s.size()).add(s);            // a second release does nothing
  }
}` },

public Ticket enter(String lotId, Vehicle v, String gate) {
  for (String key : freeSetKeys(lotId, v, gate)) {         // free:7:L1:car, free:7:L2:car, …
    ZSetOperations.TypedTuple<String> top;
    while ((top = redis.opsForZSet().popMin(key)) != null) {   // ZPOPMIN: atomic in Redis
      String spotId = top.getValue();
      UpdateResult r = mongo.updateFirst(
          query(where("_id").is(spotId).and("state").is("FREE")),
          new Update().set("state", "OCCUPIED").set("plate", v.plate()).inc("version", 1),
          Spot.class);
      if (r.getModifiedCount() == 1) {                     // the DB is the truth
        Ticket t = tickets.insert(Ticket.open(lotId, v, spotId, gate));
        journal.append(lotId, "entered", t);               // shipped to Kafka (key = lotId)
        redis.opsForHash().increment("avail:" + lotId + ":" + floorOf(spotId), sizeOf(v), -1);
        return t;
      }                                                    // stale entry: spot already taken, pop next
    }
  }
  throw new LotFullException(lotId, v);                    // gate shows "full", barrier stays down
}

public ExitResult exit(@RequestBody ExitRequest req) {
  Ticket t = tickets.findOpenByPlate(req.lotId(), req.plate()).orElseThrow(TicketNotFound::new);
  long fee = pricing.forType(t.vehicleType()).feeInPaise(t, clock.instant());
  PaymentResult p = payments.charge(t.id(), fee);          // idempotency key = ticket id
  return p.ok() ? close(t, "PAID") : close(t, "DUE");      // DUE = pay later against the plate
}

@CircuitBreaker(name = "psp", fallbackMethod = "payLater")  // Resilience4j
public PaymentResult charge(String ticketId, long fee) {
  Payment pay = payments.findById(ticketId)                 // retry → same record, same answer
      .orElseGet(() -> payments.insert(Payment.pending(ticketId, fee)));
  return pay.isFinal() ? pay.result() : psp.charge(ticketId, fee);  // provider dedupes by key too
}
PaymentResult payLater(String ticketId, long fee, Throwable e) { return PaymentResult.deferred(ticketId); }

ExitResult close(Ticket t, String how) {
  Ticket closed = mongo.findAndModify(query(where("_id").is(t.id()).and("status").in("OPEN", "PAYING")),
      new Update().set("status", how.equals("PAID") ? "CLOSED" : "DUE"), Ticket.class);
  if (closed != null) spots.free(t.spotId(), t.id());      // OCCUPIED → FREE only for this ticket
  return ExitResult.openGate(t.id());                       // replayed exit: nothing changes, gate opens
