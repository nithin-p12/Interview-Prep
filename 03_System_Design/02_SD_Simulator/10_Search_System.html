// Product search (e-commerce). Elasticsearch is taught HERE (flow "Why Elasticsearch?"), not in Core Components.
// API gateway, Redis, Kafka and DB basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Row colours for the store under the pipeline (posting lists, search documents, results or indices).
const ST = {
  NEW: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  IDX: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
  DIM: { fill: '#f6f7fb', stroke: '#e3e6ee', color: GREY },
};
const SHARDS = ['s0', 's1', 's2'];

// State shown next to the components: the store (bottom right), DB doc, Kafka, indexer, cache, shards, users.
function setup(s, v, { rows = [], title = 'SEARCH INDEX · products (copy)', clock = '15:00:00', db = 'p-7 · ₹100 · v3', kaf = 'product-changes —', idx = 'idle', cache = 'cache empty', sh = ['17 M docs', '17 M docs', '16 M docs'], a = 'browsing', b = 'browsing', c = 'seller portal', es = null } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.log = s.store(840, 405, 250, title, { color: BLUE });
  v.rows = {};
  rows.forEach(([key, text, st]) => { s.row(v.log, text, { ...ST[st], now: true }); v.rows[key] = v.log.rows[v.log.rows.length - 1]; });
  v.db = s.chip(650, 492, db, { mono: true, color: TEAL });
  v.kaf = s.chip(960, 378, kaf, { mono: true, color: PURPLE });
  v.idx = s.chip(960, 140, idx, { mono: true, color: GREY });
  v.cache = s.chip(650, 112, cache, { mono: true, color: GREY });
  v.sh = [542, 650, 758].map((x, i) => s.chip(x, 357, sh[i], { mono: true, color: GREY }));
  v.ua = s.chip(65, 116, a, { color: GREY });
  v.ub = s.chip(65, 271, b, { color: GREY });
  v.uc = s.chip(65, 436, c, { color: GREY });
  if (es) s.setSub(s.nodes.es, es, BLUE);
  return v;
}
async function put(s, v, key, text, st) {
  const r = v.rows[key];
  if (!r) { v.rows[key] = await s.row(v.log, text, ST[st]); return; }
  r.label.textContent = text;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
async function clearRows(s, v) { for (const r of [...v.log.rows]) await s.unrow(v.log, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const db = (s, v, t, color = TEAL) => s.setChip(v.db, t, { color });
const kaf = (s, v, t, color = PURPLE) => s.setChip(v.kaf, t, { color });
const idx = (s, v, t, color = GREY) => s.setChip(v.idx, t, paint(color));
const cch = (s, v, t, color = GREY) => s.setChip(v.cache, t, paint(color));
const shd = (s, v, i, t, color = GREY) => s.setChip(v.sh[i], t, paint(color));
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : u === 'C' ? v.uc : v.ua, txt, paint(color));
const both = (...ps) => Promise.all(ps);
// Coordinating node → every shard (query phase), and back (only one pulse on the shared node).
const scatter = (s, label, color = BLUE) => both(
  s.send(['es', 's0'], label, color, { ms: 380 }), s.send(['es', 's1'], label, color, { ms: 380 }), s.send(['es', 's2'], label, color, { ms: 380 }));
const gather = (s, [a, b, c], color = GREEN) => both(
  s.send(['s0', 'es'], a, color, { ms: 380 }), s.send(['s1', 'es'], b, color, { ms: 380, pulse: false }), s.send(['s2', 'es'], c, color, { ms: 380, pulse: false }));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, info = { mono: true, color: BLUE, stroke: BLUE, fill: '#f3f6fe' };

  layers: [

      why: '**Shoppers** search (thousands per second); **sellers** change products (far fewer). Both come through the **API gateway** for auth and rate limits.',

    ['es', 's0'], ['es', 's1'], ['es', 's2'], ['catalog', 'catdb'], ['catalog', 'es'], ['catdb', 'kafka'], ['kafka', 'indexer'], ['indexer', 'es']],

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Write the truth, stream it into an inverted index, fan the query out to shards.',
    points: [
      { t: 'Truth', color: TEAL, d: 'Sellers write only to **MongoDB**, which bumps the product\'s **version**.' },
      { t: 'Index', color: PURPLE, d: 'Change stream → **Kafka** → **Indexer** → `_bulk` with an **external version**; searchable after ~1 s.' },
      { t: 'Query', color: BLUE, d: 'Search Svc sends a **bool query**; the coordinating node asks **every shard** for its top 10.' },
      { t: 'Merge', color: GREEN, d: 'Merge, **fetch** the winners, return; hot queries are **cached** for 30 s.' },

    stats: [['50 M', 'products'], ['5 k/s', 'searches'], ['< 200 ms', 'p99 search'], ['~1 s', 'index lag']],

  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await clearRows(s, v);
    await put(s, v, 'p-7', 'p-7 · Trail shoes · ₹100 · v3', 'OK');
    await put(s, v, 'p-9', 'p-9 · Road shoes · ₹120 · v7', 'OK');
    db(s, v, 'p-7 · ₹100 · v3'); kaf(s, v, 'product-changes —'); idx(s, v, 'idle'); cch(s, v, 'cache empty');
    SHARDS.forEach((_, i) => shd(s, v, i, i === 2 ? '16 M docs' : '17 M docs'));
    who(s, v, 'A', 'browsing'); who(s, v, 'B', 'browsing'); who(s, v, 'C', 'lowers p-7 to ₹80');

    ui.say(0); ui.cap('**Truth** · the seller\'s change goes only to the Catalog DB; the version becomes 4');
    await s.send(['seller', 'gw', 'catalog'], 'PATCH price 80', AMBER, { ms: 400 });
    await s.send(['catalog', 'catdb'], '$inc version', TEAL, { ms: 400 });
    db(s, v, 'p-7 · ₹80 · v4'); await s.pulse(v.db);
    who(s, v, 'C', 'saved ✓', GREEN);
    ui.say(1); ui.cap('**Index** · change stream → Kafka → indexer → _bulk with version 4 → searchable after a refresh');
    await s.send(['catdb', 'kafka'], 'p-7 v4', PURPLE, { ms: 400 });
    kaf(s, v, 'p-7 v4 ₹80 @910');
    await s.send(['kafka', 'indexer'], 'batch', PURPLE, { ms: 380 });
    idx(s, v, '_bulk · p-7 v4', PURPLE);
    await s.send(['indexer', 'es', 's1'], '_bulk v4 external', PURPLE, { ms: 380 });
    await put(s, v, 'p-7', 'p-7 · Trail shoes · ₹80 · v4', 'OK');
    ui.say(2); ui.cap('**Query** · A searches; cache miss; the coordinating node sends the query to every shard');
    await s.send(['userA', 'gw', 'search'], '"running shoes" ≤ ₹150', BLUE, { ms: 380 });
    await s.send(['search', 'cache'], 'GET q:…', RED, { ms: 340 });
    cch(s, v, 'miss', GREY);
    await s.send(['search', 'es'], 'bool query', BLUE, { ms: 380 });
    await scatter(s, 'query');
    ['top · 6.9', 'top · 7.3', 'top · 5.8'].forEach((t, i) => shd(s, v, i, t, BLUE));
    ui.say(3); ui.cap('**Merge** · top 10 of each shard → global top 10 → fetch → results; the page is cached for B');
    await gather(s, ['10 ids', '10 ids', '10 ids']);
    await s.flash(800, 255, 'merge 30 → top 10', info, 600);
    await s.send(['es', 's1'], 'fetch _source', TEAL, { ms: 340 });
    await s.send(['es', 'search', 'gw', 'userA'], '10 hits · p-7 ₹80', GREEN, { ms: 360 });
    who(s, v, 'A', '10 hits · 45 ms', GREEN);
    await s.send(['search', 'cache'], 'SET EX 30', RED, { ms: 340 });
    cch(s, v, 'q:running shoes · 30 s', RED);
    await s.send(['userB', 'gw', 'search', 'cache'], 'same query', BLUE, { ms: 340 });
    await s.send(['search', 'gw', 'userB'], 'cache hit', GREEN, { ms: 340 });
    who(s, v, 'B', 'cache hit · 4 ms', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'why', title: 'Why Elasticsearch?', sub: 'regex scan vs inverted index', color: AMBER,
      build: (s, v) => setup(s, v, { title: 'INVERTED INDEX · title', db: '50 M products', sh: ['—', '—', '—'], a: 'wants running shoes' }),
      takeaway: 'A regex / `LIKE \'%…%\'` cannot use a B-tree index, so it **scans everything** and still matches characters, not words. Elasticsearch **analyzes** text into terms once (tokenize, lowercase, stem), keeps an **inverted index** (term → posting list), ranks with **BM25**, and splits the index into **shards** that a coordinating node queries in parallel and merges.',
      steps: [
        {
          title: '❌ Search with a regex on MongoDB',
          text: 'The first idea: `db.products.find({ title: /running shoes/i })` (SQL: `LIKE \'%running shoes%\'`). A B-tree index is sorted by the **start** of the value, so a pattern that can match **anywhere** cannot use it: MongoDB does a **COLLSCAN** of all 50 M products. Seconds per query, at 5 000 queries per second.',
          observe: 'The Catalog DB scans 50 M documents for one search.',
          say: 'A leading-wildcard or regex search cannot use a normal index, so it scans the whole collection.',
          focus: v => [v.n.catdb, v.db],
          async run(s, v) {
            await s.send(['userA', 'gw', 'catalog', 'catdb'], '$regex /running shoes/i', AMBER);
            s.tone(v.n.catdb, 'warn'); s.setSub(v.n.catdb, 'COLLSCAN 50 M', RED);
            db(s, v, 'scanned 50 M · 4.2 s', RED);
            await s.shake(v.n.catdb);
            await s.send(['catdb', 'catalog', 'gw', 'userA'], '3 hits · 4.2 s', RED);
            who(s, v, 'A', 'waited 4.2 s ✕', RED);
          },
        },
        {
          title: '❌ ...and it matches characters, not words',
          text: '"Running Shoe" (singular), "shoes for running" (other order) and "runners" are **missed**; "shoestring running belt" **matches**. And there is **no ranking**: a product with "running shoes" in its title is no better than one that mentions it once deep in the description.',
          observe: 'Wrong matches, missed matches, no order.',
          say: 'Regex has no notion of words, stemming or relevance.',
          focus: v => [v.n.catalog],
          async run(s, v) {
            await s.flash(375, 440, '✕ missed "Running Shoe"', bad, 650);
            await s.flash(375, 440, '✕ missed "shoes for running"', bad, 650);
            await s.flash(375, 440, '✕ matched "shoestring belt"', bad, 650);
            who(s, v, 'A', 'bad results ✕', RED);
          },
        },
        {
          title: '✅ Analyze the text once, when indexing',
          text: 'Elasticsearch passes every `text` field through an **analyzer**: **tokenize** on word boundaries, **lowercase**, drop stop words, **stem** (running → run, shoes → shoe). "Trail Running Shoes" becomes the terms `[trail, run, shoe]`. The **same analyzer** runs on the query later, so both sides speak the same terms.',
          observe: 'p-7 becomes three terms, each pointing to p-7.',
          say: 'An analyzer turns text into normalised terms: tokenize, lowercase, stem.',
          focus: v => [v.n.indexer, v.log],
          async run(s, v) {
            s.tone(v.n.catdb, null); s.setSub(v.n.catdb, 'MongoDB · truth'); db(s, v, '50 M products');
            who(s, v, 'A', 'wants running shoes');
            await s.send(['catdb', 'kafka', 'indexer'], 'p-7 "Trail Running Shoes"', PURPLE);
            idx(s, v, '[trail, run, shoe]', PURPLE); await s.pulse(v.idx);
            await s.send(['indexer', 'es', 's1'], 'p-7 terms', PURPLE);
            await put(s, v, 'trail', 'trail → p-7', 'IDX');
            await put(s, v, 'run', 'run → p-7', 'IDX');
            await put(s, v, 'shoe', 'shoe → p-7', 'IDX');
          },
        },

  answer: {
    summary: [
      "For product search I'd keep **MongoDB as the source of truth** and treat **Elasticsearch as a derived, rebuildable copy**. A regex or `LIKE '%shoes%'` query can't use a normal index, so it scans every product and still has no idea about words or relevance. Elasticsearch runs the text through an **analyzer**, lowercase, split into words, stem them, and keeps an **inverted index**: for every term, the list of products that contain it. Ranking is **BM25**, so rare terms and short-field matches count more.",
      "On the write side, the Catalog Service writes **only to MongoDB** and bumps a **version** on every change. I don't dual-write to Elasticsearch, because there's no transaction across the two and they'd drift. Instead a **change stream** publishes each change to **Kafka** keyed by productId, and a Spring Kafka **indexer** sends them in `_bulk` requests with `version_type=external` and the DB version. If an older change arrives late after a retry, Elasticsearch rejects it with a **409**, so the index always converges to the DB.",
      "On the read side, the Search Service builds a **bool query**: the text goes in `must`, which is scored, and price, brand and stock go in `filter`, which isn't scored and gets cached. The index is split into **shards** with replicas; the coordinating node sends the query to every shard, each returns its **top ten**, it merges them and fetches just the winners. Popular queries sit in **Redis** for thirty seconds.",

      { t: 'Change stream → Kafka (keyed by productId)', code: `@Component
class ProductChangePublisher {
  @EventListener(ApplicationReadyEvent.class)
  void start() {
    BsonDocument token = tokens.load("products");               // resume where we stopped
    var stream = mongo.getCollection("products").watch()
        .fullDocument(FullDocument.UPDATE_LOOKUP);
    if (token != null) stream = stream.resumeAfter(token);
    for (ChangeStreamDocument<Document> c : stream) {
      String id = c.getDocumentKey().getString("_id").getValue();
      kafka.send("product-changes", id, ProductEvent.from(c))     // key = productId → per-product order
           .get();                                                // wait for the ack…
      tokens.save("products", c.getResumeToken());              // …then move the resume token
    }
  }
}` },
      { t: 'Indexer: @KafkaListener → _bulk with external versions', code: `@KafkaListener(topics = "product-changes", batch = "true")
void index(List<ProductEvent> events, Acknowledgment ack) throws IOException {
  BulkResponse res = es.bulk(b -> {
    for (ProductEvent e : events)
      b.operations(op -> op.index(i -> i
          .index("products").id(e.id())
          .version(e.version()).versionType(VersionType.External)   // DB version
          .document(ProductDoc.from(e))));
    return b;
  });
  for (BulkResponseItem item : res.items()) {
    if (item.error() == null || item.status() == 409) continue;     // 409: index already has a newer version
    if (item.status() == 429) retry.send(item.id());               // back off, retry later
    else dlq.send(item.id(), item.error().reason());                // bad document → DLQ
  }
  ack.acknowledge();                                                // commit offsets after the bulk
}` },
