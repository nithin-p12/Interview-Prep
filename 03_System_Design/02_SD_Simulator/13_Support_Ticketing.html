// Customer support ticketing (Zendesk / Freshdesk). Taught HERE: ticket state machine, safe claim (CAS on version),
// SLA timers + escalation, outbox events, live updates, tenant isolation.
// Kafka, S3, DB scaling and gateway basics live in 00_Core_Components.html; timers reuse 08 Job Scheduler,
// outbound mail reuses 04 Notification System, ticket search reuses 10 Search System (Elasticsearch).
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Row colours for ticket documents and event (outbox + audit) entries.
const ST = {
  NEW: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  OPEN: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  PEND: { fill: '#faf6fd', stroke: PURPLE, color: PURPLE },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  DONE: { fill: '#f6f7fb', stroke: '#c9ced3', color: GREY },
  LOG: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
// SVG collapses normal spaces, so pad with non-breaking ones to keep the monospace columns aligned.
const pad = (str, n) => str.padEnd(n, ' ');
const T = (id, status, rest = '') => `${pad(id, 6)}${pad(status, 9)}${rest}`;   // ticket row
const E = (ver, rest) => `${pad(ver, 4)}${rest}`;                                // event row

// State drawn next to the components: tickets, events (outbox + audit), clock, people, router queue, SLA timer.
function setup(s, v, { tickets = [], events = [], clock = '09:58', cust = 'acme customer', a = 'online · cap 0/5', b = 'online · cap 0/5', q = 'billing queue: —', sla = 'timers: —' } = {}) {
  v.clock = s.chip(222, 488, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.tk = s.store(885, 196, 205, 'TICKET DB · tickets', { color: TEAL });
  v.ev = s.store(885, 366, 205, 'EVENTS · outbox + audit', { color: PURPLE });
  v.rows = {};
  tickets.forEach(([key, txt, st]) => { s.row(v.tk, txt, { ...ST[st], now: true }); v.rows[key] = v.tk.rows[v.tk.rows.length - 1]; });
  events.forEach(([txt, st]) => s.row(v.ev, txt, { ...ST[st ?? 'LOG'], now: true }));
  v.uc = s.chip(90, 134, cust, { color: GREY });
  v.ua = s.chip(90, 314, a, { color: GREY });
  v.ub = s.chip(90, 494, b, { color: GREY });
  v.q = s.chip(770, 134, q, { color: GREY });
  v.sl = s.chip(770, 314, sla, { mono: true, color: GREY });
  return v;
}
// Add or update a ticket row.
async function put(s, v, key, txt, st) {
  const r = v.rows[key];
  if (!r) { v.rows[key] = await s.row(v.tk, txt, ST[st]); return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
// Append to the event log (outbox + audit); keeps the last 5 visible.
async function log(s, v, txt, st = 'LOG') {
  if (v.ev.rows.length >= 5) await s.unrow(v.ev, v.ev.rows[0]);
  return s.row(v.ev, txt, ST[st]);
}
async function clearRows(s, v) { for (const st of [v.tk, v.ev]) for (const r of [...st.rows]) await s.unrow(st, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const who = (s, v, u, txt, color = GREY) => s.setChip({ c: v.uc, a: v.ua, b: v.ub, q: v.q }[u], txt, paint(color));
const timer = (s, v, txt, color = GREY) => s.setChip(v.sl, txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, warn = { mono: true, color: AMBER, stroke: AMBER, fill: '#fdf6ea' };
const T101 = (status, rest, st) => ['T-101', T('T-101', status, rest), st];

window.DESIGN = {
  id: 'support', n: 13, title: 'Customer Support Ticketing', tagline: 'tickets as a state machine, claimed with compare-and-set, timed by SLA timers, streamed live from an outbox',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [

      why: 'Customers write in by **email, web form or chat**; **agents** work tickets from skill queues in a browser that stays connected for live updates.',
      detail: 'Every person belongs to exactly one **tenant** (the company using the helpdesk).' },
    { id: 'app', title: 'API & push', x0: 185, x1: 400, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',

    { id: 'data', title: 'Data & events', x0: 400, x1: 670, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',

    { id: 'async', title: 'Workers & side effects', x0: 670, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',

      detail: 'Each consumer is idempotent: events carry the ticket **version**.' },
  ],
  layersIntro: {
    title: 'One writer, one event log, many consumers',
    text: 'Messages arrive through the **Ticket API**, which writes the ticket and an **event** in one transaction. A relay publishes events to **Kafka**; the **router** puts the ticket in a skill queue, the **SLA worker** starts timers, the **indexer** updates search and the **push gateway** updates every open screen. Agents **claim** with a compare-and-set on the ticket version. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    customer: { x: 90, y: 85, w: 150, label: 'Customer', sub: 'email · web · chat', icon: '👤', layer: 'entry' },

    kafka: { x: 535, y: 265, w: 160, label: 'Kafka', sub: 'ticket-events', icon: '📨', layer: 'data' },
    s3: { x: 535, y: 445, w: 160, label: 'Attachments', sub: 'S3 · presigned', icon: '🪣', layer: 'data' },
    router: { x: 770, y: 85, w: 150, label: 'Router', sub: 'skill queues', icon: '🧭', layer: 'async' },

    },
    agentA: {
      name: 'Agents',

    },
    agentB: {
      name: 'Agent Ben',

      name: 'Ticket API',
      what: 'Inbound webhooks (`POST /inbound/email` from SES / SendGrid, chat, web form), `POST /tickets/{id}/claim`, replies, status changes, `GET /tickets/{id}/events?since=v`. Takes `tenantId` from the **JWT**, never from the request body.',
      why: 'One writer that validates every **state transition**, writes **ticket + event in one transaction** and dedupes webhooks.',

      without: 'Agents refresh, reply to stale tickets and work tickets someone already took.',
      tech: 'Spring WebSocket / STOMP, Redis pub/sub between gateway nodes (WebSockets are taught in 7 · Chat System)', scale: 'Add nodes; route a subscription to the node holding the socket.', fails: 'Client reconnects and asks `events?since=lastVersion`.',
      core: ['cache', 'Cache · Redis'],
    },
    tdb: {

      what: '`tickets { _id, tenantId, status, priority, queue, assignee, version, firstResponseAt }`, `messages { ticketId, author, body, attachments[] }`, `events { tenantId, ticketId, version, type, by, at, published }`.',
      why: 'Ticket and event in **one document store transaction**: the event is the **outbox** (to publish) and the **audit history** (who changed what, when).',

      tech: 'MongoDB replica set, sharded by `{ tenantId, _id }`; `version` for optimistic locking; unique `{ tenantId, sourceMessageId }`', scale: 'Shard by tenant + id so big tenants spread and small ones share.', fails: 'Primary failover: writes pause for seconds; the API retries.',
      core: ['db', 'DB scaling'],
    },
    kafka: {
      name: 'Kafka · ticket-events',
      what: 'An **outbox relay** (polling `published: false`, or MongoDB change streams) publishes each event keyed by **ticketId**, so all events of one ticket stay in order on one partition.',
      why: 'One event, many independent consumers: router, SLA, search, push, notifications, analytics.',
      without: 'The API calls five services synchronously; one slow consumer slows every reply.',
      tech: 'Kafka topic `ticket-events`, key = ticketId, 24+ partitions', scale: 'Partitions + consumer groups per consumer type.', fails: 'At-least-once delivery → consumers dedupe by `(ticketId, version)`.',
      core: ['kafka', 'Queue · Kafka'],
    },
    s3: {

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Write the ticket and its event together, route it, let exactly one agent claim it, push every change live.',
    points: [
      { t: 'Intake', color: BLUE, d: 'Email webhook → **Ticket API** → ticket **NEW** + event in one transaction (outbox).' },
      { t: 'Route', color: PURPLE, d: 'Relay → **Kafka** → router picks the **skill queue**; SLA worker starts the **timer**.' },
      { t: 'Claim', color: AMBER, d: 'Agent takes it with a **compare-and-set** on `version`: one winner, the other gets 409.' },
      { t: 'Update live', color: GREEN, d: 'Every change is an event: **push gateway** updates screens, **Notification** emails the customer.' },
    ],
    stats: [['50 k', 'tenants'], ['5 M', 'tickets / day'], ['30 min', 'first-response SLA'], ['1', 'owner per ticket']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await clearRows(s, v);
    tick(s, v, '09:58'); timer(s, v, 'timers: —'); who(s, v, 'q', 'billing queue: —');
    who(s, v, 'c', 'acme customer'); who(s, v, 'a', 'online · cap 0/5'); who(s, v, 'b', 'online · cap 0/5');

    ui.say(0); ui.cap('**Intake** · an email arrives as a webhook; ticket and event are written together');
    await s.send(['customer', 'api', 'tdb'], 'email webhook', BLUE, { ms: 420 });
    await put(s, v, 'T-101', T('T-101', 'NEW', 'v1 —'), 'NEW');
    await log(s, v, E('v1', 'created · email'));
    ui.say(1); ui.cap('**Route** · the relay publishes the event; router and SLA worker consume it');
    await s.send(['tdb', 'kafka'], 'created v1', PURPLE, { ms: 380 });
    await Promise.all([
      s.send(['kafka', 'router'], 'v1', PURPLE, { ms: 380 }),
      s.send(['kafka', 'sla'], 'v1', PURPLE, { ms: 380, pulse: false }),
    ]);
    who(s, v, 'q', 'billing queue: T-101', PURPLE); timer(s, v, 'T-101 FRT due 10:28', AMBER);
    await s.send(['kafka', 'push'], 'queue +T-101', PURPLE, { ms: 360 });
    await Promise.all([s.send(['push', 'agentA'], 'new', PURPLE, { ms: 360 }), s.send(['push', 'agentB'], 'new', PURPLE, { ms: 360, pulse: false })]);
    ui.say(2); ui.cap('**Claim** · both agents click Take; the version check lets exactly one win');
    await Promise.all([
      s.send(['agentA', 'api'], 'take v1', AMBER, { ms: 400 }),
      s.send(['agentB', 'api'], 'take v1', AMBER, { ms: 440, pulse: false }),
    ]);
    await put(s, v, 'T-101', T('T-101', 'OPEN', 'v2 Asha'), 'OPEN');
    await log(s, v, E('v2', 'assigned asha'));
    who(s, v, 'a', 'working T-101', AMBER); who(s, v, 'b', '409 · taken', GREY); who(s, v, 'q', 'billing queue: —');
    ui.say(3); ui.cap('**Update live** · Asha replies; the event reaches the screens and the customer\'s inbox');
    await s.send(['agentA', 'api', 'tdb'], 'reply', GREEN, { ms: 380 });
    await log(s, v, E('v3', 'reply asha'));
    await s.send(['tdb', 'kafka', 'push', 'customer'], 'reply v3', GREEN, { ms: 340 });
    await s.send(['kafka', 'sla', 'notify'], 'email reply', GREEN, { ms: 340 });
    who(s, v, 'c', 'got the reply ✓', GREEN); timer(s, v, 'FRT met ✓', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'intake', title: 'Email becomes a ticket', sub: 'webhook · dedupe · outbox', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'Intake is a **webhook that will be retried**, so it is idempotent: a unique index on `{ tenantId, sourceMessageId }`. Ticket, message and event are written in **one transaction**; the event row is the **outbox** a relay publishes to Kafka. Replies are threaded onto the existing ticket by `In-Reply-To` or the ticket token.',
      steps: [
        {
          title: 'The customer emails support',
          text: 'Mail to `support@acme.help` lands at the inbound provider (SES / SendGrid), which `POST`s it to `/inbound/email` with `Message-ID`, from, subject, body and attachments. The **to-address** tells us the tenant: `acme`.',
          observe: 'The webhook reaches the Ticket API.',
          focus: v => [v.n.api],
          async run(s, v) {
            await s.send(['customer', 'api'], 'email webhook', BLUE);
            who(s, v, 'c', 'sent · Message-ID m-77', BLUE);

          observe: 'The file is in S3; the message holds only its key.',
          focus: v => [v.n.s3],
          async run(s, v) {
            await s.send(['api', 's3'], 'PUT invoice.pdf', TEAL);
            await s.flash(535, 400, 'acme/T-101/invoice.pdf', ok, 700);
          },
        },
        {
          title: 'Ticket + message + event in one transaction',
          text: 'One MongoDB transaction inserts the ticket `{ _id: "T-101", tenantId: "acme", status: "NEW", version: 1 }`, the first message and an event `{ v1, created, published: false }`. The event is both the **outbox** and the first line of the **audit history**.',
          observe: 'T-101 is NEW (v1) and event v1 is waiting to be published.',
          say: 'Every change writes the ticket and an event in one transaction: a transactional outbox that doubles as the audit log.',
          focus: v => [v.rows['T-101'], v.ev],
          async run(s, v) {
            await s.send(['api', 'tdb'], 'insert · txn', BLUE);
            await put(s, v, 'T-101', T('T-101', 'NEW', 'v1 —'), 'NEW');
            v.e1 = await log(s, v, E('v1', 'created · unpublished'));
            await s.send(['api', 'customer'], '200 T-101', GREEN);
          },
        },
        {
          title: 'The provider retries the webhook',
          text: 'Our 200 took too long, so the provider sends the **same email again**. The insert hits the unique index `{ tenantId, sourceMessageId: "m-77" }` → **duplicate key** → we return 200 with the existing T-101 instead of opening T-102.',
          observe: 'Still one ticket.',
          say: 'Intake is idempotent: the email Message-ID is a unique key per tenant.',
          focus: v => [v.rows['T-101']],
          async run(s, v) {
            await s.send(['customer', 'api'], 'same webhook', AMBER);
            await s.bounce('api', 'tdb', 'insert m-77', AMBER);
            await s.flash(535, 140, 'E11000 → return T-101', warn, 800);
          },
        },
        {
          title: 'The relay publishes the event to Kafka',
          text: 'The outbox relay (a poller on `published: false`, or a MongoDB **change stream**) sends the event to `ticket-events` with key **T-101**, then marks it published. Router, SLA worker, search indexer and push gateway each consume it in their own consumer group.',
          observe: 'Router, SLA and search all receive v1.',
          focus: v => [v.n.kafka],
          async run(s, v) {
            await s.send(['tdb', 'kafka'], 'created v1', PURPLE);
            if (v.e1) { v.e1.label.textContent = E('v1', 'created · published ✓'); s.paintRow(v.e1, ST.OK); }
            await Promise.all([
              s.send(['kafka', 'router'], 'v1', PURPLE),
              s.send(['kafka', 'sla'], 'v1', PURPLE, { pulse: false }),
              s.send(['kafka', 'search'], 'v1', PURPLE, { pulse: false }),
            ]);
            who(s, v, 'q', 'billing queue: T-101', PURPLE); timer(s, v, 'T-101 FRT due 10:28', AMBER);
          },
        },
        {
          title: 'The customer replies: same ticket',
          text: 'The reply has `In-Reply-To: <T-101.acme@help>` (we set that Message-ID on our acknowledgement) and `[#T-101]` in the subject. Intake matches the thread and **appends a message** to T-101 instead of creating a new ticket.',
          observe: 'The thread grows; no new ticket.',
          focus: v => [v.ev, v.rows['T-101']],
          async run(s, v) {

@Transactional                                                    // Mongo replica set: multi-document txn
public TicketRef inbound(@RequestBody InboundEmail mail) {
  String tenant = tenants.byAddress(mail.to());                   // support@acme.help → "acme"
  Optional<Ticket> thread = tickets.findThread(tenant, mail.inReplyTo(), mail.subject());
  if (thread.isPresent()) return appendMessage(thread.get(), mail); // reply → same ticket
  try {
    Ticket t = tickets.insert(Ticket.newFrom(tenant, mail));      // unique { tenantId, sourceMessageId }
    events.insert(TicketEvent.of(t, "created"));                   // outbox row, same transaction
    return t.ref();
  } catch (DuplicateKeyException retry) {                          // provider re-sent the webhook
    return tickets.findBySource(tenant, mail.messageId()).ref();
  }
}` },

  Query q = query(where("_id").is(id).and("tenantId").is(tenant)
      .and("version").is(seenVersion).and("assignee").isNull());
  Update u = new Update().set("assignee", agent).set("status", "OPEN").inc("version", 1);
  Ticket t = mongo.findAndModify(q, u, options().returnNew(true), Ticket.class);
  if (t == null) throw new TicketConflictException(id);           // → 409, client refreshes
  events.insert(TicketEvent.of(t, "assigned"));
  return t;
}
// Same idea with Spring Data: @Version Long version → OptimisticLockingFailureException` },
      { t: 'State machine: allowed transitions', code: `enum Status { NEW, OPEN, PENDING, RESOLVED, CLOSED }

static final Map<Status, Set<Status>> NEXT = Map.of(
    NEW,      EnumSet.of(Status.OPEN, Status.PENDING, Status.RESOLVED),
    OPEN,     EnumSet.of(Status.PENDING, Status.RESOLVED),
    PENDING,  EnumSet.of(Status.OPEN, Status.RESOLVED),
    RESOLVED, EnumSet.of(Status.OPEN, Status.CLOSED),           // customer reply reopens
    CLOSED,   EnumSet.noneOf(Status.class));                     // final: reply → follow-up ticket

Ticket move(Ticket t, Status to, String by) {
  if (!NEXT.get(t.status()).contains(to)) throw new IllegalTransitionException(t.status(), to);
  Query q = query(where("_id").is(t.id()).and("status").is(t.status()).and("version").is(t.version()));
  Ticket moved = mongo.findAndModify(q, new Update().set("status", to).inc("version", 1),
                                     options().returnNew(true), Ticket.class);
  if (moved == null) throw new TicketConflictException(t.id());   // changed under us
  events.insert(TicketEvent.transition(moved, t.status(), to, by));
  return moved;
}` },

}
