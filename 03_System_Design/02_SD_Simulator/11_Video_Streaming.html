// Video streaming (YouTube-style VOD). Presigned / multipart S3 upload is taught in 06_File_Upload.html and only
// referenced here. S3, CDN, Kafka and DB basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Rendition rows in the Video storage panel: one per rung of the encoding ladder, plus the master playlist.
const ST = {
  WAIT: { fill: '#f6f7f8', stroke: KEEP, color: GREY },
  RUN: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  DONE: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
const RENDS = ['1080p', '720p', '480p', '240p'];
const NB = ' ';                                   // SVG collapses normal spaces; NBSP keeps columns aligned
const pad = (t, n) => String(t).padEnd(n, NB);
const bar = (d, n) => { const k = Math.min(10, Math.round(10 * d / n)); return '█'.repeat(k) + '░'.repeat(10 - k); };
const fmt = (r, d, n, tag = '') => `${pad(r, 6)}${bar(d, n)}${NB}${pad(`${d}/${n}`, 8)}${tag}`;
const num = x => x.toLocaleString('en-US');

// State shown next to the components: users, original, video doc, planner, Kafka, workers, CDN, origin, renditions.
function setup(s, v, { clock = '10:00:00', n = 300, rows = {}, master = null, a = 'has demo.mov · 4K', b = 'laptop · Wi-Fi', c = 'phone · 4G',
  raw = 'no original yet', vdb = 'no video yet', plan = 'idle', kaf = 'tasks —', wk = 'idle', cdn = 'edge cache —', org = 'origin ~50 req/s' } = {}) {
  v.n0 = n;
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.prog = s.store(712, 352, 378, 'VIDEO STORAGE · v-1/ renditions', { color: TEAL });
  v.rows = {};
  for (const r of RENDS) {
    const [d, st, tag] = rows[r] ?? [0, 'WAIT', ''];
    s.row(v.prog, fmt(r, d, n, tag), { ...ST[st], now: true }); v.rows[r] = v.prog.rows[v.prog.rows.length - 1];
  }
  if (master) { s.row(v.prog, master, { ...ST.DONE, now: true }); v.rows.master = v.prog.rows[v.prog.rows.length - 1]; }
  v.ua = s.chip(70, 125, a, { color: GREY });
  v.ub = s.chip(70, 335, b, { color: GREY });
  v.uc = s.chip(70, 455, c, { color: GREY });
  v.rawc = s.chip(560, 125, raw, { mono: true, color: GREY });
  v.vdb = s.chip(560, 270, vdb, { mono: true, color: TEAL });
  v.org = s.chip(560, 435, org, { mono: true, color: GREY });
  v.cdnc = s.chip(305, 405, cdn, { mono: true, color: GREY });
  v.plan = s.chip(790, 125, plan, { mono: true, color: GREY });
  v.kaf = s.chip(975, 125, kaf, { mono: true, color: PURPLE });
  v.wk = s.chip(900, 312, wk, { color: GREY });
  return v;
}
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const chip = (s, c, t, color = GREY) => s.setChip(c, t, paint(color));
const who = (s, v, u, t, color = GREY) => chip(s, u === 'B' ? v.ub : u === 'C' ? v.uc : v.ua, t, color);
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const ok = { color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { color: RED, stroke: RED, fill: '#fff4f4' };

async function prog(s, v, r, d, st, tag) {
  const done = d >= v.n0;
  st = st ?? (d === 0 ? 'WAIT' : done ? 'DONE' : 'RUN');
  tag = tag ?? (done && st === 'DONE' ? '✓' : '');
  const row = v.rows[r];
  row.label.textContent = fmt(r, d, v.n0, tag);
  s.paintRow(row, ST[st]);
  await s.pulse(row, 1, 1.03);
}
// ds = done chunks for [1080p, 720p, 480p, 240p]
const progAll = (s, v, ds) => Promise.all(RENDS.map((r, i) => prog(s, v, r, ds[i])));
async function master(s, v, text, st = 'DONE') {
  if (v.rows.master) { v.rows.master.label.textContent = text; s.paintRow(v.rows.master, ST[st]); await s.pulse(v.rows.master, 1, 1.03); return; }
  v.rows.master = await s.row(v.prog, text, ST[st]);
}
async function dropMaster(s, v) { if (v.rows.master) { await s.unrow(v.prog, v.rows.master); delete v.rows.master; } }
const ALL_DONE = { '1080p': [300, 'DONE', '✓'], '720p': [300, 'DONE', '✓'], '480p': [300, 'DONE', '✓'], '240p': [300, 'DONE', '✓'] };

window.DESIGN = {
  id: 'video', n: 11, title: 'Video Streaming (YouTube)', tagline: 'chunk and transcode in parallel, package as HLS, serve every byte from the CDN',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Creators & viewers', x0: 0, x1: 190, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Few people **upload**, a huge number **watch**. Creators send one big original; viewers run an **adaptive player** (hls.js, ExoPlayer, AVPlayer) that picks a quality per segment.',
      detail: 'Viewing bandwidth, not uploads, decides the architecture.' },
    { id: 'edge', title: 'API & CDN edge', x0: 190, x1: 430, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'The **Video API** is the control plane: it signs upload and playback URLs and owns metadata, but **never touches video bytes**. The **CDN** serves playlists and segments from an edge near the viewer.',
      detail: 'Most bytes come from the edge; the origin only fills cache misses.' },
    { id: 'data', title: 'Storage', x0: 430, x1: 690, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: '**Raw storage** (S3) keeps the original forever, **Video storage** (S3) holds the HLS output and is the CDN origin, and the **Video DB** tracks status and progress of each video.',
      detail: 'Segments are immutable objects under deterministic keys.' },
    { id: 'async', title: 'Processing pipeline', x0: 690, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'The **planner** cuts the source at keyframes into 4-second chunks and puts one task per **chunk × rendition** on Kafka. Hundreds of **transcoders** encode them in parallel.',
      detail: 'Panel bottom right: segments written per rendition of video v-1.' },
  ],
  layersIntro: {
    title: 'Upload once, transcode in parallel, stream from the edge',

  },
  nodes: {

    db: { x: 560, y: 225, w: 170, label: 'Video DB', sub: 'MongoDB · status', icon: '🍃', layer: 'data' },
    out: { x: 560, y: 390, w: 170, label: 'Video storage', sub: 'S3 · HLS origin', icon: '🎞️', layer: 'data' },
    planner: { x: 790, y: 80, w: 150, label: 'Planner', sub: 'keyframe split', icon: '✂️', layer: 'async' },
    kafka: { x: 975, y: 80, w: 150, label: 'Kafka', sub: 'transcode tasks', icon: '📨', layer: 'async' },
    workers: { x: 900, y: 265, w: 170, label: 'Transcoders', sub: 'ffmpeg × 300 pods', icon: '⚙️', layer: 'async' },
  },
  wires: [['creator', 'api'], ['creator', 'raw'], ['viewerB', 'api'], ['viewerB', 'cdn'], ['viewerC', 'cdn'], ['api', 'db'], ['raw', 'planner'], ['planner', 'db'], ['planner', 'kafka'], ['kafka', 'workers'], ['workers', 'raw'], ['workers', 'out'], ['workers', 'db'], ['cdn', 'out']],

  components: {

      name: 'Creator (uploader)',

    },
    viewerB: {
      name: 'Viewers and the adaptive player',
      what: 'The player downloads the **master playlist**, picks a rendition, and fetches ~4-second segments. After each segment it measures **throughput** and **buffer** and may switch quality.',
      why: 'Networks change second by second; the player adapts instead of stalling.',
      without: 'One fixed bitrate: weak networks buffer forever, fast ones get poor quality.',
      tech: 'HLS / DASH players: hls.js, Shaka, ExoPlayer, AVPlayer', scale: 'Millions at once; bandwidth dominates everything.', fails: 'Throughput drops → switch down at the next segment boundary.',
    },
    viewerC: {
      name: 'Viewer C (phone)',
      what: 'A second viewer on a phone; in the viral flow there are thousands like B and C behind every edge.',
      why: 'Shows that many viewers ask the same edge for the same segment at once.',
      without: '—',
      tech: 'Mobile player', scale: '—', fails: 'Slow start or errors when the origin is overloaded.',
    },

      what: '`POST /videos` creates the video and presigns upload parts; `GET /videos/{id}/play` checks access and returns a **signed CDN URL / cookies**; metadata reads.',

      without: 'Video bytes flow through app servers: huge, slow, expensive.',

      without: 'Every viewer pulls from one S3 region: high latency, huge egress bill, origin overload.',

      core: ['cdn', 'CDN'],
    },
    raw: {
      name: 'Raw storage (originals)',
      what: '`raw/v-1/original.mov`: the creator\'s file, kept after transcoding. Its `ObjectCreated` event starts the pipeline.',
      why: 'New codecs (AV1) or a better ladder later need the original, not an already compressed copy.',
      without: 'Re-encoding from a 1080p rendition loses quality every time.',
      tech: 'S3, multipart upload, lifecycle to Glacier after N days', scale: 'Petabytes.', fails: 'Very durable; event delivery is at least once, so the planner must tolerate duplicates.',
      core: ['s3', 'Object Storage (S3)'],
    },
    db: {
      name: 'Video DB',
      what: '`videos { _id: "v-1", owner, title, status: UPLOADING → PROCESSING → READY, totalTasks: 1200, doneTasks: [...], renditions, manifest }`.',
      why: 'Tracks where each video is in the pipeline; `$addToSet` makes completion counting idempotent.',
      without: 'No way to know when a video is ready, or progress counted twice on retries.',
      tech: 'MongoDB (small documents, indexed by owner)', scale: 'Small docs; sharded by video id at YouTube scale.', fails: 'Primary failover pauses status updates; workers retry their write.',
      core: ['db', 'DB scaling'],
    },
    out: {

      why: 'The CDN origin. Keys are deterministic and segments never change, so they can be cached for a year.',
      without: 'Nothing for the CDN to fetch from.',
      tech: 'S3 (as CloudFront origin)', scale: 'Rarely read directly: the CDN absorbs traffic.', fails: 'Throttles (503 SlowDown) under a miss storm → shield + collapsing.',
      core: ['s3', 'Object Storage (S3)'],
    },
    planner: {

      what: 'On the S3 event: probes the source (duration, keyframes), cuts it at **keyframes** into 4-second chunks, and creates one task per **chunk × rendition**.',
      why: 'Turns one hour-long job into thousands of small independent tasks that run in parallel.',
      without: 'One worker encodes the whole video sequentially: hours, and a crash restarts from zero.',
      tech: 'Spring Boot + ffprobe', scale: 'Cheap: it only reads metadata and publishes tasks.', fails: 'Event redelivered → same task ids → duplicates are harmless.',
    },
    kafka: {
      name: 'Kafka (transcode tasks)',
      what: '`transcode-tasks` topic: `{ taskId: "v-1/720p/007", sourceKey, byteRange, rendition }`. Key = **task id**, so one video\'s tasks spread over all partitions.',
      why: 'Buffers bursts of uploads and lets hundreds of workers share the work.',
      without: 'The planner would have to find free workers itself.',
      tech: 'Kafka (or SQS)', scale: 'Partitions ≥ number of workers; autoscale workers on consumer lag.', fails: 'At least once: an uncommitted task is redelivered after a crash.',
      core: ['kafka', 'Queue · Kafka'],
    },
    workers: {

      why: 'CPU/GPU heavy work, scaled horizontally on cheap spot instances.',

      tech: 'ffmpeg (x264 / x265 / SVT-AV1) in Kubernetes pods, spot instances or GPUs', scale: '300 pods × 12 rounds → a 1-hour video in ~5 minutes.', fails: 'Pod killed mid-task → the task is redelivered; the retry overwrites the same key.',

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Upload to S3, chunk × rendition in parallel, HLS from the edge.',
    points: [
      { t: 'Upload', color: BLUE, d: 'The API creates the video and signs URLs; the creator uploads the original **straight to S3**.' },
      { t: 'Transcode', color: PURPLE, d: 'The planner splits at keyframes into **4-s chunks**; workers encode **chunk × rendition** in parallel.' },
      { t: 'Package', color: TEAL, d: 'All tasks done → **master.m3u8** + variant playlists, status **READY**.' },
      { t: 'Play', color: GREEN, d: 'Signed CDN URL; the player streams segments from the **nearest edge** and adapts quality.' },
    ],
    stats: [['500 h', 'uploaded per minute'], ['4 s', 'per HLS segment'], ['~5 min', 'to transcode 1 h'], ['95 %+', 'bytes from the CDN']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await dropMaster(s, v);
    for (const r of RENDS) { v.rows[r].label.textContent = fmt(r, 0, 300); s.paintRow(v.rows[r], ST.WAIT); }
    tick(s, v, '10:00:00');
    who(s, v, 'A', 'has demo.mov · 4K'); who(s, v, 'B', 'laptop · Wi-Fi'); who(s, v, 'C', 'phone · 4G');
    chip(s, v.rawc, 'no original yet'); chip(s, v.vdb, 'no video yet', TEAL); chip(s, v.plan, 'idle'); chip(s, v.kaf, 'tasks —', PURPLE);
    chip(s, v.wk, 'idle'); chip(s, v.cdnc, 'edge cache —'); chip(s, v.org, 'origin ~50 req/s');

    ui.say(0); ui.cap('**Upload** · the API signs part URLs; the 6 GB original goes straight to S3');
    await s.send(['creator', 'api'], 'POST /videos', BLUE, { ms: 420 });
    await s.send(['api', 'db'], 'v-1 UPLOADING', TEAL, { ms: 400 });
    chip(s, v.vdb, 'v-1 · UPLOADING', AMBER);
    await s.send(['api', 'creator'], '600 part URLs', GREEN, { ms: 400 });
    await s.send(['creator', 'raw'], 'PUT parts 1…600', BLUE, { ms: 520 });
    chip(s, v.rawc, 'original.mov 6 GB', TEAL); who(s, v, 'A', 'uploaded', BLUE);
    ui.say(1); ui.cap('**Transcode** · 300 chunks × 4 renditions = 1,200 tasks, encoded in parallel');
    await s.send(['raw', 'planner'], 'ObjectCreated', AMBER, { ms: 420 });
    chip(s, v.plan, '300 chunks × 4', AMBER);
    await s.send(['planner', 'kafka'], '1,200 tasks', PURPLE, { ms: 400 });
    chip(s, v.kaf, 'queued 1,200', PURPLE); chip(s, v.vdb, 'v-1 · PROCESSING', AMBER);
    await s.send(['kafka', 'workers'], 'consume', PURPLE, { ms: 380 });
    chip(s, v.wk, '300 pods busy', AMBER);
    await s.send(['workers', 'raw'], 'Range GET', AMBER, { ms: 360 });
    await s.send(['workers', 'out'], 'seg_007.ts', GREEN, { ms: 380 });
    tick(s, v, '10:02:00'); await progAll(s, v, [80, 130, 220, 290]);
    tick(s, v, '10:04:00'); await progAll(s, v, [200, 260, 300, 300]);
    tick(s, v, '10:05:00'); await progAll(s, v, [300, 300, 300, 300]);
    chip(s, v.kaf, 'done 1,200', GREEN); chip(s, v.wk, 'idle');
    ui.say(2); ui.cap('**Package** · playlists written, the video is READY');
    await s.send(['workers', 'out'], 'master.m3u8', TEAL, { ms: 400 });
    await master(s, v, 'master.m3u8 · 4 variants ✓');
    await s.send(['workers', 'db'], 'READY', GREEN, { ms: 400 });
    chip(s, v.vdb, 'v-1 · READY', GREEN); who(s, v, 'A', 'published ✓', GREEN);
    ui.say(3); ui.cap('**Play** · signed URL, master playlist and segments from the nearest edge');
    await s.send(['viewerB', 'api'], 'GET /play', BLUE, { ms: 400 });
    await s.send(['api', 'viewerB'], 'signed URL', GREEN, { ms: 380 });
    await s.send(['viewerB', 'cdn'], 'master.m3u8', BLUE, { ms: 380 });
    await s.send(['cdn', 'out'], 'miss → origin', AMBER, { ms: 380 });
    chip(s, v.cdnc, 'v-1 cached', GREEN);
    await s.send(['cdn', 'viewerB'], '1080p segs', GREEN, { ms: 380 });
    who(s, v, 'B', 'watching 1080p ✓', GREEN);
    await s.send(['viewerC', 'cdn'], '240p seg · HIT', BLUE, { ms: 380 });
    await s.send(['cdn', 'viewerC'], '240p segs', GREEN, { ms: 380 });
    who(s, v, 'C', 'smooth at 240p ✓', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [

      takeaway: 'The API only **signs and records**; bytes go **straight to S3**. An S3 event lets the **planner** cut the video at keyframes into **4-second chunks** and queue **chunk × rendition** tasks. Workers encode in parallel, write segments under **deterministic keys**, mark tasks with `$addToSet`, and the last one triggers **playlists + READY**.',
      steps: [
        {

          observe: 'v-1 exists with status UPLOADING; A has 600 part URLs.',
          focus: v => [v.n.api, v.vdb],
          async run(s, v) {
            await s.send(['creator', 'api'], 'POST /videos · 6 GB', BLUE);
            await s.send(['api', 'db'], 'insert v-1 UPLOADING', TEAL);
            chip(s, v.vdb, 'v-1 · UPLOADING', AMBER); await s.pulse(v.vdb);
            await s.send(['api', 'creator'], '600 part URLs', GREEN);
          },
        },
        {
          title: 'Upload straight to S3',
          text: 'The app uploads 10 MB parts **in parallel** directly to S3 and finishes with `CompleteMultipartUpload`. A failed part is retried alone. The Video API never sees a byte of the 6 GB file.',
          observe: 'raw/v-1/original.mov (6 GB) is in Raw storage.',
          say: 'The creator uploads the original directly to S3 with presigned multipart URLs; our servers only sign.',
          focus: v => [v.n.raw, v.rawc],
          async run(s, v) {
            who(s, v, 'A', 'uploading…', AMBER);
            await s.send(['creator', 'raw'], 'PUT parts 1…600', BLUE, { ms: 700 });
            await s.send(['creator', 'raw'], 'Complete', BLUE);
            chip(s, v.rawc, 'original.mov 6 GB', TEAL); await s.pulse(v.rawc);
            who(s, v, 'A', 'uploaded · processing', BLUE);
          },
        },
        {
          title: 'S3 event → the planner splits the work',
          text: '`ObjectCreated` reaches the **planner**. `ffprobe`: 20 minutes, a keyframe every 2 s. It cuts the video **at keyframes** into **300 chunks of 4 s** and multiplies by the ladder (1080p, 720p, 480p, 240p): **1,200 tasks**. It sets `status: "PROCESSING", totalTasks: 1200`.',
          observe: '300 chunks × 4 renditions; v-1 is PROCESSING.',
          say: 'A planner splits the source at keyframes into 4-second chunks, one task per chunk and rendition.',
          focus: v => [v.n.planner, v.plan],
          async run(s, v) {
            await s.send(['raw', 'planner'], 'ObjectCreated', AMBER);
            chip(s, v.plan, '300 chunks × 4', AMBER); await s.pulse(v.plan);
            await s.send(['planner', 'db'], 'PROCESSING · 1,200', TEAL);
            chip(s, v.vdb, 'v-1 · PROCESSING', AMBER);
          },
        },
        {

          text: '`transcode-tasks ← { taskId: "v-1/720p/007", sourceKey, byteRange, rendition: "720p" }`. The message **key is the task id**, not the video id: keyed by video, all 1,200 tasks would land in one partition and only **one** consumer could work on them.',
          observe: '1,200 tasks queued across the partitions.',
          focus: v => [v.n.kafka, v.kaf],
          async run(s, v) {
            await s.send(['planner', 'kafka'], '1,200 tasks', PURPLE);
            chip(s, v.kaf, 'queued 1,200', PURPLE); await s.pulse(v.kaf);
          },
        },

class VideoController {
  static final long PART = 10 * 1024 * 1024;                     // 10 MB parts

  @PostMapping
  ResponseEntity<UploadPlan> create(@RequestBody NewVideo req, @AuthenticationPrincipal Jwt user) {
    String id = "v-" + ids.next(), key = "raw/" + id + "/original";
    String uploadId = s3.createMultipartUpload(b -> b.bucket(RAW).key(key)).uploadId();
    videos.insert(new Video(id, user.getSubject(), req.title(), Status.UPLOADING, key, uploadId));

    int parts = (int) Math.ceil(req.sizeBytes() / (double) PART);
    List<String> urls = IntStream.rangeClosed(1, parts).mapToObj(n ->
        presigner.presignUploadPart(p -> p.signatureDuration(Duration.ofHours(6))
            .uploadPartRequest(u -> u.bucket(RAW).key(key).uploadId(uploadId).partNumber(n)))
          .url().toString()).toList();
    return ResponseEntity.status(201).body(new UploadPlan(id, uploadId, urls));
  }
  // POST /videos/{id}/complete → s3.completeMultipartUpload(parts + ETags); the S3 event starts the pipeline
}` },
      { t: 'Planner: S3 event → one Kafka task per chunk × rendition', code: `@KafkaListener(topics = "raw-video-events", groupId = "planner")
void onUploaded(S3ObjectCreated e) {
  String videoId = e.videoId();                                  // raw/v-1/original
  List<Chunk> chunks = probe.chunksAtKeyframes(e.key(), Duration.ofSeconds(4));   // ffprobe → 300 chunks
  int total = chunks.size() * Rendition.LADDER.size();           // × 1080p, 720p, 480p, 240p

  mongo.updateFirst(query(where("_id").is(videoId)),
      new Update().set("status", "PROCESSING").set("totalTasks", total), Video.class);

  for (Chunk c : chunks)
    for (Rendition r : Rendition.LADDER) {
      String taskId = "%s/%s/%03d".formatted(videoId, r.name(), c.index());
      // key = task id → tasks spread over every partition (key = videoId would use ONE consumer)
      kafka.send("transcode-tasks", taskId, new Task(taskId, videoId, e.key(), c.byteRange(), c.index(), r));
    }
  // a redelivered event re-sends the same task ids: harmless, workers are idempotent
}` },

void transcode(Task t, Acknowledgment ack) throws Exception {
  Path dir = Files.createTempDirectory("task"), in = dir.resolve("chunk.mov"), out = dir.resolve("seg.ts");
  s3.getObject(b -> b.bucket(RAW).key(t.sourceKey()).range("bytes=" + t.byteRange()), in);  // only this chunk

  Process p = new ProcessBuilder("ffmpeg", "-y", "-i", in.toString(),
          "-c:v", "libx264", "-b:v", t.rendition().kbps() + "k", "-s", t.rendition().size(),
          "-c:a", "aac", "-b:a", "128k", out.toString())
      .redirectErrorStream(true).redirectOutput(dir.resolve("ffmpeg.log").toFile()).start();
  if (p.waitFor() != 0) throw new TranscodeFailed(t.taskId());   // no ack → retried, then DLQ

  String key = "%s/%s/seg_%03d.ts".formatted(t.videoId(), t.rendition().name(), t.chunk());
  s3.putObject(b -> b.bucket(OUT).key(key), out);                // same task → same key → retry overwrites

  Video v = mongo.findAndModify(query(where("_id").is(t.videoId())),
      new Update().addToSet("doneTasks", t.taskId()),            // a set: a duplicate is a no-op
      options().returnNew(true), Video.class);
  if (v.doneTasks().size() == v.totalTasks())
    kafka.send("package-video", t.videoId(), t.videoId());       // playlists + READY (idempotent too)
  ack.acknowledge();                                             // commit only after S3 + Mongo writes
}` },
