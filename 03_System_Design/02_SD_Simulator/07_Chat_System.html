// Chat system (WhatsApp-style 1:1 and groups). WebSockets are taught HERE (flow "Why WebSockets?"), not in
// Core Components. Load balancer, Redis, Kafka and DB basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Message row colours (the Message DB is the source of truth; ticks show receipts).
const ST = {
  NEW: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  SENT: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  DELIVERED: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
const fmt = (id, from, text, tick = '') => `${id.padEnd(9)}${from.padEnd(3)}${text.padEnd(13)}${tick}`;
const PRES = 'user:A→ws1 · user:C→ws1 · user:B→ws2';

// State shown next to the components: messages, the conversation counter, presence, Kafka, users.
function setup(s, v, { rows = [], clock = '12:00:00', seq = 'c-AB · lastSeq 41', pres = PRES, kaf = 'notify —', a = 'online · ws1', b = 'online · ws2', c = 'online · ws1' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.log = s.store(842, 350, 250, 'MESSAGE DB · messages', { color: TEAL });
  v.rows = {};
  rows.forEach(([key, from, text, st, tick]) => { s.row(v.log, fmt(key, from, text, tick), { ...ST[st], now: true }); v.rows[key] = v.log.rows[v.log.rows.length - 1]; });
  v.seq = s.chip(695, 468, seq, { mono: true, color: TEAL });
  v.pres = s.chip(695, 128, pres, { mono: true, color: RED });
  v.kaf = s.chip(965, 198, kaf, { mono: true, color: PURPLE });
  v.ua = s.chip(70, 121, a, { color: GREY });
  v.uc = s.chip(70, 261, c, { color: GREY });
  v.ub = s.chip(70, 416, b, { color: GREY });
  return v;
}
async function put(s, v, key, from, text, st, tick = '') {
  const txt = fmt(key, from, text, tick), r = v.rows[key];
  if (!r) { v.rows[key] = await s.row(v.log, txt, ST[st]); return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
async function clearRows(s, v) { for (const r of [...v.log.rows]) await s.unrow(v.log, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const seq = (s, v, t) => s.setChip(v.seq, t);
const pres = (s, v, t, color = RED) => s.setChip(v.pres, t, { color });
const kaf = (s, v, t, color = PURPLE) => s.setChip(v.kaf, t, { color });
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : u === 'C' ? v.uc : v.ua, txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' };

window.DESIGN = {
  id: 'chat', n: 7, title: 'Chat System', tagline: 'one open WebSocket per device, one sequence per conversation, sync is the guarantee',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Devices & load balancer', x0: 0, x1: 300, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Every online device keeps **one WebSocket** open: a single TCP connection that both sides can write to at any time. The **load balancer** spreads **new connections**, not requests.',
      detail: 'The limit is open connections (memory, file descriptors), not requests per second.' },
    { id: 'app', title: 'WebSocket gateways', x0: 300, x1: 560, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'Gateways only **hold sockets**: authenticate the upgrade, register **presence**, forward frames to the Chat Service and push frames down to devices.',
      detail: 'Thin and non-blocking (Netty / WebFlux): 100 k+ sockets per node.' },

      why: 'The **Chat Service** dedupes by `clientMsgId`, assigns a **per-conversation sequence**, stores, acks and routes. **Presence** (Redis) says which gateway holds each user.',
      detail: 'The **seq** is the order every device shows and the cursor every device syncs from.' },
    { id: 'async', title: 'Offline path', x0: 830, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'Offline users get a **push** through Kafka and FCM / APNs. A push is only a **wake-up hint**: the message itself arrives by **sync** when the app reconnects.',
      detail: 'The Message DB (bottom right) is the source of truth for history.' },

  layersIntro: {

    lb: { x: 225, y: 220, w: 128, label: 'Load Balancer', sub: 'L4 · upgrade', icon: '⚖️', layer: 'entry' },
    ws1: { x: 430, y: 110, w: 160, label: 'WS Gateway 1', sub: 'holds sockets', icon: '🔌', layer: 'app' },
    ws2: { x: 430, y: 330, w: 160, label: 'WS Gateway 2', sub: 'holds sockets', icon: '🔌', layer: 'app' },
    presence: { x: 695, y: 80, w: 160, label: 'Presence', sub: 'Redis · user → gw', icon: '⚡', layer: 'data' },
    chat: { x: 695, y: 240, w: 160, label: 'Chat Svc', sub: 'dedupe · seq · route', icon: '💬', layer: 'data' },
    msgdb: { x: 695, y: 420, w: 160, label: 'Message DB', sub: 'by conversation', icon: '🍃', layer: 'data' },
    kafka: { x: 965, y: 150, w: 170, label: 'Kafka', sub: 'offline notify', icon: '📨', layer: 'async' },
    push: { x: 965, y: 270, w: 170, label: 'Push (FCM)', sub: 'external', icon: '📲', layer: 'async' },

  wires: [['userA', 'lb'], ['userC', 'lb'], ['userB', 'lb'], ['lb', 'ws1'], ['lb', 'ws2'], ['ws1', 'presence'], ['ws2', 'presence'], ['ws1', 'chat'], ['ws2', 'chat'], ['chat', 'presence'], ['chat', 'msgdb'], ['chat', 'kafka'], ['kafka', 'push']],

  components: {

    userB: {

      without: '—',

      without: 'Chat logic inside the socket servers: every deploy of business code drops millions of sockets.',
      tech: 'Netty / Spring WebFlux / Spring `WebSocketHandler`', scale: '~100 k+ sockets per node; add nodes.', fails: 'A crash drops all its sockets; presence entries expire by TTL; clients reconnect.',
    },
    ws2: {

      what: 'Same as gateway 1; B is connected here in most flows.',
      why: 'Two gateways show why we need presence: A and B are on different machines.',
      without: '—',
      tech: 'Same', scale: 'Same', fails: 'Crashes in the last flow.',
    },
    presence: {
      name: 'Presence registry',
      what: '`user:B → "ws2"` with a **TTL** (60 s) refreshed by heartbeats every 20 s.',
      why: 'The Chat Service must know **which gateway** holds the recipient\'s socket.',
      without: 'Broadcast every message to every gateway, or no way to tell online from offline.',
      tech: 'Redis `SET user:B ws2 EX 60` + `EXPIRE` on heartbeat', scale: 'Tiny values, very high read rate.', fails: 'Stale entry after a crash → delivery fails → treat as offline (push + sync).',
      core: ['cache', 'Cache · Redis'],
    },
    chat: {
      name: 'Chat Service',
      what: 'Dedupes by `(conv, clientMsgId)`, increments the conversation\'s `lastSeq`, stores the message, acks the sender, looks up presence and routes; records receipts.',
      why: 'One place decides order and identity of messages.',
      without: 'Gateways would each number messages differently and duplicates would slip through.',
      tech: 'Spring Boot, stateless', scale: 'Partition work by conversation id.', fails: 'Crash after storing → the client resends → deduped, original seq acked.',
    },
    msgdb: {

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Open socket, next seq, ack, route: sync covers the rest.',
    points: [
      { t: 'Socket', color: AMBER, d: 'Each device keeps **one WebSocket** to a gateway; presence records **user → gateway**.' },
      { t: 'Sequence', color: TEAL, d: 'Chat Svc gives the message the next **seq** of its conversation and stores it.' },
      { t: 'Ack & route', color: BLUE, d: 'Sender gets **✓**; presence finds B\'s gateway; B acks and A sees **✓✓**.' },
      { t: 'Offline', color: PURPLE, d: 'No socket? A **push** wakes the phone; it **syncs** everything after its last seq.' },
    ],
    stats: [['10 M', 'open sockets'], ['100 k+', 'sockets / gateway'], ['< 300 ms', 'online delivery'], ['0', 'lost messages']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await clearRows(s, v);
    seq(s, v, 'c-AB · lastSeq 41'); pres(s, v, 'user:A→ws1 · user:C→ws1'); kaf(s, v, 'notify —');
    who(s, v, 'A', 'online · ws1'); who(s, v, 'B', 'offline'); who(s, v, 'C', 'online · ws1');

    ui.say(0); ui.cap('**Socket** · B opens one WebSocket; the gateway records where B is connected');
    await s.send(['userB', 'lb', 'ws2'], 'Upgrade: websocket', AMBER, { ms: 420 });
    await s.send(['ws2', 'lb', 'userB'], '101 Switching', GREEN, { ms: 380 });
    await s.send(['ws2', 'presence'], 'SET user:B ws2', RED, { ms: 400 });
    pres(s, v, PRES); who(s, v, 'B', 'online · ws2', GREEN);
    ui.say(1); ui.cap('**Sequence** · A sends "Hi"; Chat Svc assigns seq 42 and stores it');
    await s.send(['userA', 'lb', 'ws1', 'chat'], '"Hi" · a-901', BLUE, { ms: 400 });
    await s.send(['chat', 'msgdb'], 'lastSeq → 42', TEAL, { ms: 420 });
    seq(s, v, 'c-AB · lastSeq 42');
    await put(s, v, 'c-AB:42', 'A', 'Hi', 'NEW');
    ui.say(2); ui.cap('**Ack & route** · ✓ to A, presence says ws2, B gets it and acks: ✓✓');
    await s.send(['chat', 'ws1', 'lb', 'userA'], 'ack 42 ✓', GREEN, { ms: 360 });
    await put(s, v, 'c-AB:42', 'A', 'Hi', 'SENT', '✓');
    await s.send(['chat', 'presence'], 'GET user:B', RED, { ms: 380 });
    await s.send(['chat', 'ws2', 'lb', 'userB'], 'seq 42 "Hi"', BLUE, { ms: 380 });
    who(s, v, 'B', 'got "Hi"', GREEN);
    await s.send(['userB', 'lb', 'ws2', 'chat'], 'delivered 42', GREEN, { ms: 360 });
    await put(s, v, 'c-AB:42', 'A', 'Hi', 'DELIVERED', '✓✓');
    who(s, v, 'A', '"Hi" ✓✓', GREEN);
    ui.say(3); ui.cap('**Offline** · C is offline: a push wakes the phone, the app syncs after its last seq');
    who(s, v, 'C', 'offline · seq 41', GREY); pres(s, v, 'user:A→ws1 · user:B→ws2');
    await s.send(['chat', 'kafka', 'push'], 'notify C', PURPLE, { ms: 400 });
    kaf(s, v, 'notify @88 → C');
    await s.flash(70, 175, '📲 A: Hi', { color: PURPLE, stroke: PURPLE }, 700);
    await s.send(['userC', 'lb', 'ws1', 'chat', 'msgdb'], 'sync > 41', TEAL, { ms: 360 });
    await s.send(['chat', 'ws1', 'lb', 'userC'], '[42]', GREEN, { ms: 360 });
    who(s, v, 'C', 'synced · has 42', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'ws', title: 'Why WebSockets?', sub: 'polling vs one open socket', color: AMBER,
      build: (s, v) => setup(s, v, { pres: 'user:A→ws1 · user:C→ws1', b: 'polling every 3 s' }),
      takeaway: 'Polling asks "anything new?" millions of times a second and still arrives late. A **WebSocket** is upgraded from HTTP **once** (`101 Switching Protocols`) and then stays open, so the server **pushes** each message the moment it exists. Heartbeats keep it (and presence) alive.',
      steps: [
        {
          title: '❌ Polling: "anything new?" every 3 seconds',
          text: 'Without a socket, B\'s app sends `GET /conversations/c-AB/messages?afterSeq=41` every 3 s. Almost every answer is **empty**. With 10 M online users that is **~3.3 M requests/s**, each with headers, TLS and auth.',
          observe: 'Three polls, three empty answers.',
          focus: v => [v.n.userB, v.ub],
          async run(s, v) {
            for (let i = 1; i <= 3; i++) {
              await s.send(['userB', 'lb', 'ws2', 'chat'], 'GET ?afterSeq=41', BLUE, { ms: 320 });
              await s.send(['chat', 'ws2', 'lb', 'userB'], '[] empty', GREY, { ms: 300 });
              who(s, v, 'B', `polls ${i} · all empty`, AMBER);
            }
          },
        },
        {
          title: '❌ ...and messages still arrive late',
          text: 'A sends "Hi" at 12:00:00.5. It is stored at once, but B only sees it on its **next poll**, up to 3 s later. Polling faster makes the load worse; polling slower makes chat feel broken. (Long polling helps, but each answer still costs a new request.)',
          observe: 'B gets "Hi" about 2.5 s after it was sent.',
          say: 'Polling either wastes millions of empty requests or delivers late.',
          focus: v => [v.n.userB],
          async run(s, v) {

            await s.send(['chat', 'msgdb'], 'seq 42', TEAL);
            seq(s, v, 'c-AB · lastSeq 42'); await put(s, v, 'c-AB:42', 'A', 'Hi', 'SENT', '✓');
            await s.flash(70, 330, 'waiting for the next poll…', { color: AMBER, stroke: AMBER }, 900);
            tick(s, v, '12:00:03');
            await s.send(['userB', 'lb', 'ws2', 'chat'], 'GET ?afterSeq=41', BLUE, { ms: 320 });
            await s.send(['chat', 'ws2', 'lb', 'userB'], '[42 "Hi"]', AMBER, { ms: 320 });
            who(s, v, 'B', 'got "Hi" 2.5 s late', RED);
          },
        },
        {
          title: '✅ Upgrade to a WebSocket once',
          text: 'B sends `GET /ws` with `Upgrade: websocket` and its JWT. The gateway checks the token **once** and answers **`101 Switching Protocols`**. The TCP connection now stays open and carries small **frames** in both directions. The gateway writes presence: `SET user:B ws2 EX 60`.',
          observe: 'B has an open socket on ws2; presence knows it.',
          say: 'A WebSocket is one HTTP upgrade, then a long-lived two-way connection.',
          focus: v => [v.n.ws2, v.pres],
          async run(s, v) {
            tick(s, v, '12:00:05');
            await s.send(['userB', 'lb', 'ws2'], 'GET /ws · Upgrade', AMBER);
            await s.send(['ws2', 'lb', 'userB'], '101 Switching Protocols', GREEN);
            who(s, v, 'B', 'socket open · ws2', GREEN);
            await s.send(['ws2', 'presence'], 'SET user:B ws2 EX 60', RED);
            pres(s, v, PRES); await s.pulse(v.pres);
          },
        },
        {
          title: '✅ The server pushes the moment a message exists',
          text: 'A sends "Hi again". The Chat Service stores seq 43, looks up B (`ws2`) and **writes a frame** to B\'s open socket. No request from B, no empty answers: about **100 ms** end to end.',
          observe: 'B gets the message almost instantly.',
          focus: v => [v.n.userB],
          async run(s, v) {
            await s.send(['userA', 'lb', 'ws1', 'chat'], '"Hi again"', BLUE);
            await s.send(['chat', 'msgdb'], 'seq 43', TEAL);
            seq(s, v, 'c-AB · lastSeq 43'); await put(s, v, 'c-AB:43', 'A', 'Hi again', 'SENT', '✓');
            await s.send(['chat', 'presence'], 'GET user:B', RED);
            await s.send(['chat', 'ws2', 'lb', 'userB'], 'frame seq 43', GREEN);
            who(s, v, 'B', 'got it in ~100 ms', GREEN);
          },
        },
        {
          title: 'Keep it alive: heartbeats',
          text: 'Every ~20 s the app sends `ping`, the gateway answers `pong` and refreshes presence (`EXPIRE user:B 60`). Heartbeats detect dead connections and stop proxies / the LB from closing an **idle** socket (keep the LB idle timeout above the interval). The cost moves from requests to **open connections**: memory and file descriptors per socket.',
          observe: 'Ping, pong, presence TTL refreshed.',
          say: 'Heartbeats keep the socket and the presence entry alive.',
          focus: v => [v.n.ws2, v.pres],
          async run(s, v) {
            tick(s, v, '12:00:25');
            await s.send(['userB', 'lb', 'ws2'], 'ping', GREY);
            await s.send(['ws2', 'lb', 'userB'], 'pong', GREEN);
            await s.send(['ws2', 'presence'], 'EXPIRE user:B 60', RED);
            await s.pulse(v.pres);
          },
        },
      ],
    },
    {
      id: 'happy', title: 'A → B: "Hi"', sub: 'seq · store · ack · route · ✓✓', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'The server, not the phone, decides the order: **next seq of the conversation**. One tick = stored on the server, two ticks = the recipient\'s device acked it. Receipts use `$max`, so they only move forward.',
      steps: [
        {
          title: 'A sends a frame over its socket',
          text: '`{ type: "send", conv: "c-AB", clientMsgId: "a-901", text: "Hi" }`. The **clientMsgId** is generated on the phone and stored in the app\'s local outbox until the server acks it.',
          observe: 'The frame reaches the Chat Service through gateway 1.',
          focus: v => [v.n.chat],
          async run(s, v) {
            who(s, v, 'A', '"Hi" 🕓 sending', AMBER);
            await s.send(['userA', 'lb', 'ws1', 'chat'], 'send "Hi" · a-901', BLUE);
          },
        },
        {
          title: 'Next seq, then store',
          text: '`findOneAndUpdate({ _id: "c-AB" }, { $inc: { lastSeq: 1 } })` → **42**, then insert `{ _id: "c-AB:42", seq: 42, clientMsgId: "a-901", from: "A", text: "Hi" }`. The `$inc` on one document is atomic, so two senders never get the same seq.',

          say: 'The server assigns the next sequence number of the conversation and stores the message.',
          focus: v => [v.seq, v.log],
          async run(s, v) {
            await s.send(['chat', 'msgdb'], '$inc lastSeq → 42', TEAL);

            await put(s, v, 'c-AB:42', 'A', 'Hi', 'NEW');
          },
        },
        {
          title: 'Ack the sender: one tick',
          text: '`{ type: "ack", clientMsgId: "a-901", seq: 42 }`. A\'s app removes the message from its local outbox and shows **✓** (stored on the server).',
          observe: 'A sees one tick.',
          focus: v => [v.n.userA],
          async run(s, v) {
            await s.send(['chat', 'ws1', 'lb', 'userA'], 'ack seq 42', GREEN);
