<html lang="en">

<script src="engine/scene.js"></script>
<script src="engine/player.js"></script>
<script src="engine/catalog.js"></script>
<script>
// URL Shortener (TinyURL / bit.ly). Everything specific to this design lives here; engine/app.js renders it.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const LONG = 'shop.ex/sale';

// State shown next to the components: the counter, the pod's ID block, the urls collection, the cache.
function setup(s, v, { pod = 'block: empty', counter = 1000001, db = [], cache = [] } = {}) {
  v.idc = s.chip(752, 62, `counter next = ${counter}`, { anchor: 'start', mono: true, color: AMBER });
  v.pod = s.chip(445, 92, pod, { mono: true, color: TEAL });
  v.db = s.store(752, 226, 150, 'URLS  (_id = code)', { color: AMBER });
  v.cache = s.store(752, 432, 150, 'REDIS', { color: AMBER });
  for (const r of db) s.row(v.db, r, { now: true });
  for (const r of cache) s.row(v.cache, r, { now: true });
  return v;
}
const SEED = { pod: 'next 1000003 / 1001000', counter: 1001001, db: [`4c93 → ${LONG}`, '4c94 → blog.ex/post'] };
const rowOf = (st, prefix) => st.rows.find(r => r.label.textContent.startsWith(prefix));

window.DESIGN = {
  id: 'url', n: 1, title: 'URL Shortener', tagline: 'TinyURL / bit.ly: unique short codes, millisecond redirects',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Entry', x0: 0, x1: 340, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'One front door. Spreads traffic over many identical pods, terminates TLS and sends **writes** and **reads** to different services.',
      detail: 'Clients only ever know one hostname (`sho.rt`). Everything behind it can scale, fail and be redeployed without the client noticing.' },
    { id: 'app', title: 'Services', x0: 340, x1: 552, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'Stateless business logic, split into a **write** service and a **read** service because their load differs ~100×.',
      detail: 'Stateless means any pod can serve any request, so we add or kill pods freely. All state lives one layer to the right.' },
    { id: 'data', title: 'Data & IDs', x0: 552, x1: 914, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'Where state lives: **unique ID allocation**, the **durable** code → URL mapping, and a **cache** for hot codes.',
      detail: 'Each store has one job: the counter guarantees uniqueness, MongoDB guarantees durability, Redis guarantees speed.' },
    { id: 'async', title: 'Async', x0: 914, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'Work the user must **not wait for**. Click events are queued and counted later, so analytics can never slow down or break a redirect.',
      detail: 'A queue between the hot path and analytics absorbs bursts and lets each side fail independently.' },
  ],
  layersIntro: {
    title: 'Four layers, each with one job',
    text: 'Read the diagram left to right: requests **enter**, are handled by **stateless services**, which read and write **state**, and push slow work to the **async** side. Click a layer or a component to see why it exists and what breaks without it.',
  },
  nodes: {
    client: { x: 80, y: 260, w: 140, label: 'Client', sub: 'browser / app', icon: '👤', layer: 'entry' },
    lb: { x: 250, y: 260, w: 150, label: 'Load Balancer', sub: 'L7 · routes by path', icon: '⚖️', layer: 'entry' },
    shortener: { x: 445, y: 140, label: 'Shortener API', sub: 'POST /urls · write', icon: '✏️', layer: 'app' },
    redirect: { x: 445, y: 385, label: 'Redirect Service', sub: 'GET /{code} · read', icon: '↪️', layer: 'app' },
    idgen: { x: 655, y: 62, label: 'ID Range Service', sub: 'hands out ID blocks', icon: '🔑', layer: 'data' },
    mongo: { x: 655, y: 260, label: 'MongoDB', sub: 'urls · source of truth', icon: '🍃', layer: 'data' },
    redis: { x: 655, y: 455, label: 'Redis cache', sub: 'hot codes · TTL', icon: '⚡', layer: 'data' },
    analytics: { x: 1005, y: 150, w: 160, label: 'Analytics', sub: 'click counts', icon: '📊', layer: 'async' },
    kafka: { x: 1005, y: 385, w: 160, label: 'Kafka', sub: 'click-events', icon: '📨', layer: 'async' },
  },
  wires: [['client', 'lb'], ['lb', 'shortener'], ['lb', 'redirect'], ['shortener', 'idgen'], ['shortener', 'mongo'], ['redirect', 'redis'], ['redirect', 'mongo'], ['redirect', 'kafka'], ['kafka', 'analytics']],

  components: {
    client: {
      what: 'Browsers, mobile apps and API clients. A few users **create** links; far more **click** them (about 100 clicks per link).',
      why: 'Both traffic patterns start here, and the client decides how often clicks reach us: a browser caches a **301** forever but re-asks on a **302**.',
      without: 'Not optional, but a design detail matters: answer with 301 and repeat clicks never reach you, so you lose analytics and cannot expire the link.',
      tech: 'Any HTTP client', scale: 'Not ours to scale; plan for reads ≈ 100× writes.', fails: 'Clients retry on timeouts, so a create should be safe to retry (idempotency key).',
    },
    lb: {
      name: 'Load Balancer (L7)',
      what: 'Single entry point for `sho.rt`. Terminates TLS, health-checks pods, and routes by path: `POST /urls` → Shortener, `GET /{code}` → Redirect.',
      why: 'Spreads load over many **stateless** pods and lets the write path and the read path scale **independently**.',
      without: 'Clients would need to know every pod, one pod would take all traffic, and a dead pod would keep receiving requests.',
      tech: 'AWS ALB / NGINX / Envoy, often behind a CDN or edge network', scale: 'Managed or horizontal; redundant across availability zones.', fails: 'Health checks drop bad pods; DNS fails over between LBs.',
    },
    shortener: {
      name: 'Shortener API (write path)',
      what: 'Validates the long URL, takes the next ID from its **in-memory block**, Base62-encodes it and inserts `code → URL` into MongoDB.',
      why: 'Keeps all write rules (validation, ID allocation, custom aliases, abuse checks, rate limits) in one place, away from the latency-critical read path.',
      without: 'Reads and writes share one service: a burst of creates or a slow URL safety check would slow down every redirect.',
      tech: 'Spring Boot, stateless pods', scale: '~40 writes/s on average: two or three pods. Add pods freely; each reserves its own ID block.', fails: 'A crash loses the unused part of its ID block, leaving harmless gaps in the ID sequence.',
    },
    redirect: {
      name: 'Redirect Service (read path)',
      what: 'Looks up the code (Redis first, MongoDB on a miss), answers **302** with `Location`, then emits a click event without waiting.',
      why: 'Reads are ~100× writes and every millisecond is user-visible. A small dedicated service can be scaled and tuned (pools, timeouts) just for this.',
      without: 'The busiest path would compete with writes for threads and DB connections, and you could not scale reads on their own.',
      tech: 'Spring WebFlux / Netty / Go: anything fast and non-blocking', scale: 'Most pods live here; autoscale on requests per second.', fails: 'Redis down → read MongoDB (behind a circuit breaker). Kafka down → drop click events, never fail the redirect.',
    },
    idgen: {
      name: 'ID Range Service',
      what: 'Owns one counter. Hands out **blocks** of 1,000 IDs with one atomic increment (`next += 1000`).',
      why: 'Makes every short code **unique by construction**: no collision check, and pods never coordinate per URL.',
      without: 'You hash or randomise codes and must check the database on every create, retrying on clashes, which gets slower as the table fills.',
      tech: 'MongoDB `findOneAndUpdate` + `$inc` (or a DB sequence, Redis `INCRBY`, ZooKeeper)', scale: 'Called once per 1,000 links per pod: almost no load. Give busy pods bigger blocks.', fails: 'Pods keep creating links from their current block; it runs on the replicated database.',
    },
    mongo: {
      name: 'MongoDB (source of truth)',
      what: 'One document per code: `{ _id: code, longUrl, owner, createdAt, expiresAt }`, plus a TTL index on `expiresAt`.',
      why: 'Durable storage of every mapping. Using the code as `_id` gives a single primary-key lookup **and** uniqueness for free (aliases too).',
      without: 'Links would live only in a cache and vanish on eviction or restart.',
      tech: 'MongoDB replica set (DynamoDB / Cassandra fit equally: it is a key → value lookup)', scale: '~600 GB per year: shard by hashed `_id`. Redis absorbs most reads.', fails: 'Primary failover pauses writes for a few seconds; cached redirects keep working.',
    },
    redis: {
      name: 'Redis cache',
      what: 'Keeps `url:{code} → longUrl` for hot codes, with a TTL; LRU evicts cold codes.',
      why: 'Turns the hot path into one in-memory lookup (~1 ms) and shields MongoDB. Clicks follow a power law, so a small cache serves most traffic.',
      without: 'Every click hits the database: 4k–40k reads/s on MongoDB, higher latency and a much bigger database bill.',
      tech: 'Redis cluster or primary + replicas, `maxmemory-policy allkeys-lru`', scale: 'Memory for the hot links only; add shards.', fails: 'Down → reads fall through to MongoDB. A viral key expiring → stampede, unless single-flight.',
    },
    kafka: {
      name: 'Kafka (click-events)',
      what: 'Durable buffer of click events `{code, ts, country, referrer}`, partitioned by code.',
      why: 'Decouples analytics from redirects: the redirect returns at once, bursts are absorbed, and analytics processes at its own pace.',
      without: 'Every click would wait for an analytics write, and an analytics outage would break redirects.',
      tech: 'Kafka (or Kinesis / Pub/Sub)', scale: 'More partitions and consumers.', fails: 'Down → the redirect drops or briefly buffers events and counts a metric. Redelivery → counts are at-least-once.',
    },
    analytics: {
      name: 'Analytics',
      what: 'Consumes click events in **batches** and stores aggregates per code, day, country and referrer.',
      why: 'Creators want click stats. Aggregating in batches turns thousands of tiny writes into a few big ones and keeps dashboards fast.',
      without: 'No click stats, or expensive per-click writes on the hot path.',
      tech: 'Kafka consumer → ClickHouse / Druid, or MongoDB / Redis counters', scale: 'Batch size and number of consumers.', fails: 'Lag only delays the dashboards; redirects are unaffected.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Long URL in, short code out. Code in, 302 out.',
    points: [
      { t: 'Create', color: BLUE, d: 'Shortener takes a unique ID from its reserved block, Base62-encodes it (1000001 → `4c93`) and stores code → URL.' },
      { t: 'First click', color: TEAL, d: 'Redirect Service checks Redis, misses, reads MongoDB, fills the cache and answers **302**.' },
      { t: 'Every next click', color: GREEN, d: 'Served straight from Redis in ~1 ms. MongoDB is not touched.' },
      { t: 'Analytics', color: PURPLE, d: 'After answering, each redirect drops a click event on Kafka; Analytics counts them in batches.' },
    ],
    stats: [['100 M', 'new links / month'], ['~4 k/s', 'redirects (avg)'], ['100 : 1', 'reads : writes'], ['7 chars', '≈ 3.5 trillion codes']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; v.clicks = 0; }
    for (const r of [...v.db.rows]) await s.unrow(v.db, r);
    for (const r of [...v.cache.rows]) await s.unrow(v.cache, r);
    s.setChip(v.pod, 'block: empty');
    s.setSub(v.n.analytics, 'click counts');
    v.clicks = 0;

    ui.say(0); ui.cap('**Create** · the client sends `POST /urls` with the long URL');
    await s.send(['client', 'lb', 'shortener'], 'POST /urls', BLUE, { ms: 480 });
    ui.cap('The pod has no IDs left, so it reserves a **block of 1,000** with one atomic `$inc`');
    await s.send(['shortener', 'idgen'], '$inc +1000', BLUE, { ms: 480 });
    s.setChip(v.idc, 'counter next = 1001001');
    await s.send(['idgen', 'shortener'], '1000001–1001000', BLUE, { ms: 480 });
    s.setChip(v.pod, 'next 1000001 / 1001000');
    ui.cap('ID **1000001** → Base62 → **4c93**, stored with `_id = "4c93"`');
    await s.flash(445, 205, '1000001 → base62 → 4c93', { mono: true, color: BLUE, stroke: BLUE }, 700);
    s.setChip(v.pod, 'next 1000002 / 1001000');
    await s.send(['shortener', 'mongo'], 'insert 4c93', BLUE, { ms: 480 });
    await s.row(v.db, `4c93 → ${LONG}`);
    await s.send(['shortener', 'lb', 'client'], '201 sho.rt/4c93', GREEN, { ms: 480 });

    ui.say(1); ui.cap('**First click** · `GET /4c93` goes to the read path');
    await s.send(['client', 'lb', 'redirect'], 'GET /4c93', TEAL, { ms: 480 });
    ui.cap('Redis first: **miss**');
    await s.send(['redirect', 'redis'], 'GET url:4c93', TEAL, { ms: 440 });
    await s.flash(655, 410, 'miss', { color: RED, stroke: RED, fill: '#fff4f4' }, 350);
    ui.cap('Read MongoDB by primary key, then fill Redis with a TTL');
    await s.send(['redirect', 'mongo'], 'findById 4c93', TEAL, { ms: 440 });
    await s.send(['mongo', 'redirect'], LONG, TEAL, { ms: 440 });
    await s.send(['redirect', 'redis'], 'SET EX 86400', TEAL, { ms: 440 });
    await s.row(v.cache, 'url:4c93 · TTL 24h');
    ui.cap('Answer **302 Found** with `Location: https://shop.ex/sale`');
    const click = async () => { await s.send(['redirect', 'kafka'], 'click 4c93', PURPLE, { ms: 420 }); v.clicks++; s.setSub(v.n.kafka, `${v.clicks} event${v.clicks > 1 ? 's' : ''} queued`); };
    await s.send(['redirect', 'lb', 'client'], '302 Location', TEAL, { ms: 480 });
    const firstClick = click();

    ui.say(2); ui.cap('**Next clicks** · Redis **hit**, ~1 ms, MongoDB is not touched');
    const hit = async delay => {
      await s.wait(delay);
      await s.send(['client', 'lb', 'redirect'], 'GET /4c93', GREEN, { ms: 420 });
      await s.send(['redirect', 'redis'], 'GET', GREEN, { ms: 360 });
      await s.send(['redis', 'redirect'], 'hit ✓', GREEN, { ms: 360 });
      await s.send(['redirect', 'lb', 'client'], '302', GREEN, { ms: 420 });
      await click();
    };
    await Promise.all([firstClick, hit(0), hit(900), hit(1800)]);

    ui.say(3); ui.cap('**Analytics** · Kafka buffers click events; Analytics counts them in **batches**, off the hot path');
    await s.send(['kafka', 'analytics'], `batch ×${v.clicks}`, PURPLE, { ms: 620 });
    s.setSub(v.n.kafka, 'lag 0');
    s.setSub(v.n.analytics, `4c93 · ${v.clicks} clicks`, GREEN);
    await s.pulse(v.n.analytics);
    await s.wait(2200);
    ui.say(-1); ui.cap('');
    await s.wait(500);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'create', title: 'Create a short URL', sub: 'ID block → Base62 → insert', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'Unique IDs (reserved in blocks) + Base62 = short codes with **no collision checks**. A create costs one insert, plus one ID-block call per 1,000 links.',
      steps: [
        {
          title: 'User submits a long URL',
          text: 'User A pastes `https://shop.ex/sale?utm=…` and clicks Shorten. The client sends **POST /urls** with the long URL, and optionally a custom alias and an expiry date.',
          observe: 'The request reaches the load balancer.',
          say: 'Creating a link is one POST with the long URL; it returns the short URL.',
          focus: v => [v.n.client, v.n.lb],
          async run(s) { await s.send(['client', 'lb'], 'POST /urls', BLUE); },
        },
        {
          title: 'The load balancer routes writes to the Shortener',
          text: 'The L7 load balancer routes by path: **POST /urls** goes to the Shortener API (write path), **GET /{code}** goes to the Redirect Service (read path). Splitting them lets the read side grow ~100× bigger without dragging the write side along.',
          observe: 'The request goes up to the write path, not down to the read path.',
          say: 'I split the read and write paths because reads outnumber writes about 100 to 1.',
          focus: v => [v.n.shortener],
          async run(s) { await s.send(['lb', 'shortener'], 'POST /urls', BLUE); },
        },
        {
          title: 'No IDs left in the pod → reserve a block',
          text: 'Each Shortener pod keeps a **block of 1,000 IDs** in memory. This pod just started, so its block is empty. The ID Range Service does one atomic `$inc` of 1,000 on its counter and returns **1000001–1001000**. Two pods can never receive the same block.',
          observe: 'The counter jumps by 1,000 and the pod now owns IDs 1000001 to 1001000.',
          say: 'Unique IDs come from blocks reserved with one atomic increment, so pods never coordinate per URL.',
          focus: v => [v.n.idgen, v.idc, v.pod],
          async run(s, v) {
            await s.send(['shortener', 'idgen'], '$inc +1000', BLUE);
            s.setChip(v.idc, 'counter next = 1001001'); await s.pulse(v.idc);
            await s.send(['idgen', 'shortener'], '1000001–1001000', BLUE);
            s.setChip(v.pod, 'next 1000001 / 1001000'); await s.pulse(v.pod);
          },
        },
        {
          title: 'Take the next ID and Base62-encode it',
          text: 'The pod takes **1000001** from memory (no network call) and writes it in base 62 with the alphabet `0-9 a-z A-Z`: 1000001 = 4·62³ + 12·62² + 9·62 + 3 → **"4c93"**. Seven Base62 characters give 62⁷ ≈ **3.5 trillion** codes: centuries at 100 M links a month.',
          observe: 'The number 1000001 becomes the code 4c93.',
          say: 'Base62 of a unique number gives a short code that needs no collision check.',
          focus: v => [v.pod, v.enc],
          async run(s, v) {
            v.enc = s.chip(445, 205, '1000001 → base62 → 4c93', { mono: true, color: BLUE, stroke: BLUE });
            await s.pop(v.enc, 300);
            s.setChip(v.pod, 'next 1000002 / 1001000'); await s.pulse(v.pod);
          },
        },
        {
          title: 'Store code → long URL in MongoDB',
          text: 'Insert `{ _id: "4c93", longUrl, owner, createdAt, expiresAt }`. The code **is the primary key**, so a redirect is a single index lookup, and the unique `_id` is a free safety net against duplicate codes.',
          observe: 'A row for 4c93 appears in the urls collection.',
          say: 'MongoDB stores code → URL with the code as _id, which also guarantees uniqueness.',
          focus: v => [v.n.mongo, v.db],
          async run(s, v) {
            await s.send(['shortener', 'mongo'], 'insert 4c93', BLUE);
            await s.row(v.db, `4c93 → ${LONG}`);
          },
        },
        {
          title: 'Return the short link',
          text: 'The Shortener answers **201 Created** with `https://sho.rt/4c93`. Total cost: one insert, plus one call to the ID Range Service per 1,000 links.',
          observe: 'The 201 travels back to the user.',
          focus: v => [v.n.client],
          async run(s, v) {
            if (v.enc) await s.fade(v.enc, 0, 250);
            await s.send(['shortener', 'lb', 'client'], '201 sho.rt/4c93', GREEN);
            await s.flash(80, 210, '✓ sho.rt/4c93', { color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, 700);
          },
        },
        {
          title: 'The next create skips the ID service',
          text: 'User B shortens another URL. The pod already owns a block, so it takes **1000002 → "4c94"** straight from memory and inserts it. The ID Range Service is called only once per 1,000 links, so it is never a bottleneck.',
          observe: 'No packet goes to the ID Range Service this time.',
          say: 'The ID service is called once per thousand links, so it is not a bottleneck.',
          focus: v => [v.pod, v.db],
          async run(s, v) {
            await s.send(['client', 'lb', 'shortener'], 'POST /urls', BLUE);
            await s.flash(445, 205, '1000002 → base62 → 4c94', { mono: true, color: BLUE, stroke: BLUE }, 500);
            s.setChip(v.pod, 'next 1000003 / 1001000'); await s.pulse(v.pod);
            await s.send(['shortener', 'mongo'], 'insert 4c94', BLUE);
            await s.row(v.db, '4c94 → blog.ex/post');
            await s.send(['shortener', 'lb', 'client'], '201 sho.rt/4c94', GREEN);
          },
        },
      ],
    },
    {
      id: 'redirect', title: 'Redirect: miss, then hit', sub: 'cache-aside · 302', color: TEAL,
      build: (s, v) => setup(s, v, SEED),
      takeaway: 'Cache-aside on Redis makes the hot path one in-memory lookup; MongoDB is read only on a miss. **302** keeps every click visible to us.',
      steps: [
        {
          title: 'A user clicks sho.rt/4c93',
          text: 'User B clicks the short link. The browser sends **GET /4c93** and the load balancer routes it to the Redirect Service. This is the hot path: ~4,000 requests/s on average, ten times that at peaks.',
          observe: 'The GET goes down to the Redirect Service, not to the Shortener.',
          say: 'Redirects are the hot path, so they get their own service with a cache in front of the database.',
          focus: v => [v.n.redirect],
          async run(s) { await s.send(['client', 'lb', 'redirect'], 'GET /4c93', TEAL); },
        },
        {
          title: 'Ask Redis first: cache miss',
          text: 'Cache-aside: the service asks Redis for `url:4c93`. Nobody has clicked this link yet, so the key is not there. **Cache miss.**',
          observe: 'Redis answers nil: a miss.',
          focus: v => [v.n.redis, v.cache],
          async run(s) {
            await s.send(['redirect', 'redis'], 'GET url:4c93', TEAL);
            await s.flash(655, 410, 'miss', { color: RED, stroke: RED, fill: '#fff4f4' }, 400);
            await s.send(['redis', 'redirect'], 'nil', GREY);
          },
        },
        {
          title: 'Fall back to MongoDB',
          text: 'On a miss the service reads the source of truth: `findById("4c93")`, a primary-key lookup of a few milliseconds. It also checks `expiresAt`: an expired link would get **410 Gone**.',
          observe: 'MongoDB returns the long URL for 4c93.',
          focus: v => [v.n.mongo, v.db.rows[0]],
          async run(s, v) {
            await s.send(['redirect', 'mongo'], 'findById 4c93', TEAL);
            s.paintRow(v.db.rows[0], { fill: '#e8f6f4', stroke: TEAL }); await s.pulse(v.db.rows[0], 1, 1.05);
            await s.send(['mongo', 'redirect'], LONG, TEAL);
          },
        },
        {
          title: 'Fill the cache, with a TTL',
          text: 'Before answering, the service writes the result to Redis: `SET url:4c93 <longUrl> EX 86400`. The TTL (plus a little random jitter) bounds memory and staleness, and LRU eviction drops cold links.',
          observe: 'A url:4c93 entry appears in Redis.',
          focus: v => [v.n.redis, v.cache],
          async run(s, v) {
            await s.send(['redirect', 'redis'], 'SET EX 86400', TEAL);
            await s.row(v.cache, 'url:4c93 · TTL 24h');
          },
        },
        {
          title: 'Answer 302 with a Location header',
          text: 'The service returns **302 Found** with `Location: https://shop.ex/sale…` and the browser follows it. Why not 301? A **301** is cached by the browser, so repeat clicks never reach us: no analytics, and we could never expire or change the link.',
          observe: 'The 302 goes back and the browser jumps to the long URL.',
          say: 'I return 302, not 301, so every click reaches us for analytics and expiry.',
          focus: v => [v.n.client],
          async run(s) {
            await s.send(['redirect', 'lb', 'client'], '302 Location', TEAL);
            await s.flash(80, 210, `→ ${LONG}`, { color: TEAL, stroke: TEAL }, 600);
          },
        },
        {
          title: 'Next click: cache hit',
          text: 'User C clicks the same link a minute later. Redis has `url:4c93`, so the service answers in **~1 ms** without touching MongoDB. A few popular links get most clicks, so hit rates above 90% are normal.',
          observe: 'Redis answers directly; nothing goes to MongoDB.',
          say: 'With cache-aside, a hot link costs one Redis lookup per click.',
          focus: v => [v.n.redis, v.n.redirect],
          async run(s) {
            await s.send(['client', 'lb', 'redirect'], 'GET /4c93', GREEN);
            await s.send(['redirect', 'redis'], 'GET url:4c93', GREEN);
