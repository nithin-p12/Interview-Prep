<script>
// Notification System (email + push, transactional + campaigns). Everything specific to this design lives here;
// engine/app.js renders it. Kafka basics are taught in 00_Core_Components.html (Queue · Kafka).
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';

// Notification status colours (the Notify DB is the delivery log).
const ST = {
  QUEUED: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  SENT: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  FAILED: { fill: '#fff4f4', stroke: RED, color: RED },
};
const NK = 'order-9:shipped';
const fmt = (id, status, n) => `${id.padEnd(16)}${status.padEnd(7)}×${n}`;

// State shown next to the components: the notifications log, the topic offsets, the retry topics, the users.
function setup(s, v, { rows = [], clock = '14:00:00', off = 'email p0 · next 12 · committed 12', retry = 'retry-1m — · retry-10m — · dlq 0', a = 'waiting for an update', b = 'idle' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.log = s.store(15, 392, 270, 'NOTIFY DB · notifications', { color: AMBER });
  v.rows = {};
  rows.forEach(([id, st, n]) => { s.row(v.log, fmt(id, st, n), { ...ST[st], now: true }); v.rows[id] = v.log.rows[v.log.rows.length - 1]; v.rows[id].meta = [id, st, n]; });
  v.off = s.chip(420, 268, off, { mono: true, color: AMBER });
  v.retry = s.chip(685, 298, retry, { mono: true, color: PURPLE });
  v.ua = s.chip(965, 236, a, { color: GREY });
  v.ub = s.chip(965, 486, b, { color: GREY });
  return v;
}
async function note(s, v, id, st, n) {
  const r = v.rows[id];
  if (!r) { v.rows[id] = await s.row(v.log, fmt(id, st, n), ST[st]); v.rows[id].meta = [id, st, n]; return; }
  r.meta = [id, st, n ?? r.meta[2]];
  r.label.textContent = fmt(...r.meta);
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const offs = (s, v, t, color = AMBER) => s.setChip(v.off, t, { color });
const retr = (s, v, t, color = PURPLE) => s.setChip(v.retry, t, { color, stroke: color === RED ? RED : '#d5d9dc' });
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : v.ua, txt, { color, stroke: color === GREY ? '#d5d9dc' : color });

window.DESIGN = {
  id: 'notify', n: 4, title: 'Notification System', tagline: 'accept once, queue per channel and priority, retry without blocking',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Producers & intake', x0: 0, x1: 300, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Business services ask for a notification (who, template, channel, priority) with a **dedupe key**. The Notify API accepts it **once** and answers **202**; producers never wait for delivery.',
      detail: 'One platform for every team: Order, Auth and Marketing do not each integrate SES and FCM.' },
    { id: 'data', title: 'Rules, queue & log', x0: 300, x1: 540, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: '**Preferences** decide whether a message may be sent; the **Notify DB** records it (the dedupe key is the `_id`); **Kafka** holds the work, one topic per channel and priority.',
      detail: 'The DB row is written before the message is queued, so a producer retry is caught by the unique `_id`.' },
    { id: 'async', title: 'Channel workers', x0: 540, x1: 830, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'One consumer group per channel renders the template, calls the provider, records the status and commits. Failures go to **retry topics**, never a sleep inside the consumer.',
      detail: 'Workers scale with partitions and are throttled to each provider\'s send quota.' },
    { id: 'app', title: 'Providers & users', x0: 830, x1: 1100, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'External providers do the last mile: **SES** for email, **FCM / APNs** for push. They can throttle, fail or be slow, and they have no general "send once" guarantee.',
      detail: 'That is why delivery is **at-least-once**: we minimise duplicates, we cannot rule them out.' },
  ],
  layersIntro: {
    title: 'Accept once, queue, send, retry on the side',
    text: 'Producers call the **Notify API**, which checks **preferences**, records the notification in the **Notify DB** and queues it on a **Kafka** topic per channel and priority. **Workers** send through **SES / FCM** and update the status; failures go to **retry / DLQ** topics. Hover a layer or a component to see why it exists.',
  },
  nodes: {

    retry: { x: 685, y: 250, w: 160, label: 'Retry / DLQ', sub: 'delay topics', icon: '⏳', layer: 'async' },
    pushw: { x: 685, y: 400, w: 160, label: 'Push worker', sub: 'group push-svc', icon: '📲', layer: 'async' },
    ses: { x: 965, y: 80, w: 170, label: 'Email (SES)', sub: 'external', icon: '📧', layer: 'app' },
    userA: { x: 965, y: 190, w: 170, label: 'User A', sub: 'inbox', icon: '👤', layer: 'app' },
    fcm: { x: 965, y: 330, w: 170, label: 'Push (FCM)', sub: 'external', icon: '📡', layer: 'app' },
    userB: { x: 965, y: 440, w: 170, label: 'User B', sub: 'phone', icon: '👤', layer: 'app' },
  },
  wires: [['orderSvc', 'napi'], ['authSvc', 'napi'], ['napi', 'prefs'], ['napi', 'kafka'], ['napi', 'ndb'], ['kafka', 'emailw'], ['kafka', 'pushw'], ['emailw', 'retry'], ['emailw', 'ses'], ['pushw', 'fcm'], ['ses', 'userA'], ['fcm', 'userB'], ['emailw', 'ndb'], ['pushw', 'ndb']],

  components: {
    orderSvc: {
      name: 'Producers (Order, Marketing …)',

      why: 'They own the business event; the notification platform owns how it reaches the user.',
      without: 'Every team integrates SES / FCM itself, with its own retries, templates and (missing) opt-out checks.',
      tech: 'REST call to the Notify API (or an event on Kafka)', scale: 'Many producers, one platform.', fails: 'They retry with the **same dedupe key**, so a retry never creates a second notification.',
    },
    authSvc: {
      name: 'Auth Svc (OTP producer)',
      what: 'Sends login OTPs and security alerts: **high priority**, short time-to-live (60 s).',
      why: 'Shows why priority must be isolated: an OTP that arrives late is useless.',
      without: 'OTPs would queue behind marketing campaigns and expire before they arrive.',
      tech: 'Same Notify API, `priority: "high"`, `ttl: 60`', scale: 'Low volume, strict latency.', fails: 'If push is not delivered in time, fall back to SMS.',
    },
    napi: {
      name: 'Notify API (intake)',
      what: 'Validates the request, checks **preferences**, inserts the notification with the **dedupe key as `_id`**, produces it to the right **topic**, and returns **202**.',
      why: 'One front door that makes intake **idempotent** and enforces opt-outs before anything is queued.',
      without: 'Producer retries create duplicate notifications, and opted-out users still get marketing.',
      tech: 'Spring Boot; insert then `KafkaTemplate.send` (or a transactional outbox)', scale: 'Stateless pods behind a load balancer.', fails: 'If the send to Kafka fails after the insert, a sweeper re-queues old QUEUED rows (or use the outbox pattern).',
    },
    prefs: {
      name: 'Preferences & templates',
      what: 'Per-user channel opt-ins, marketing consent, quiet hours, language, device tokens; templates per channel and locale.',
      why: 'Legal and user-trust rules: no marketing without consent, no pushes at 3 am. Transactional messages (OTP, receipts) skip marketing rules.',
      without: 'Opted-out users get campaigns (complaints, spam reports, legal risk).',
      tech: 'MongoDB + Redis cache', scale: 'Read-heavy → cached with a short TTL.', fails: 'Serve the last cached prefs; re-check at send time for marketing.',
      core: ['cache', 'Cache · Redis'],
    },
    kafka: {
      name: 'Kafka topics (per channel & priority)',
      what: 'Topics `email`, `push-high` (OTP), `push-bulk` (campaigns), each read by its own consumer group. Key = `userId`, so one user\'s messages stay in order.',
      why: 'Producers get 202 immediately; spikes (a 1 M campaign) are buffered; channels and priorities never block each other.',
      without: 'Producers wait on SES / FCM, a slow provider slows every producer, and a campaign delays OTPs.',
      tech: 'Kafka; `KafkaTemplate` + `@KafkaListener`', scale: 'Partitions per topic; consumers up to one per partition.', fails: 'Redelivery after a crash or rebalance → **at-least-once**, so workers check status before sending.',
      core: ['kafka', 'Queue · Kafka'],
    },
    ndb: {
      name: 'Notify DB (status log)',
      what: 'One document per notification: `{ _id: dedupeKey, userId, channel, template, status, attempts, messageId }`. Status QUEUED → SENT → DELIVERED / BOUNCED / FAILED.',
      why: 'The unique `_id` **is** the dedupe; the status lets a worker skip a message already sent, and support can answer "did the user get it?".',
      without: 'No dedupe, no history, and no way to stop a redelivered message from being sent again.',
      tech: 'MongoDB; TTL index on `createdAt` (e.g. 90 days)', scale: 'High write rate → shard by `userId`.', fails: 'Down → new notifications get 503 (producers retry); queued ones keep sending, status updates retry.',
    },
    emailw: {
      name: 'Email worker',
      what: 'Consumes `email`, checks the status (**SENT? skip**), renders the template, calls SES, marks SENT, then commits the offset.',
      why: 'Keeps the slow, failure-prone provider call off the producer\'s path.',
      without: 'Producers call SES directly and fail whenever SES throttles.',
      tech: 'Spring Kafka `@KafkaListener` + `@RetryableTopic`', scale: 'Up to one consumer per partition; throttled to the SES send rate.', fails: 'Transient errors → retry topic; permanent ones (bad address) → FAILED, no retry.',
    },
    retry: {
      name: 'Retry & dead-letter topics',
      what: '`email-retry-1m`, `email-retry-10m`, `email-dlq`: delayed retries with growing backoff, then the DLQ after the last attempt.',
      why: 'A failed message is parked **on the side**, so the main partition keeps flowing.',
      without: 'Sleeping and retrying inside the consumer blocks every message behind it in the partition.',
      tech: 'Spring Kafka `@RetryableTopic` (creates the retry topics and the DLT)', scale: 'Small compared to main traffic.', fails: 'The DLQ needs an alert (size, age) and a replay tool; stale messages (yesterday\'s OTP) are dropped.',
      core: ['kafka', 'Queue · Kafka'],
    },
    pushw: {
      name: 'Push worker',
      what: 'Sends mobile pushes through FCM / APNs. A **separate consumer group** reads `push-high`, so OTPs never wait behind `push-bulk`.',
      why: 'Priority isolation needs its own topic **and** its own consumers.',
      without: 'One shared push queue: a campaign of 1 M pushes delays an OTP by minutes.',
      tech: 'FCM HTTP v1 API, `priority: high`, short TTL', scale: 'Separate groups for high and bulk; bulk throttled.', fails: 'Invalid device tokens → remove them; offline devices get the push until its TTL.',

      name: 'Recipient (push)',
      what: 'Waits for a login OTP on the phone.',
      why: 'Tight deadline: the OTP expires in 60 seconds.',
      without: '—',
      tech: 'Mobile app with a device token', scale: '—', fails: 'Late OTP = failed login.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Accept once, queue per channel, send, retry on the side.',
    points: [
      { t: 'Accept once', color: BLUE, d: 'Notify API checks preferences and inserts with the **dedupe key as `_id`**, then answers **202**.' },
      { t: 'Queue', color: AMBER, d: 'It produces to the **email** topic (key = user). Producers never wait for SES.' },
      { t: 'Send', color: PURPLE, d: 'The email worker calls **SES**, marks **SENT**, then **commits** the offset.' },
      { t: 'Priority', color: RED, d: 'An OTP goes to **push-high** with its own consumers, so campaigns cannot delay it.' },
    ],
    stats: [['10 M', 'notifications / day'], ['1 M', 'campaign in minutes'], ['< 5 s', 'OTP end to end'], ['≥ 1', 'delivery (at-least-once)']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    for (const r of [...v.log.rows]) await s.unrow(v.log, r);
    v.rows = {}; tick(s, v, '14:00:00'); offs(s, v, 'email p0 · next 12 · committed 12'); who(s, v, 'A', 'waiting for an update'); who(s, v, 'B', 'idle');

    ui.say(0); ui.cap('**Accept** · Order Svc asks for "order shipped"; the API checks prefs and records it once');
    await s.send(['orderSvc', 'napi'], 'POST /notifications', BLUE, { ms: 440 });
    await s.send(['napi', 'prefs'], 'A: email ok?', BLUE, { ms: 400 });
    await s.send(['napi', 'ndb'], `insert ${NK}`, BLUE, { ms: 440 });
    await note(s, v, NK, 'QUEUED', 0);
    ui.say(1); ui.cap('**Queue** · produce to the `email` topic and answer 202: the producer does not wait');
    await s.send(['napi', 'kafka'], 'email @12', AMBER, { ms: 420 });
    offs(s, v, 'email p0 · next 13 · committed 12');
    await s.send(['napi', 'orderSvc'], '202', GREEN, { ms: 380 });
    ui.say(2); ui.cap('**Send** · the worker calls SES, marks **SENT**, then commits the offset');
    await s.send(['kafka', 'emailw'], 'offset 12', PURPLE, { ms: 420 });
    await s.send(['emailw', 'ses'], 'SendEmail', PURPLE, { ms: 440 });
    await s.send(['emailw', 'ndb'], 'SENT', GREEN, { ms: 460 });
    await note(s, v, NK, 'SENT', 1);
    offs(s, v, 'email p0 · next 13 · committed 13');
    await s.send(['ses', 'userA'], 'Your order shipped', GREEN, { ms: 400 });
    who(s, v, 'A', 'got the email ✓', GREEN);
    ui.say(3); ui.cap('**Priority** · an OTP goes to `push-high` with its own consumer group');
    await s.send(['authSvc', 'napi'], 'OTP · high', RED, { ms: 420 });
    await s.send(['napi', 'kafka'], 'push-high', RED, { ms: 400 });
    await s.send(['kafka', 'pushw', 'fcm', 'userB'], 'OTP 482913', RED, { ms: 380 });
    who(s, v, 'B', 'OTP in ~1 s ✓', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'happy', title: 'Order shipped: email A', sub: 'prefs · log · Kafka · SES', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'The API **accepts once** (dedupe key = `_id`) and returns **202**; the worker sends, records **SENT** and only then **commits** the offset. Delivery events from SES update the status later.',
      steps: [
        {
          title: 'A producer asks for a notification',

          observe: 'A QUEUED row appears in the Notify DB.',
          say: 'The dedupe key is the document id, so producer retries are idempotent.',
          focus: v => [v.log],
          async run(s, v) {
            await s.send(['napi', 'ndb'], 'insert QUEUED', BLUE);
            await note(s, v, NK, 'QUEUED', 0);
          },
        },
        {
          title: 'Queue it and answer 202',
          text: 'The API produces to the `email` topic with **key = userId** (one user\'s messages stay in order) and returns **202 Accepted**. The producer does not wait for SES.',
          observe: 'The message lands at offset 12; Order Svc gets 202.',
          focus: v => [v.off],
          async run(s, v) {
            await s.send(['napi', 'kafka'], 'email · key A', AMBER);
            offs(s, v, 'email p0 · next 13 · committed 12'); await s.pulse(v.off);
            await s.send(['napi', 'orderSvc'], '202 Accepted', GREEN);
          },
        },
        {
          title: 'The worker sends through SES',
          text: 'The email worker polls offset 12, checks the row (still **QUEUED**, so send), renders the template in A\'s language and calls `SendEmail`. SES answers with a `MessageId`.',
          observe: 'The worker calls SES and gets a MessageId.',
          focus: v => [v.n.emailw, v.n.ses],
          async run(s) {
            await s.send(['kafka', 'emailw'], 'offset 12', PURPLE);
            await s.send(['emailw', 'ses'], 'SendEmail', PURPLE);
            await s.send(['ses', 'emailw'], 'MessageId 0102-x', GREEN);
          },
        },
        {
          title: 'Mark SENT, then commit',
          text: 'Right after the provider call the worker sets `status: "SENT"` with the `MessageId`, then **commits offset 13**. The order matters: if it crashes after SENT but before the commit, the redelivered message is **skipped**.',
          observe: 'The row turns green and the committed offset moves to 13.',
          say: 'The worker marks SENT right after the provider call and commits the offset last.',
          focus: v => [v.rows[NK], v.off],
          async run(s, v) {
            await s.send(['emailw', 'ndb'], 'SENT', GREEN);
            await note(s, v, NK, 'SENT', 1);
            offs(s, v, 'email p0 · next 13 · committed 13'); await s.pulse(v.off);
          },
        },
        {
          title: 'Delivered',
          text: 'A gets "Your order shipped". SES "accepted" is not "delivered": delivery, bounce and complaint events arrive later via SNS and update the status (and stop mail to addresses that bounce).',
          observe: 'The email reaches A.',
          focus: v => [v.n.userA],
          async run(s, v) {

    },
    {
      id: 'dedupe', title: 'Producer retries', sub: 'timeout · same dedupe key · E11000', color: TEAL,
      build: (s, v) => setup(s, v),
      takeaway: 'A producer cannot know whether a timed-out call succeeded, so it **retries with the same dedupe key**. The unique `_id` turns the retry into a no-op that returns the same 202.',
      steps: [
        {
          title: 'The first request is accepted',
          text: 'Order Svc sends the request; the API inserts `order-9:shipped` as QUEUED and produces it to Kafka.',
          observe: 'One row, one message.',
          focus: v => [v.log, v.off],
          async run(s, v) {
            await s.send(['orderSvc', 'napi'], 'POST #1', BLUE);
            await s.send(['napi', 'ndb'], 'insert', BLUE);
            await note(s, v, NK, 'QUEUED', 0);
            await s.send(['napi', 'kafka'], 'email @12', AMBER);

          },
        },
        {
          title: 'The response is lost',
          text: 'The 202 never reaches Order Svc (network blip, its timeout was too short). From its point of view the call **failed**.',
          observe: 'The reply bounces; the producer times out.',
          focus: v => [v.n.orderSvc],
          async run(s) {
            await s.bounce('napi', 'orderSvc', '202', RED);
            await s.flash(75, 60, 'timeout ✕', { color: RED, stroke: RED, fill: '#fff4f4' }, 600);
          },
        },
        {
          title: 'Retry with the same key',
          text: 'Order Svc retries with the **same** `dedupeKey`. The insert hits the unique `_id` → **E11000 duplicate key**. The API treats that as "already accepted".',
          observe: 'The second insert is rejected by the unique index.',
          say: 'A retried request hits the unique id, so nothing is queued twice.',
          focus: v => [v.rows[NK]],
          async run(s, v) {
            await s.send(['orderSvc', 'napi'], 'POST #2 (same key)', BLUE);
            await s.send(['napi', 'ndb'], 'insert', BLUE);
            await s.flash(420, 390, 'E11000 duplicate key', { mono: true, color: TEAL, stroke: TEAL }, 700);
            await s.pulse(v.rows[NK], 1, 1.05);
          },
        },
        {
          title: 'Same answer, nothing new queued',
          text: 'The API returns **202 { id, duplicate: true }** and does **not** produce again. One row, one Kafka message, one email. Producers must build stable keys (`eventId`, `orderId:type`), never a random UUID per attempt.',
          observe: 'Order Svc gets 202; the topic offset does not move.',
          focus: v => [v.off, v.n.orderSvc],
          async run(s, v) {
            await s.send(['napi', 'orderSvc'], '202 duplicate', GREEN);
            await s.pulse(v.off);
          },
        },
      ],
    },

      "A notification system lets any service send email, push or SMS to users without integrating the providers itself. Producers like the Order Service call a **Notify API** with the user, a template, the channel and a **dedupe key**, and get **202** back immediately; they never wait for delivery.",
