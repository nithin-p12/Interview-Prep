<script>
// Ticket Booking (BookMyShow / Ticketmaster). Everything specific to this design lives here; engine/app.js renders it.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f', PINK = '#c2417a';

// Seat rows are coloured by status, like the seat map a user sees.
const SEAT_LOOK = {
  AVAILABLE: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  LOCKED: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  BOOKED: { fill: '#f1f9ee', stroke: GREEN, color: '#24522f' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: '#24522f' },
};
const seatTo = (s, r, text, look) => { r.label.textContent = text; s.paintRow(r, SEAT_LOOK[look]); };

// State shown next to the components: the clock, the cached seat map, the seats, bookings and outbox in MongoDB.
function setup(s, v, { clock = '19:00:00', cache = 'AVAILABLE', a12 = ['A12  AVAILABLE · v7', 'AVAILABLE'], extra = [], books = [] } = {}) {
  v.clock = s.chip(80, 58, `🕒 ${clock}`, { mono: true });
  v.cache = s.chip(622, 108, `seatmap:42 A12 = ${cache}`, { anchor: 'start', mono: true, color: AMBER });
  v.seats = s.store(568, 312, 196, 'SEATS · show 42', { color: AMBER });
  v.books = s.store(568, 400, 196, 'BOOKINGS · OUTBOX', { color: AMBER });
  s.row(v.seats, a12[0], { ...SEAT_LOOK[a12[1]], now: true });
  v.a12 = v.seats.rows[0];
  for (const [t, look] of extra) s.row(v.seats, t, { ...SEAT_LOOK[look], now: true });
  for (const [t, look] of books) s.row(v.books, t, { ...SEAT_LOOK[look], now: true });
  return v;
}
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const cacheTo = (s, v, st, color = AMBER) => s.setChip(v.cache, `seatmap:42 A12 = ${st}`, { color });
const rowOf = (st, prefix) => st.rows.find(r => r.label.textContent.startsWith(prefix));

window.DESIGN = {
  id: 'ticket', n: 3, title: 'Ticket Booking', tagline: 'BookMyShow / Ticketmaster: hold a seat, pay, never sell it twice',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Entry', x0: 0, x1: 335, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'One front door: authenticates users, **rate-limits** on-sale spikes and routes seat calls and payment calls to the right service.',
      detail: 'During a hot on-sale this is also where a **virtual waiting room** admits users in batches, so the services behind it see a steady load.' },
    { id: 'app', title: 'Services', x0: 335, x1: 545, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'Stateless business logic: **Booking** owns seats and holds, **Payment** owns money, the **Sweeper** releases expired holds. The provider sits beside them as an external system.',
      detail: 'No JVM locks anywhere: correctness comes from **conditional updates in MongoDB**, so any pod can serve any request and pods can crash safely.' },
    { id: 'data', title: 'State', x0: 545, x1: 790, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'MongoDB is the **only** place that decides who gets a seat. Redis is a fast but possibly stale **view** of the seat map.',
      detail: 'One document per seat per show keeps contention low: two users only conflict when they want the very same seat.' },
    { id: 'async', title: 'Events', x0: 790, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'Work the user must not wait for: the confirmed booking is turned into an event (**outbox → Kafka**) and the ticket is emailed asynchronously.',
      detail: 'Kafka keeps a replayable log, so notification, analytics or loyalty services can each consume the same booking events independently.' },
  ],
  layersIntro: {
    title: 'Four layers, one rule: MongoDB decides',
    text: 'Requests **enter** through the gateway, **stateless services** apply the rules, **state** lives in MongoDB (with Redis as a read cache), and **events** carry the result to the outside world. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    client: { x: 80, y: 250, w: 140, label: 'Client', sub: 'web / app', icon: '👤', layer: 'entry' },
    gateway: { x: 250, y: 250, w: 150, label: 'API Gateway', sub: 'auth · rate limit', icon: '🛡️', layer: 'entry' },
    sweeper: { x: 440, y: 58, label: 'Expiry Sweeper', sub: 'every 30 s', icon: '🧹', layer: 'app' },
    booking: { x: 440, y: 190, label: 'Booking Service', sub: 'seats · holds', icon: '🎟️', layer: 'app' },
    payment: { x: 440, y: 330, label: 'Payment Service', sub: 'charges · webhooks', icon: '💳', layer: 'app' },
    provider: { x: 440, y: 460, label: 'Payment provider', sub: 'Stripe / Razorpay', icon: '🏦', layer: 'app', ext: true },
    redis: { x: 668, y: 58, label: 'Redis', sub: 'seat-map cache', icon: '⚡', layer: 'data' },
    mongo: { x: 668, y: 250, label: 'MongoDB', sub: 'source of truth', icon: '🍃', layer: 'data' },
    relay: { x: 945, y: 58, w: 160, label: 'Outbox Relay', sub: 'change stream', icon: '🔁', layer: 'async' },
    kafka: { x: 945, y: 196, w: 160, label: 'Kafka', sub: 'booking-events', icon: '📨', layer: 'async' },
    notif: { x: 945, y: 334, w: 160, label: 'Notification', sub: 'consumer group', icon: '🔔', layer: 'async' },
    email: { x: 945, y: 466, w: 160, label: 'Email', sub: 'SES / SMTP', icon: '✉️', layer: 'async', ext: true },
  },
  wires: [['client', 'gateway'], ['gateway', 'booking'], ['gateway', 'payment'], ['booking', 'redis'], ['booking', 'mongo'], ['payment', 'booking'], ['payment', 'mongo'], ['payment', 'provider'],
    ['sweeper', 'mongo'], ['sweeper', 'redis'], ['mongo', 'relay'], ['relay', 'kafka'], ['kafka', 'notif'], ['notif', 'email'], ['notif', 'mongo']],

  components: {
    client: {
      what: 'Web or mobile app: shows the seat map, holds seats, opens the payment page and polls the hold status.',
      why: 'Every booking starts here, and the client must behave well under retries: it sends an **Idempotency-Key** with each payment and can poll `GET /holds/{id}` after a reload.',
      without: 'Not optional, but a careless client (no idempotency key, retry storms) turns a double-click into a double charge.',
      tech: 'Web / Android / iOS, JWT from the identity provider', scale: 'Waiting-room token for hot on-sales.', fails: 'Retries with the same Idempotency-Key; reloads recover the hold by id.',
    },
    gateway: {
      name: 'API Gateway',
      what: 'Validates the JWT, rate-limits per user and IP, terminates TLS and routes seat calls to Booking and payment calls to Payment.',
      why: 'Protects the services from **on-sale spikes** (200k users in minutes) and keeps auth in one place.',
      without: 'Every service re-implements auth; a bot or a stampede of users hits the booking path directly and overloads MongoDB.',
      tech: 'Spring Cloud Gateway / Kong / NGINX, plus a virtual waiting room for hot shows', scale: 'Stateless, horizontal behind a load balancer.', fails: 'Health checks remove bad pods; rate limits shed load.',
    },
    sweeper: {
      name: 'Expiry Sweeper',
      what: 'Every 30 s resets LOCKED seats whose `lockExpiresAt` has passed back to AVAILABLE, and refreshes the cache.',
      why: 'Keeps the **seat map honest**: without it, abandoned holds would look taken until someone tries to lock them.',
      without: 'Correctness is fine (the lock query also accepts expired holds), but users see grey seats that are really free and leave.',
      tech: '`@Scheduled` + ShedLock (one runner) or a Kubernetes CronJob', scale: 'One `updateMany` per run on index `{ status: 1, lockExpiresAt: 1 }`.', fails: 'If it stops, only the seat map looks stale.',
    },
    booking: {
      name: 'Booking Service',
      what: 'Serves the seat map, **locks** seats with a conditional update, and **confirms** bookings in a transaction after payment.',
      why: 'One owner for the seat rules. Its writes are all compare-and-set, so concurrency is decided by the database, not by luck.',
      without: 'Seat logic spreads across services, and read-then-write code sells the same seat twice under load.',
      tech: 'Spring Boot, MongoDB driver (transactions), Redis client', scale: 'Stateless pods; no in-memory locks.', fails: 'A crash mid-request is safe: every write is conditional and idempotent, so retries are allowed.',
    },
    payment: {
      name: 'Payment Service',
      what: 'Creates payments with an **idempotency key**, verifies the provider\'s **signed webhooks**, and triggers confirm or refund.',
      why: 'Money needs its own audit trail and rules: no double charges, every webhook verified, every failure reconciled.',
      without: 'A double-click charges twice, a forged webhook books a seat for free, and a lost webhook leaves the user paid but not booked.',
      tech: 'Provider SDK, webhook signature checks, `payments` collection with a unique idempotency key, reconciliation job', scale: 'Stateless; webhooks are retried by the provider.', fails: 'Lost webhook → reconciliation polls the provider. Late success on an expired hold → refund.',
    },
    provider: {
      name: 'Payment provider (external)',
      what: 'Charges the card or UPI, sends webhooks, processes refunds.',
      why: 'We never touch card data (PCI scope). The provider moves the money and tells us the result.',
      without: 'You would need PCI compliance and bank integrations yourself.',
      tech: 'Stripe / Razorpay REST API + webhooks, idempotency keys on create calls', scale: 'Not ours; respect its rate limits.', fails: 'Webhooks can be **late, duplicated or out of order**: design for all three.',
    },
    redis: {
      name: 'Redis (seat-map cache)',
      what: 'Hash `seatmap:{showId}` → seat status, for fast seat-map reads.',
      why: 'Seat-map reads are far more frequent than locks, especially during an on-sale. Redis serves them in ~1 ms and shields MongoDB.',
      without: 'Every refresh of the seat map hits MongoDB at the worst possible moment.',
      tech: 'Redis hash + short TTL as a safety net', scale: 'Replicas for read throughput.', fails: 'Stale or missing entries only cause a 409 at lock time; reads fall back to MongoDB.',
    },
    mongo: {
      name: 'MongoDB (source of truth)',
      what: 'One document per seat per show, plus `bookings`, `payments` and `outbox`. Replica set with `w: "majority"`.',
      why: 'The **atomic single-document conditional update** is what guarantees one seat, one winner. Transactions keep seat + booking + outbox consistent.',
      without: 'There is no authority: the cache or the services would have to decide, and both can be wrong.',
      tech: 'MongoDB replica set (transactions need one), shard key `showId`', scale: 'Shard by show so one show\'s seats live together.', fails: 'Primary failover takes seconds; retryable writes + idempotent requests cover it.',
    },
    relay: {
      name: 'Outbox Relay',
      what: 'Watches the `outbox` collection (change stream) and publishes each event to Kafka, then marks it published.',
      why: 'Solves the **dual write**: the event is committed with the booking, so it can never be lost between the database and Kafka.',
      without: 'A crash after the commit but before `kafka.send()` leaves a booking that nobody is ever told about.',
      tech: 'Change stream (or polling) + Kafka idempotent producer, `acks=all`', scale: 'One active relay per outbox shard.', fails: 'Crash before marking → republish → consumers dedupe by eventId.',
    },
    kafka: {
      name: 'Kafka (booking-events)',
      what: 'Durable, replayable event log; key = `showId` keeps a show\'s events ordered within a partition.',
      why: 'Lets several consumers (notification, analytics, loyalty) react to bookings independently and at their own pace.',
      without: 'Booking would call every downstream service itself, and each outage would ripple back into the booking path.',
      tech: 'Kafka, replication factor 3, `min.insync.replicas=2`', scale: 'Partitions + consumers per group.', fails: 'Redelivers from the last committed offset, so duplicates are possible.',
    },
    notif: {
      name: 'Notification Service',
      what: 'Consumes BookingConfirmed / RefundInitiated and sends the ticket email (and push).',
      why: 'Keeps slow, flaky email sending off the booking path and makes it retryable.',
      without: 'The user waits for an SMTP call before seeing "booked", and an email outage blocks bookings.',
      tech: 'Spring Kafka listener, manual offset commit after processing, `notification_log` keyed by eventId', scale: 'One consumer per partition per group.', fails: 'Crash before the offset commit → redelivery → the dedupe log skips it.',
    },
    email: {
      name: 'Email provider (external)',
      what: 'Delivers the ticket email.',
      why: 'Deliverability (SPF, DKIM, reputation) is a specialist job; we hand it off.',
      without: 'You would run your own mail servers and fight spam filters.',
      tech: 'Amazon SES / SMTP', scale: 'Sending quotas per second.', fails: 'No send idempotency key: calling twice sends two emails.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Hold with a conditional update, pay, confirm in one transaction.',
    points: [
      { t: 'Hold', color: BLUE, d: 'Lock A12 **only if AVAILABLE**: one atomic update, so of two users exactly one wins (200), the other gets 409.' },
      { t: 'Pay', color: TEAL, d: 'Payment with an **idempotency key**; the provider answers later by a signed **webhook**.' },
      { t: 'Confirm', color: GREEN, d: 'One transaction: re-check the hold, seat → BOOKED, insert booking + **outbox** event.' },
      { t: 'Notify', color: PURPLE, d: 'Relay → Kafka → Notification → email. At-least-once, deduped by eventId.' },
    ],
    stats: [['50 k', 'shows / day'], ['~50/s', 'bookings (avg)'], ['200 k', 'users on a hot on-sale'], ['10 min', 'seat hold']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    for (const r of [...v.books.rows]) await s.unrow(v.books, r);
    seatTo(s, v.a12, 'A12  AVAILABLE · v7', 'AVAILABLE'); cacheTo(s, v, 'AVAILABLE');
    tick(s, v, '19:00:00');
    for (const id of ['email', 'notif', 'kafka', 'provider']) s.setSub(v.n[id], D0.nodes[id].sub);

    ui.say(0); ui.cap('**Hold** · A and B both tap seat **A12**');
    const b = (async () => {
      await s.wait(250);
      await s.send(['client', 'gateway', 'booking'], 'B: hold A12', PINK, { ms: 420 });
      await s.wait(500);
      await s.bounce('booking', 'mongo', 'B: if AVAILABLE', PINK);
      await s.send(['booking', 'gateway', 'client'], 'B: 409 taken', RED, { ms: 420 });
    })();
    await s.send(['client', 'gateway', 'booking'], 'A: hold A12', BLUE, { ms: 420 });
    ui.cap('`updateOne({ status: "AVAILABLE" })`: only **one** of them can match');
    await s.send(['booking', 'mongo'], 'A: if AVAILABLE', BLUE, { ms: 420 });
    seatTo(s, v.a12, 'A12  LOCKED · A · H-901', 'LOCKED'); await s.pulse(v.a12, 1, 1.05);
    await s.send(['booking', 'redis'], 'HSET LOCKED', BLUE, { ms: 360 });
    cacheTo(s, v, 'LOCKED');
    await s.send(['booking', 'gateway', 'client'], 'A: 200 H-901', GREEN, { ms: 420 });
    await b;

    ui.say(1); ui.cap('**Pay** · idempotency key = the hold id, so a double-click cannot charge twice');
    await s.send(['client', 'gateway', 'payment'], 'POST /payments', TEAL, { ms: 420 });
    await s.send(['payment', 'provider'], 'charge · key H-901', TEAL, { ms: 420 });
    s.setSub(v.n.provider, 'processing…', AMBER);
    tick(s, v, '19:02:40');
    await s.send(['provider', 'payment'], 'webhook ✓ signed', TEAL, { ms: 420 });
    s.setSub(v.n.provider, 'succeeded', GREEN);

    ui.say(2); ui.cap('**Confirm** · one transaction: hold still valid? seat BOOKED + booking + outbox event');
    await s.send(['payment', 'booking'], 'confirm H-901', GREEN, { ms: 420 });
    await s.send(['booking', 'mongo'], 'txn', GREEN, { ms: 420 });
    seatTo(s, v.a12, 'A12  BOOKED · B-5001', 'BOOKED');
    await s.row(v.books, 'B-5001 · A12 · user A', SEAT_LOOK.BOOKED);
    await s.row(v.books, 'evt-9001 · pending', SEAT_LOOK.LOCKED);
    cacheTo(s, v, 'BOOKED', GREEN);

    ui.say(3); ui.cap('**Notify** · relay → Kafka → Notification → email, deduped by eventId');
    await s.send(['mongo', 'relay'], 'evt-9001', PURPLE, { ms: 420 });
    await s.send(['relay', 'kafka'], 'BookingConfirmed', PURPLE, { ms: 420 });
    seatTo(s, v.books.rows[1], 'evt-9001 · published', 'BOOKED');
    await s.send(['kafka', 'notif', 'email'], 'ticket 🎟', PURPLE, { ms: 420 });
    s.setSub(v.n.email, 'sent to A ✓', GREEN);
    await s.send(['notif', 'mongo'], 'log evt-9001', PURPLE, { ms: 420 });
    await s.wait(2200);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'happy', title: 'Book a seat', sub: 'hold → pay → confirm → ticket', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'Hold = one **conditional update**; pay with an **idempotency key**; confirm = one **transaction** that re-checks the hold and writes the outbox; the ticket goes out **asynchronously**.',
      steps: [
        {
          title: 'Load the seat map from Redis',
          text: 'User A opens show 42. Booking Service reads the hash `seatmap:42` from Redis (~1 ms) instead of scanning hundreds of seat documents. The map may be a few seconds stale: that is fine, because it never decides who gets a seat.',
          observe: 'The seat map comes from Redis, not MongoDB.',
          say: 'Seat-map reads come from a Redis cache; it is a view, never the source of truth.',
          focus: v => [v.n.redis, v.cache],
          async run(s) {
            await s.send(['client', 'gateway', 'booking'], 'GET /shows/42/seats', BLUE);
            await s.send(['booking', 'redis'], 'HGETALL seatmap:42', BLUE);
            await s.send(['redis', 'booking'], 'A12 AVAILABLE …', BLUE);
            await s.send(['booking', 'gateway', 'client'], 'seat map', BLUE);
          },
        },
        {
          title: 'Tap A12 → one conditional update',
          text: 'Booking Service runs `updateOne({ _id: "42:A12", status: "AVAILABLE" }, { $set: { status: "LOCKED", lockedBy: "A", holdId: "H-901", lockExpiresAt: now + 10 min } })`. MongoDB applies it **atomically**: the filter and the write happen as one step.',
          observe: 'A12 turns LOCKED for A with hold H-901.',
          say: 'Locking is a compare-and-set: update only if the seat is still AVAILABLE.',
          focus: v => [v.n.mongo, v.a12],
          async run(s, v) {
            await s.send(['client', 'gateway', 'booking'], 'POST /holds A12', BLUE);
            await s.send(['booking', 'mongo'], 'updateOne if AVAILABLE', BLUE);
            seatTo(s, v.a12, 'A12  LOCKED · A · H-901', 'LOCKED'); await s.pulse(v.a12, 1, 1.05);
            await s.send(['mongo', 'booking'], 'modifiedCount 1', BLUE);
          },
        },
        {
          title: 'Hold granted: 200 + holdId',
          text: '`modifiedCount` is 1, so A owns the seat for 10 minutes. The service updates the Redis seat map **after** the database (best effort) and answers **200** with hold H-901. The client shows a countdown.',
          observe: 'Redis now shows A12 LOCKED and A gets the hold id.',
          focus: v => [v.cache, v.hold],
          async run(s, v) {
            await s.send(['booking', 'redis'], 'HSET A12 LOCKED', BLUE);
            cacheTo(s, v, 'LOCKED');
            await s.send(['booking', 'gateway', 'client'], '200 hold H-901', GREEN);
            v.hold = s.chip(80, 198, 'hold H-901 · until 19:10', { color: AMBER, stroke: AMBER, fill: '#fdf6ea' });
            await s.pop(v.hold, 250);
          },
        },
        {
          title: 'Pay with an idempotency key',
          text: 'A clicks Pay. The client sends `POST /payments` with **Idempotency-Key: H-901**. Payment Service stores the payment under a unique index on that key, then calls the provider with the same key, so retries and double-clicks can never create a second charge.',
          observe: 'One charge request goes to the provider, tagged with the hold id.',
          say: 'Every payment carries an idempotency key tied to the hold, so retries are safe.',
          focus: v => [v.n.payment, v.n.provider],
          async run(s, v) {
            await s.send(['client', 'gateway', 'payment'], 'POST /payments', TEAL);
            await s.send(['payment', 'mongo'], 'insert key H-901', TEAL);
            await s.send(['payment', 'provider'], 'charge · key H-901', TEAL);
            s.setSub(v.n.provider, 'processing…', AMBER);
          },
        },
        {
          title: 'The provider confirms by webhook',
          text: 'Seconds (sometimes minutes) later, the provider calls our webhook: **payment succeeded**. Payment Service verifies the signature (never trust an unsigned webhook) and asks Booking Service to confirm hold H-901.',
          observe: 'A signed webhook arrives and turns into a confirm call.',
          focus: v => [v.n.payment, v.n.booking],
          async run(s, v) {
            tick(s, v, '19:02:40');
            await s.send(['provider', 'payment'], 'webhook ✓ signed', TEAL);
            s.setSub(v.n.provider, 'succeeded', GREEN);
            await s.send(['payment', 'booking'], 'confirm H-901', GREEN);
          },
        },
        {
          title: 'Confirm in ONE transaction',
          text: 'Inside one MongoDB transaction: update the seat **only if** it is still LOCKED by hold H-901 and `lockExpiresAt > now`, set it BOOKED, insert booking B-5001, and insert an **outbox** event. All three commit together or none does.',
          observe: 'Seat BOOKED, a booking row and a pending outbox event appear together.',
          say: 'Confirm re-checks the hold and writes the seat, the booking and an outbox event in one transaction.',
          focus: v => [v.a12, v.books],
          async run(s, v) {
            await s.send(['booking', 'mongo'], 'txn: seat+booking+outbox', GREEN);
            seatTo(s, v.a12, 'A12  BOOKED · B-5001', 'BOOKED'); await s.pulse(v.a12, 1, 1.05);
            await s.row(v.books, 'B-5001 · A12 · user A', SEAT_LOOK.BOOKED);
            await s.row(v.books, 'evt-9001 · pending', SEAT_LOOK.LOCKED);
            await s.send(['booking', 'redis'], 'HSET A12 BOOKED', GREEN);
            cacheTo(s, v, 'BOOKED', GREEN);
            if (v.hold) s.setChip(v.hold, 'booked ✓ B-5001', { color: GREEN, stroke: GREEN, fill: '#f1f9ee' });
          },
        },
        {
          title: 'Outbox → Kafka → ticket email',
          text: 'The relay sees the new outbox row on a change stream and publishes **BookingConfirmed** to Kafka (key = showId), then marks it published. The Notification consumer emails the ticket, writes `evt-9001` to its dedupe log, and only then commits its offset.',
          observe: 'The event travels to Kafka and the email is sent.',
          say: 'The outbox makes the event as durable as the booking; delivery is at-least-once with dedupe.',
          focus: v => [v.n.relay, v.n.kafka, v.n.notif],
          async run(s, v) {
            await s.send(['mongo', 'relay'], 'evt-9001', PURPLE);
            await s.send(['relay', 'kafka'], 'BookingConfirmed', PURPLE);
            seatTo(s, v.books.rows[1], 'evt-9001 · published', 'BOOKED');
            await s.send(['kafka', 'notif'], 'evt-9001', PURPLE);
            await s.send(['notif', 'email'], 'ticket 🎟', PURPLE);
            s.setSub(v.n.email, 'sent to A ✓', GREEN);
            await s.send(['notif', 'mongo'], 'log evt-9001', PURPLE);
            s.setSub(v.n.notif, 'offset committed');
          },
        },
      ],
    },
    {
      id: 'race', title: 'Two users, one seat', sub: 'read-then-write vs compare-and-set', color: PINK,
      build: (s, v) => setup(s, v),
