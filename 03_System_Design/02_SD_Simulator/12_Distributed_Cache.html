// Distributed cache (Redis nodes in front of MongoDB). Consistent hashing is taught HERE (flow "Why consistent hashing?"),
// not in Core Components. Basic Redis caching (cache-aside, TTL) and DB basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f', INDIGO = '#5a5fc8';
const KEEP = '#d5d9dc', MONO = 'Consolas, "Cascadia Mono", monospace';

// Each cache node has an identity colour, used for its badge and its points on the ring.
const NC = { c1: BLUE, c2: TEAL, c3: AMBER, c4: PURPLE };
// The ring (drawn above the app pods: it is the copy every pod holds). Angles stand for positions in 0 … 2^32.
const RC = { cx: 275, cy: 112, r: 50 };
const ONE = { c1: [50], c2: [175], c3: [270], c4: [345] };                       // one point per node
const VN = { c1: [225, 355], c2: [15, 120], c3: [85, 205], c4: [102, 190] };      // extra virtual nodes
const KEYS = { 'cart:7': 32, 'user:42': 150, 'prod:9': 240, 'sess:5': 325 };    // murmur3(key) on the ring

// Row colours for the two tables (cache contents, MongoDB documents).
const ST = {
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  NEW: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
  OLD: { fill: '#f6f7f8', stroke: KEEP, color: GREY },
  MOVE: { fill: '#faf6fd', stroke: PURPLE, color: PURPLE },
};
const fc = (node, key, val) => `${node.padEnd(4)}${key.padEnd(9)}${val}`;   // cache row
const fd = (key, val) => `${key.padEnd(9)}${val}`;                         // MongoDB row
const fk = (key, how, node) => `${key.padEnd(9)}${how.padEnd(9)}→ ${node}`;  // key → owner row (flow 1)

// ---- ring drawing ----
const pt = (deg, r = RC.r) => { const a = deg * Math.PI / 180; return [RC.cx + r * Math.sin(a), RC.cy - r * Math.cos(a)]; };
function dot(s, v, n, deg) {
  const [x, y] = pt(deg), d = s.g(x, y, v.ring.g);
  SD.el('circle', { r: 6.8, fill: NC[n], stroke: '#fff', 'stroke-width': 1.5 }, d);
  s.text(d, 0, .5, n.slice(1), { 'font-size': 9, 'font-weight': 800, fill: '#fff' });
  d.deg = deg; v.ring.dots[n].push(d);
  return d;
}
async function addDots(s, v, n, degs) { for (const deg of degs) await s.pop(dot(s, v, n, deg), 220); }
async function dropDots(s, v, n) { for (const d of v.ring.dots[n]) { await s.fade(d, 0, 200); d.remove(); } v.ring.dots[n] = []; }
// Consistent hashing for real: the first point at or after the key's angle, wrapping around.
function ownerOf(v, deg) {
  const all = Object.entries(v.ring.dots).flatMap(([n, ds]) => ds.map(d => [d.deg, n])).sort((a, b) => a[0] - b[0]);
  return all.length ? (all.find(([d]) => d >= deg) ?? all[0])[1] : null;
}
function keyMark(s, v, k) {
  const deg = KEYS[k], [x1, y1] = pt(deg, RC.r - 6), [x2, y2] = pt(deg, RC.r + 6), [lx, ly] = pt(deg, RC.r + 13);
  SD.el('line', { x1, y1, x2, y2, stroke: '#203347', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, v.ring.g);
  const t = s.g(lx, ly, v.ring.g);
  t.label = s.text(t, 0, 0, k, { 'text-anchor': deg < 180 ? 'start' : 'end', 'font-size': 11.5, 'font-weight': 700, 'font-family': MONO });
  v.ring.keys[k] = t;
}
// Colour every key by its current owner; returns the keys whose owner changed.
function paintKeys(v) {
  const moved = [];
  for (const [k, t] of Object.entries(v.ring.keys)) {
    const o = ownerOf(v, KEYS[k]);
    if (t.owner && t.owner !== o) moved.push(k);
    t.owner = o;
    t.label.setAttribute('fill', o ? NC[o] : GREY);
  }
  return moved;
}
async function repaint(s, v) { const moved = paintKeys(v); for (const k of moved) await s.pulse(v.ring.keys[k], 1, 1.3); return moved; }
function drawRing(s, v, { vnodes, faded }) {
  const g = s.g(0, 0);
  SD.el('circle', { cx: RC.cx, cy: RC.cy, r: RC.r, fill: '#fff', stroke: '#b9c2c9', 'stroke-width': 2.2 }, g);
  s.text(g, RC.cx, RC.cy - 7, 'HASH RING', { 'font-size': 9.5, 'font-weight': 700, fill: '#65727a', 'letter-spacing': '.06em' });
  s.text(g, RC.cx, RC.cy + 8, '0 … 2³²', { 'font-size': 10.5, fill: '#9aa3a9', 'font-family': MONO });
  v.ring = { g, dots: { c1: [], c2: [], c3: [], c4: [] }, keys: {} };
  for (const k of Object.keys(KEYS)) keyMark(s, v, k);
  for (const n of ['c1', 'c2', 'c3']) for (const deg of vnodes ? [...ONE[n], ...VN[n]] : ONE[n]) dot(s, v, n, deg);
  paintKeys(v);
  if (faded) g.setAttribute('opacity', .25);
}
// Node c4 is outside the ring until a flow adds it.
function c4Off(s, v) {
  v.n.c4.setAttribute('opacity', .35); s.setSub(v.n.c4, 'not in ring');
  for (const k of ['app>c4', 'coord>c4']) s.links[k]?.setAttribute('opacity', .3);
}
async function c4On(s, v, sub = 'empty · new') {
  for (const k of ['app>c4', 'coord>c4']) s.links[k]?.setAttribute('opacity', 1);
  await s.fade(v.n.c4, 1, 300); s.setSub(v.n.c4, sub, PURPLE);
}
function badge(s, n, id) {
  const g = s.g(n.w / 2 - 12, -n.h / 2 + 12, n);
  SD.el('circle', { r: 7, fill: NC['c' + id.slice(1)], opacity: id[0] === 'r' ? .55 : 1 }, g);
  s.text(g, 0, .5, id.slice(1), { 'font-size': 9, 'font-weight': 800, fill: '#fff' });
}

// State shown next to the components: ring, cache contents, MongoDB documents, DB load, users, the pods' L1.
function setup(s, v, { cache = [], db = [], cacheTitle = 'CACHE NODES · key → value', clock = '11:00:00', vnodes = true, ringFaded = false, c4 = false, a = 'idle', b = 'idle', app = 'L1: empty', dbl = 'DB 400 reads/s', repl = 'replication: async' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  for (const id of ['c1', 'c2', 'c3', 'c4', 'r1', 'r2', 'r3']) badge(s, v.n[id], id);
  v.cache = s.store(805, 50, 280, cacheTitle, { color: TEAL });
  v.db = s.store(805, 318, 280, 'MONGODB · source of truth', { color: GREEN });
  v.rows = {};
  cache.forEach(([id, txt, st = 'OK']) => { s.row(v.cache, txt, { ...ST[st], now: true }); v.rows[`cache:${id}`] = pre(v.cache.rows[v.cache.rows.length - 1]); });
  db.forEach(([id, txt, st = 'OK']) => { s.row(v.db, txt, { ...ST[st], now: true }); v.rows[`db:${id}`] = pre(v.db.rows[v.db.rows.length - 1]); });
  v.ua = s.chip(70, 196, a, { color: GREY });
  v.ub = s.chip(70, 406, b, { color: GREY });
  v.app = s.chip(255, 303, app, { mono: true, color: GREY });
  v.dbl = s.chip(945, 212, dbl, { mono: true, color: GREEN });
  v.repl = s.chip(690, 445, repl, { mono: true, color: GREY });
  drawRing(s, v, { vnodes, faded: ringFaded });
  if (!c4) c4Off(s, v);
  return v;
}
// Keep the padded columns: SVG would otherwise collapse repeated spaces.
const pre = r => { r.label.style.whiteSpace = 'pre'; return r; };
async function put(s, v, which, id, txt, st = 'OK') {
  const k = `${which}:${id}`, box = which === 'db' ? v.db : v.cache, r = v.rows[k];
  if (!r) { const p = s.row(box, txt, ST[st]); pre(box.rows[box.rows.length - 1]); v.rows[k] = await p; return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
async function drop(s, v, which, id) {
  const k = `${which}:${id}`, r = v.rows[k];
  if (r) { delete v.rows[k]; await s.unrow(which === 'db' ? v.db : v.cache, r); }
}
async function clearCache(s, v) { for (const k of Object.keys(v.rows).filter(k => k.startsWith('cache:'))) await drop(s, v, 'cache', k.slice(6)); }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : v.ua, txt, paint(color));
const appc = (s, v, t, color = GREY) => s.setChip(v.app, t, paint(color));
const dbl = (s, v, t, color = GREEN) => s.setChip(v.dbl, t, paint(color));
const repl = (s, v, t, color = GREY) => s.setChip(v.repl, t, paint(color));
const both = (...ps) => Promise.all(ps);
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, info = { mono: true, color: INDIGO, stroke: INDIGO };

window.DESIGN = {
  id: 'cache', n: 12, title: 'Distributed Cache', tagline: 'a hash ring routes every key, the database stays the truth, versions and TTLs bound staleness',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Clients', x0: 0, x1: 160, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Users call ordinary APIs (`GET /users/42`). They never see the cache: it only makes answers **faster** and keeps load **off the database**.',
      detail: 'A cache hit is ~1 ms; a MongoDB read is several ms and costs far more capacity.' },
    { id: 'app', title: 'App pods + ring', x0: 160, x1: 400, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'Every Spring Boot pod holds the **same hash ring** (drawn at the top) and computes which cache node owns a key: `murmur3(key)` → next node **clockwise**. **Membership** (etcd) pushes the node list when it changes.',
      detail: 'No proxy and no lookup service on the hot path: routing is a `TreeMap.ceilingEntry` in memory.' },
    { id: 'data', title: 'Cache cluster (Redis)', x0: 400, x1: 790, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'Redis primaries **c1–c3** each own several arcs of the ring; **c4** joins when memory runs out. Each primary copies its writes **asynchronously** to a replica (r1–r3) that is promoted if it dies.',
      detail: 'Memory is bounded: `maxmemory` + `allkeys-lru` / `allkeys-lfu`, and every key has a TTL.' },
    { id: 'async', title: 'Source of truth', x0: 790, x1: 1100, color: '#348747', soft: '#f3faf2', chip: '#ddf0da', line: '#cfe8cb',
      why: '**MongoDB** holds the real data. Every miss reads it; every write goes here **first**. Losing the whole cache costs latency, never data.',

  ],

  },

    c4: { x: 490, y: 445, w: 150, label: 'Cache c4', sub: 'joins later', icon: '⚡', layer: 'data' },

    r2: { x: 690, y: 200, w: 150, label: 'Replica r2', sub: 'copy of c2', icon: '🪞', layer: 'data' },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Hash to a node, read through, delete on write, grow by 1/N.',

  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v, { db: [['user:42', fd('user:42', 'plan=free  v1')]] }); v.ready = true; }
    await clearCache(s, v);
    if (v.ring.dots.c4.length) { await dropDots(s, v, 'c4'); paintKeys(v); c4Off(s, v); }
    await put(s, v, 'db', 'user:42', fd('user:42', 'plan=free  v1'));
    s.setSub(v.n.coord, 'etcd · ring v7'); who(s, v, 'A', 'idle'); who(s, v, 'B', 'idle'); repl(s, v, 'replication: async');

    ui.say(0); ui.cap('**Route** · A asks for user:42; the pod hashes it onto the ring → next node clockwise is c2');

    await s.pulse(v.ring.keys['user:42'], 1, 1.3);
    await s.send(['app', 'c2'], 'GET user:42', TEAL, { ms: 420 });
    ui.say(1); ui.cap('**Read through** · miss → read MongoDB → SET with a TTL; B\'s read is then a hit');
    await s.send(['c2', 'app'], '(nil) miss', GREY, { ms: 380 });
    await s.send(['app', 'db'], 'findOne(42)', GREEN, { ms: 420 });
    await s.send(['db', 'app'], 'free · v1', GREEN, { ms: 380 });
    await s.send(['app', 'c2'], 'SET EX 600', TEAL, { ms: 400 });
    await put(s, v, 'cache', 'user:42', fc('c2', 'user:42', 'free v1 · TTL 600'));
    who(s, v, 'A', 'profile ✓', GREEN);
    await s.send(['userB', 'app'], 'GET /users/42', BLUE, { ms: 380 });
    await s.send(['app', 'c2'], 'GET user:42', TEAL, { ms: 360 });
    await s.send(['c2', 'app'], 'HIT', GREEN, { ms: 340 });
    who(s, v, 'B', 'profile ✓ 1 ms', GREEN);
    ui.say(2); ui.cap('**Write** · B upgrades to pro: MongoDB first, then DEL the key (r2 copies the delete)');
    await s.send(['userB', 'app'], 'PUT plan=pro', AMBER, { ms: 380 });
    await s.send(['app', 'db'], 'update → v2', GREEN, { ms: 400 });
    await put(s, v, 'db', 'user:42', fd('user:42', 'plan=pro   v2'), 'NEW');
    await s.send(['app', 'c2'], 'DEL user:42', AMBER, { ms: 400 });
    await drop(s, v, 'cache', 'user:42');
    await s.send(['c2', 'r2'], 'DEL (async)', GREY, { ms: 360 });
    ui.say(3); ui.cap('**Scale** · c4 joins; pods get ring v8; only the keys on c4\'s arcs move (here 1 of 4)');

    await repaint(s, v);
    await s.flash(285, 205, 'sess:5 → c4 · 1 of 4', info, 900);
    await s.wait(1600);

    summary: [
      "The cache sits in front of **MongoDB**, which stays the source of truth, so losing the cache can make us slower but never lose data. I'd run a cluster of Redis primaries, each with a replica, and the first question is which node owns a key. The naive answer is hash of the key mod N, but the moment we add a fourth node about three quarters of the keys map somewhere else and the database gets a miss storm. So I use **consistent hashing**: nodes and keys are hashed with murmur3 onto a ring, a key belongs to the next node clockwise, and each server gets around 150 **virtual nodes** so the load is even. Adding a node then moves only about one N-th of the keys.",
      "The ring lives in the client library inside each Spring Boot pod, basically a TreeMap with ceilingEntry, and the node list comes from etcd, so there's no extra hop. In practice **Redis Cluster** does the same with 16,384 hash slots and Lettuce routes for us. Reads are **cache-aside**: get from Redis, on a miss read Mongo and set with a TTL plus some jitter. On writes I update Mongo first and then **delete** the key rather than setting it, because a delete can never leave an older value behind.",
      "There's still one race: a slow reader can put an old value back after a writer deleted it. For data where that hurts, like a user's plan, I store the document **version** and a small Lua script only overwrites with a higher version; the TTL is the safety net for everything else. Memory is bounded with maxmemory and **allkeys-lru** or **LFU**, because Redis' default, noeviction, would make writes fail when it's full.",

      { t: 'Consistent-hash ring with virtual nodes (TreeMap)', code: `public final class HashRing {
  private static final int VNODES = 150;
  private volatile TreeMap<Long, String> ring = new TreeMap<>();

  // Called when etcd pushes a new ring version: build a new map, swap it atomically.
  public void setNodes(Collection<String> nodes) {
    TreeMap<Long, String> r = new TreeMap<>();
    for (String node : nodes)
      for (int i = 0; i < VNODES; i++) r.put(hash(node + "#" + i), node);   // "c1#0", "c1#1", …
    ring = r;
  }

  public String nodeFor(String key) {
    TreeMap<Long, String> r = ring;
    Map.Entry<Long, String> e = r.ceilingEntry(hash(key));   // first vnode clockwise
    return (e != null ? e : r.firstEntry()).getValue();      // wrap around past 2^32
  }

  private static long hash(String s) {                       // murmur3 → 0 … 2^32
    return Hashing.murmur3_32_fixed().hashString(s, UTF_8).asInt() & 0xffffffffL;
  }
}` },
      { t: 'Cache-aside with RedisTemplate, delete on write', code: `@Service
class UserCache {
  // With Redis Cluster, Lettuce routes each key to its slot's node; with our own ring: pools.get(ring.nodeFor(key))
  private final StringRedisTemplate redis;
  private final UserRepository users;

  User get(long id) {
    String key = "user:" + id;
    String hit = redis.opsForValue().get(key);
    if (hit != null) return Json.read(hit, User.class);
    User u = users.findById(id).orElseThrow();                 // miss → source of truth
    redis.opsForValue().set(key, Json.write(u), ttl());
    return u;
  }

  void changePlan(long id, String plan) {
    users.updatePlan(id, plan);              // MongoDB first: $set plan, $inc version
    redis.delete("user:" + id);              // then DELETE, never SET
  }
