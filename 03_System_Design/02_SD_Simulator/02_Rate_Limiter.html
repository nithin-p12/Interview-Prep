// Rate Limiter (distributed, in the API gateway, counters in Redis). Everything specific to this design lives here;
// engine/app.js renders it. Basics (load balancer, gateway, Redis) are taught in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';

// Redis row colours: plenty of tokens, running low, empty.
const ST = {
  ok: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  low: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  empty: { fill: '#fff4f4', stroke: RED, color: RED },
};
const fmt = (k, txt) => `${k.padEnd(11)}${txt}`;

// State shown next to the components: a clock, the Redis keys, what the backend served, each client's status.
function setup(s, v, { keys = [], clock = '10:00:00.000', served = 0, a = 'opens the app', c = 'idle' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.redisSt = s.store(880, 320, 210, 'REDIS · counters', { color: AMBER });
  v.keys = {};
  keys.forEach(([k, txt, st]) => {
    s.row(v.redisSt, fmt(k, txt), { ...ST[st ?? 'ok'], now: true });
    v.keys[k] = v.redisSt.rows[v.redisSt.rows.length - 1];
  });
  v.served = served;
  v.api = s.chip(970, 268, `served ${served}`, { mono: true, color: PURPLE });
  v.ua = s.chip(75, 156, a, { color: GREY });
  v.uc = s.chip(75, 376, c, { color: GREY });
  return v;
}
async function key(s, v, k, txt, st = 'ok') {
  const r = v.keys[k];
  if (!r) { v.keys[k] = await s.row(v.redisSt, fmt(k, txt), ST[st]); return; }
  r.label.textContent = fmt(k, txt);
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const serve = (s, v, n = 1) => { v.served += n; s.setChip(v.api, `served ${v.served}`); };
const who = (s, v, c, txt, color = GREY) => s.setChip(c === 'C' ? v.uc : v.ua, txt, { color, stroke: color === GREY ? '#d5d9dc' : color });

  intro: {

  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    for (const r of [...v.redisSt.rows]) await s.unrow(v.redisSt, r);
    v.keys = {}; v.served = 0; s.setChip(v.api, 'served 0');
    tick(s, v, '10:00:00.000'); who(s, v, 'A', 'opens the app'); who(s, v, 'C', 'idle');

    ui.say(0); ui.cap('**Check** · A calls the API; pod 1 runs one atomic script for key `rl:A`');

    await s.send(['gw1', 'redis'], 'EVALSHA rl:A', TEAL, { ms: 420 });
    await key(s, v, 'rl:A', 'tokens 4 · :00.0');
    await s.send(['redis', 'gw1'], 'allowed · 4', GREEN, { ms: 380 });
    await s.send(['gw1', 'api'], 'forward', BLUE, { ms: 420 }); serve(s, v);
    await s.send(['api', 'gw1', 'lb', 'userA'], '200 · remaining 4', GREEN, { ms: 380 });

    ui.say(1); ui.cap('**Shared** · the next call lands on pod 2, but it updates the **same** key');
    tick(s, v, '10:00:01.000');
    await s.send(['userA', 'lb', 'gw2'], 'GET /orders/42', BLUE, { ms: 440 });
    await s.send(['gw2', 'redis'], 'EVALSHA rl:A', TEAL, { ms: 420 });
    await key(s, v, 'rl:A', 'tokens 3.5 · :01.0');
    await s.send(['gw2', 'api'], 'forward', BLUE, { ms: 420 }); serve(s, v);

    ui.say(2); ui.cap('**Reject** · Bot C has no tokens left: **429**, and the backend never sees it');
    await key(s, v, 'rl:C', 'tokens 0.2', 'empty');
    await s.send(['bot', 'lb', 'gw2'], 'GET #6', RED, { ms: 440 });
    await s.send(['gw2', 'redis'], 'EVALSHA rl:C', TEAL, { ms: 420 });
    await s.send(['redis', 'gw2'], 'denied', RED, { ms: 380 });
    await s.send(['gw2', 'lb', 'bot'], '429 · Retry-After 2', RED, { ms: 400 });
    who(s, v, 'C', 'throttled · 429', RED);

    ui.say(3); ui.cap('**Rules** · limits per plan and route come from config, cached in each pod');
    await s.send(['rules', 'gw1'], 'free: 5 · 0.5/s', AMBER, { ms: 500 });
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

    summary: [
      "A rate limiter controls how many requests a client can make in a period, to protect our services from abuse and keep usage fair. I put it in the **API gateway**, so every service is protected in one place before any business code runs.",
      "For every request the gateway builds a **key**, usually the user id from the JWT plus the route, and checks a **token bucket** for it. Each key has a bucket of, say, 5 tokens that refills at 0.5 per second. A request takes a token, and if the bucket is empty we return **429 Too Many Requests** with a `Retry-After` header, so the backend never sees that request.",
      "Because we run many gateway pods behind a load balancer, the counters can't live in pod memory, otherwise a user would get the limit once per pod. So the buckets live in **Redis**, and the check is **one Lua script** that refills, takes a token and writes back **atomically**. That matters: with a GET and then a SET from Java, two pods could both spend the last token. In Spring Cloud Gateway this is the built-in Redis `RequestRateLimiter` filter.",
      "The limiter is on every request, so the Redis call has a **tiny timeout and a circuit breaker**. If Redis is down, normal routes **fail open** with a small local bucket, while login, OTP and payments **fail closed**. After a failover a few extra requests may pass because replication is asynchronous, which is acceptable for rate limiting.",

      { t: 'Token bucket in Lua (runs atomically in Redis)', code: '-- KEYS[1] = rl:{user}:{route}   ARGV[1] = capacity   ARGV[2] = refill per second\nlocal cap, rate = tonumber(ARGV[1]), tonumber(ARGV[2])\nlocal t = redis.call("TIME")                       -- Redis clock: no pod clock skew\nlocal now = t[1] * 1000 + math.floor(t[2] / 1000)\n\nlocal b = redis.call("HMGET", KEYS[1], "tokens", "ts")\nlocal tokens = tonumber(b[1]) or cap              -- new key starts full\nlocal ts = tonumber(b[2]) or now\ntokens = math.min(cap, tokens + (now - ts) / 1000 * rate)\n\nlocal allowed = 0\nif tokens >= 1 then tokens = tokens - 1; allowed = 1 end\nredis.call("HSET", KEYS[1], "tokens", tokens, "ts", now)\nredis.call("PEXPIRE", KEYS[1], math.ceil(cap / rate * 1000))\nreturn { allowed, tostring(tokens) }' },

      { t: 'Calling the script yourself (Spring Data Redis)', code: 'RedisScript<List> bucket = RedisScript.of(new ClassPathResource("token_bucket.lua"), List.class);\n\nDecision check(String user, Rule rule) {\n  String key = "rl:" + user + ":" + rule.route();\n  List<Object> r = redis.execute(bucket, List.of(key),\n      String.valueOf(rule.capacity()), String.valueOf(rule.refillPerSec()));   // EVALSHA, cached script\n  boolean allowed = ((Long) r.get(0)) == 1L;\n  double tokens = Double.parseDouble((String) r.get(1));\n  long retryAfter = allowed ? 0 : (long) Math.ceil((1 - tokens) / rule.refillPerSec());\n  return new Decision(allowed, (long) tokens, retryAfter);   // → headers or 429 + Retry-After\n}' },

    { g: 'cc', q: 'Two gateway pods use the last token at the same time. Can both pass?', what: 'With GET then SET from Java, yes: both read 1 token and both forward.', why: 'Separate read and write commands leave a gap for the other pod (check-then-act).', how: 'Do read-decide-write in **one Lua script** (or a single `INCR` for counters). Redis executes one script at a time.', trade: 'Scripts must be short: a slow script blocks every other Redis command.', flow: 'race' },
    { g: 'cc', q: 'Why not MULTI/EXEC instead of Lua?', what: 'MULTI/EXEC queues commands and runs them together.', why: 'You cannot branch on a value read inside the transaction, and the bucket needs "if tokens ≥ 1 then take".', how: 'Lua (`EVALSHA`) or Redis Functions. `WATCH` + MULTI works but retries under contention.', trade: 'Lua logic lives in Redis: version and test the script like code.', flow: 'race' },
    { g: 'cc', q: 'Pods have different clocks. Does that break the bucket?', what: 'If each pod passes its own "now", skew makes refills wrong (even negative).', why: 'The refill depends on elapsed time between calls from different pods.', how: 'Read the time **inside the script** with `redis.call("TIME")`, so one clock is used for every key.', trade: 'Ties the limiter to the Redis node\'s clock (fine; it is one node per key).' },
    { g: 'al', q: 'Token bucket vs fixed vs sliding window?', what: 'Fixed window allows 2× bursts at the boundary; sliding log is exact but stores each request.', why: 'Trade precision against memory and CPU.', how: '**Token bucket** for burst-friendly APIs; **sliding-window counter** for "N per minute" with low memory.', trade: 'None is perfect; document the behaviour for API users.', flow: 'window' },
    { g: 'al', q: 'What about the leaky bucket?', what: 'Requests enter a queue that drains at a fixed rate.', why: 'It smooths output to a constant rate.', how: 'Good for **your own outbound calls** to a third-party API with a strict rate; for incoming APIs a 429 is better than queueing.', trade: 'Adds latency; a full queue still has to reject.' },
    { g: 'al', q: 'Should rejected requests be queued instead of getting 429?', what: 'Queuing hides overload but holds connections and grows latency.', why: 'A rate limit says "slow down", not "wait here".', how: 'Return **429 + Retry-After** for APIs; use queues (leaky bucket) for outbound calls.', trade: 'Clients must implement backoff.', flow: 'burst' },
    { g: 'fa', q: 'Redis is down. What does the gateway do?', what: 'Every limiter call fails or times out.', why: 'The limiter sits on the critical path.', how: 'Tight timeout + circuit breaker. **Fail open** with a local bucket (limit ÷ pods) for normal routes; **fail closed** for login / OTP.', trade: 'Fail open lets attackers through during the outage; fail closed means an outage for users.', flow: 'fail' },
    { g: 'fa', q: 'After a Redis failover, are limits still exact?', what: 'A few requests beyond the limit may be allowed.', why: 'Replication is asynchronous; the promoted replica may miss recent updates.', how: 'Accept it (rate limiting is approximate), or use `WAIT` for critical keys.', trade: '`WAIT` adds latency to every check.', flow: 'fail' },
    { g: 'fa', q: 'Should limiter counters go in a database?', what: 'A DB write per request adds latency and load to every API call.', why: '50k checks per second need sub-millisecond in-memory state.', how: 'Counters in Redis with expiry; only the **rules** in a DB / config.', trade: 'A total Redis loss resets counters: limits simply restart.' },
    { g: 'sc', q: 'How do you scale to 1 million requests per second?', what: 'One Redis primary becomes the bottleneck.', why: 'Every request is one Redis round trip.', how: '**Redis Cluster** sharded by key (a script must touch keys in one hash slot), token leasing for heavy users, per-region limiters.', trade: 'Global limits across regions become approximate.' },
    { g: 'sc', q: 'A single huge customer is a hot key. What now?', what: 'All their requests hit one Redis shard.', why: 'One key lives in one slot on one node.', how: '**Lease** tokens to pods in batches (one script call gives a pod 50 tokens), or split the key into N sub-buckets with limit ÷ N each.', trade: 'Leased-but-unused tokens and sub-buckets make bursts less precise.' },
    { g: 'sc', q: 'How much latency does the limiter add?', what: 'One Redis round trip per request.', why: 'Same-zone Redis is well under a millisecond; the script is microseconds of CPU.', how: '`EVALSHA` (script cached), connection pooling, Redis in the same zone as the pods.', trade: 'Cross-zone Redis adds about a millisecond.' },
    { g: 'cl', q: 'How should clients behave after a 429?', what: 'Retrying immediately makes it worse.', why: 'Synchronised retries create new bursts.', how: 'Honour `Retry-After`; exponential backoff with **jitter**; idempotency keys for retried writes.', trade: 'You cannot force bad clients, so the limiter must reject them cheaply.', flow: 'burst' },

    { g: 'tc', q: 'Gateway limiter or a library in each service?', what: 'Both exist: Spring Cloud Gateway `RequestRateLimiter`, Resilience4j `RateLimiter`, Bucket4j.', why: 'The gateway is one place for user-facing limits; Resilience4j limits are per JVM instance.', how: 'Gateway + Redis for user-facing limits; Resilience4j to protect calls to fragile dependencies.', trade: 'Per-instance limiters are not global.' },
