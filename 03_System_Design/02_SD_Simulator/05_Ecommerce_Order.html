<script>
// E-commerce order flow as an orchestrated saga (Order → Inventory → Payment → Shipping). Everything specific to this
// design lives here; engine/app.js renders it. Kafka, API gateway and DB basics are taught in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f', INDIGO = '#5a5fc8';

// Order status colours (the order status IS the saga state).
const ST = {
  PENDING: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  PAYMENT_PENDING: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  CONFIRMED: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  CANCELLING: { fill: '#fff8f0', stroke: AMBER, color: RED },
  CANCELLED: { fill: '#fff4f4', stroke: RED, color: RED },
};
const fmt = (id, user, label) => `${id.padEnd(5)}${user.padEnd(3)}${label}`;
const KEEP = '#d5d9dc';

// State shown next to the components: orders, outbox, Kafka offsets, stock, holds, payments, shipments, users.
function setup(s, v, { rows = [], clock = '11:00:00', stock = [5, 0], hold = 'holds —', pay = 'payments —', box = 'outbox —', kaf = 'cmd — · events —', a = 'browsing', b = 'browsing', ship = 'shipments —' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.log = s.store(15, 392, 262, 'ORDER DB · orders', { color: AMBER });
  v.rows = {};
  rows.forEach(([id, user, st, label]) => { s.row(v.log, fmt(id, user, label || st), { ...ST[st], now: true }); v.rows[id] = v.log.rows[v.log.rows.length - 1]; });
  v.box = s.chip(420, 470, box, { mono: true, color: AMBER });
  v.kaf = s.chip(665, 305, kaf, { mono: true, color: PURPLE });
  v.stk = s.chip(940, 140, '', { mono: true, color: TEAL });
  stk(s, v, ...stock);
  v.hold = s.chip(940, 167, hold, { mono: true, color: GREY });
  v.pay = s.chip(940, 320, pay, { mono: true, color: GREY });
  v.ship = s.chip(855, 478, ship, { mono: true, color: GREY });
  v.ua = s.chip(70, 126, a, { color: GREY });
  v.ub = s.chip(70, 336, b, { color: GREY });
  return v;
}
async function ord(s, v, id, user, st, label = st) {
  const txt = fmt(id, user, label), r = v.rows[id];
  if (!r) { v.rows[id] = await s.row(v.log, txt, ST[st]); return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const stk = (s, v, a, r, color) => s.setChip(v.stk, `SKU-42 · available ${a} · reserved ${r}`, paint(color || (a < 0 ? RED : TEAL)));
const hld = (s, v, t, color = GREY) => s.setChip(v.hold, t, paint(color));
const pay = (s, v, t, color = GREY) => s.setChip(v.pay, t, paint(color));
const obx = (s, v, t, color = AMBER) => s.setChip(v.box, t, { color, stroke: color === GREEN ? GREEN : KEEP });
const kaf = (s, v, t, color = PURPLE) => s.setChip(v.kaf, t, { color });
const shp = (s, v, t, color = GREY) => s.setChip(v.ship, t, paint(color));
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : v.ua, txt, paint(color));
const both = (...ps) => Promise.all(ps);

window.DESIGN = {
  id: 'shop', n: 5, title: 'E-commerce Order System', tagline: 'no distributed transaction: local transactions, outbox, idempotent steps, compensations',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Shoppers & edge', x0: 0, x1: 290, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Shoppers place orders with an **Idempotency-Key** (one per checkout) through the **API gateway**, and get **202 PENDING** back in milliseconds; the final status arrives later.',
      detail: 'The gateway does auth and rate limits; it holds no order state.' },
    { id: 'app', title: 'Order service (orchestrator)', x0: 290, x1: 560, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'The **Order Service** owns the order and drives the saga. Every step is a **local transaction** that updates the order **and** writes the next command to an **outbox** table; a **relay** publishes it.',
      detail: 'The order status **is** the saga state, so a crashed pod loses nothing: the next reply continues from the stored status.' },
    { id: 'async', title: 'Kafka · commands & replies', x0: 560, x1: 770, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'Commands (`inventory-cmd`, `payment-cmd`) go to the participants; replies come back on `saga-events`. Key = `orderId`.',
      detail: 'Delivery is **at-least-once**, so every consumer must be **idempotent**.' },
    { id: 'data', title: 'Participant services', x0: 770, x1: 1100, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: '**Inventory** reserves stock with a **conditional decrement** and an expiring **hold**; **Payment** charges with a provider **idempotency key**; **Shipping** reacts to OrderConfirmed. Each owns **its own database**.',
      detail: 'No 2PC across these databases: on failure the saga runs **compensations** (release the hold, refund).' },
  ],
  layersIntro: {

    text: 'The **Order Service** saves the order and an **outbox** command in one transaction and answers **202**. Through **Kafka** it asks **Inventory** to reserve stock, then **Payment** to charge, then confirms; if a step fails it **compensates** instead of rolling back. Hover a layer or a component to see why it exists.',
  },

    kafka: { x: 665, y: 220, w: 170, label: 'Kafka', sub: 'commands · events', icon: '📨', layer: 'async' },

    stockdb: { x: 1025, y: 90, w: 140, label: 'Stock DB', sub: 'stock · holds', icon: '🍃', layer: 'data' },

    },

      without: '—',

    },
    gw: {
      name: 'API Gateway',
      what: 'Single entry: JWT auth, rate limits per user, routing `/orders` to the Order Service.',
      why: 'Cross-cutting concerns in one place; bots hammering checkout are stopped here.',
      without: 'Every service re-implements auth and limits.',
      tech: 'Spring Cloud Gateway / Kong', scale: 'Stateless pods.', fails: 'Retries only idempotent calls; `POST /orders` is safe because of the Idempotency-Key.',
      core: ['gw', 'API Gateway'],
    },
    order: {
      name: 'Order Service (saga orchestrator)',
      what: 'Creates the order, then drives the steps: **reserve stock → charge → confirm**, or **compensate** on failure. Reacts to replies on `saga-events`.',

      without: 'Save then `kafka.send()`: a crash between them leaves an order that never progresses (or a message for an order that does not exist).',

    },
    relay: {
      name: 'Outbox relay',
      what: 'Reads unpublished outbox rows (MongoDB **change stream** or a poller), sends them to Kafka, marks them published.',
      why: 'Turns "committed in the DB" into "published to Kafka", even if Kafka was down at commit time.',
      without: 'Dual writes: DB and Kafka can disagree after a crash.',

    },

      without: 'Synchronous REST chain: Payment down = checkout down.',
      tech: 'Kafka; `KafkaTemplate` + `@KafkaListener`', scale: 'Partitions per topic; consumers up to one per partition.', fails: 'Redelivery after a crash or rebalance → **at-least-once**.',

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Accept, reserve, charge, confirm: or compensate.',
    points: [
      { t: 'Accept', color: BLUE, d: 'Save the order **and** an outbox command in one transaction; answer **202 PENDING**.' },
      { t: 'Reserve', color: TEAL, d: 'Inventory decrements only if `available ≥ 1` and writes a **hold** that expires.' },
      { t: 'Charge', color: PURPLE, d: 'Payment charges with an **idempotency key**, so a retry never charges twice.' },
      { t: 'Confirm', color: GREEN, d: 'The order becomes **CONFIRMED** and Shipping starts. On failure: **release the hold**.' },
    ],
    stats: [['1 k', 'orders / s'], ['100×', 'flash-sale peak'], ['0', 'oversold units'], ['1', 'charge per order']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    for (const r of [...v.log.rows]) await s.unrow(v.log, r);
    v.rows = {}; stk(s, v, 5, 0); hld(s, v, 'holds —'); pay(s, v, 'payments —'); obx(s, v, 'outbox —'); kaf(s, v, 'cmd — · events —'); shp(s, v, 'shipments —'); who(s, v, 'A', 'browsing');

    ui.say(0); ui.cap('**Accept** · A places the order; order + outbox command in one transaction, then 202');
    await s.send(['userA', 'gw', 'order'], 'POST /orders', BLUE, { ms: 420 });
    await s.send(['order', 'orderdb'], 'order + outbox', BLUE, { ms: 420 });
    await ord(s, v, 'o-1', 'A', 'PENDING');
    obx(s, v, 'outbox: ReserveInventory ⏳');
    await s.send(['order', 'gw', 'userA'], '202 PENDING', GREEN, { ms: 380 });
    who(s, v, 'A', 'order pending', AMBER);
    ui.say(1); ui.cap('**Reserve** · the relay publishes the command; Inventory decrements only if stock is left');
    await s.send(['orderdb', 'relay', 'kafka'], 'ReserveInventory', AMBER, { ms: 400 });
    obx(s, v, 'outbox: ReserveInventory ✓', GREEN);
    await s.send(['kafka', 'inventory', 'stockdb'], 'available ≥ 1 ?', TEAL, { ms: 400 });
    stk(s, v, 4, 1); hld(s, v, 'hold o-1 HELD · 11:15', TEAL);
    await s.send(['inventory', 'kafka', 'order'], 'InventoryReserved', TEAL, { ms: 400 });
    await ord(s, v, 'o-1', 'A', 'PAYMENT_PENDING');
    ui.say(2); ui.cap('**Charge** · Payment charges with idempotency key `pay-o-1`');
    await s.send(['kafka', 'payment', 'provider'], 'charge · pay-o-1', PURPLE, { ms: 400 });
    await s.send(['provider', 'payment'], 'succeeded', GREEN, { ms: 380 });
    pay(s, v, 'pay-o-1 CAPTURED ₹999', GREEN);
    await s.send(['payment', 'kafka', 'order'], 'PaymentCompleted', PURPLE, { ms: 400 });
    ui.say(3); ui.cap('**Confirm** · order CONFIRMED, hold becomes a sale, Shipping starts');
    await ord(s, v, 'o-1', 'A', 'CONFIRMED');
    await both(s.send(['kafka', 'inventory'], 'ConfirmHold', GREEN, { ms: 400 }), s.send(['kafka', 'shipping'], 'OrderConfirmed', GREEN, { ms: 400 }));
    stk(s, v, 4, 0); hld(s, v, 'hold o-1 CONFIRMED', GREEN); shp(s, v, 'shipment s-9 · o-1', GREEN);
    await s.send(['order', 'gw', 'userA'], 'CONFIRMED', GREEN, { ms: 380 });
    who(s, v, 'A', 'order confirmed ✓', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'happy', title: 'A buys SKU-42', sub: 'outbox · reserve · charge · confirm', color: BLUE,
      build: (s, v) => setup(s, v),

          async run(s, v) {

        },
        {
          title: 'Answer 202 now',

          observe: 'A sees "order pending".',
          focus: v => [v.n.userA],
          async run(s, v) {
            await s.send(['order', 'gw', 'userA'], '202 PENDING', GREEN);
            who(s, v, 'A', 'order o-1 pending', AMBER);
          },
        },
        {
          title: 'The relay publishes the command',
          text: 'The outbox relay (a MongoDB **change stream**) sees the new row, sends `ReserveInventory(o-1)` to `inventory-cmd` with key `o-1`, and marks the row published.',
          observe: 'The command lands on inventory-cmd; the outbox row is published.',
          focus: v => [v.n.relay, v.kaf],
          async run(s, v) {
            await s.send(['orderdb', 'relay', 'kafka'], 'ReserveInventory', AMBER);
            obx(s, v, 'outbox: ReserveInventory ✓', GREEN);
            kaf(s, v, 'inventory-cmd @0 · events —'); await s.pulse(v.kaf);
          },
        },
        {
          title: 'Reserve: conditional decrement + hold',
          text: 'Inventory runs `updateOne({ _id: "SKU-42", available: { $gte: 1 } }, { $inc: { available: -1, reserved: 1 } })` and inserts hold `{ _id: "o-1", status: "HELD", expiresAt: 11:15 }`, in one local transaction. The filter refuses to go below zero.',
          observe: 'available 5 → 4, reserved 0 → 1; hold o-1 is HELD until 11:15.',
          say: 'Inventory reserves with a conditional decrement and a hold that expires.',
          focus: v => [v.stk, v.hold],
          async run(s, v) {
            await s.send(['kafka', 'inventory'], 'ReserveInventory o-1', TEAL);
            await s.send(['inventory', 'stockdb'], 'available ≥ 1 ? −1', TEAL);
            stk(s, v, 4, 1); hld(s, v, 'hold o-1 HELD · expires 11:15', TEAL);
            await s.pulse(v.stk);
          },
        },
        {
          title: 'Reply → the orchestrator takes the next step',
          text: 'Inventory replies `InventoryReserved(o-1)`. The orchestrator runs `updateOne({ _id: "o-1", status: "PENDING" }, { $set: { status: "PAYMENT_PENDING" } })` **plus** an outbox `ProcessPayment(o-1)`, again in one transaction.',
          observe: 'o-1 moves to PAYMENT_PENDING.',
          say: 'Each reply moves the order status forward and writes the next command in the same transaction.',
          focus: v => [v.rows['o-1']],
          async run(s, v) {
            await s.send(['inventory', 'kafka', 'order'], 'InventoryReserved', TEAL);
            kaf(s, v, 'inventory-cmd @0 · saga-events @0');
            await s.send(['order', 'orderdb'], 'status + outbox', BLUE);
            await ord(s, v, 'o-1', 'A', 'PAYMENT_PENDING');
            obx(s, v, 'outbox: ProcessPayment ⏳');
          },
        },
        {
          title: 'Charge with an idempotency key',
          text: 'The relay publishes `ProcessPayment(o-1)`. Payment calls the provider with `Idempotency-Key: pay-o-1`: if this call is ever retried, the provider returns the **same** charge instead of making a new one.',
          observe: 'The provider captures ₹999 once.',
          say: 'Payment uses an idempotency key per order, so a retry never charges twice.',
          focus: v => [v.pay],
          async run(s, v) {
            await s.send(['orderdb', 'relay', 'kafka'], 'ProcessPayment', AMBER);
            obx(s, v, 'outbox: ProcessPayment ✓', GREEN);
            await s.send(['kafka', 'payment'], 'ProcessPayment o-1', PURPLE);
            await s.send(['payment', 'provider'], 'charge · key pay-o-1', PURPLE);
            await s.send(['provider', 'payment'], 'succeeded', GREEN);
            pay(s, v, 'pay-o-1 CAPTURED ₹999', GREEN); await s.pulse(v.pay);
          },
        },
        {
          title: 'Confirm, turn the hold into a sale, ship',
          text: '`PaymentCompleted` → o-1 **CONFIRMED** + outbox `ConfirmHold` and `OrderConfirmed`. Inventory marks the hold CONFIRMED (`reserved −1`); Shipping creates shipment `s-9`. A gets the final status.',
          observe: 'o-1 is CONFIRMED, the hold is sold, a shipment exists.',
          focus: v => [v.rows['o-1'], v.ship],
          async run(s, v) {
            await s.send(['payment', 'kafka', 'order'], 'PaymentCompleted', PURPLE);
            await ord(s, v, 'o-1', 'A', 'CONFIRMED');
            kaf(s, v, 'inventory-cmd @1 · saga-events @2');

@Transactional                                    // MongoTransactionManager
public ResponseEntity<OrderView> place(@RequestHeader("Idempotency-Key") String key,
                                       @RequestBody PlaceOrder req) {
  Optional<Order> existing = orders.findByIdemKey(key);
  if (existing.isPresent()) return accepted(existing.get());        // client retry → same order
  Order o = orders.insert(Order.pending(key, req));                 // unique index on idemKey

  return accepted(o);                                               // 202 PENDING
}   // a racing retry hits E11000 → @ExceptionHandler returns the existing order` },

  if (mongo.exists(query(where("_id").is(c.orderId())), Hold.class))
    return true;                                    // redelivered command → already reserved
  UpdateResult r = mongo.updateFirst(
      query(where("_id").is(c.sku()).and("available").gte(c.qty())),   // never below zero
      new Update().inc("available", -c.qty()).inc("reserved", c.qty()),
      Stock.class);
  if (r.getModifiedCount() == 0) return false;      // sold out → InventoryRejected
  mongo.insert(Hold.held(c.orderId(), c.sku(), c.qty(), now().plus(15, MINUTES)));  // _id = orderId
  return true;                                      // → InventoryReserved
}` },

@Transactional
void on(SagaEvent e) {
  switch (e) {
    case InventoryReserved r -> advance(r.orderId(), PENDING, PAYMENT_PENDING, new ProcessPayment(r.orderId()));
    case InventoryRejected r -> advance(r.orderId(), PENDING, CANCELLED, null);
    case PaymentFailed p     -> advance(p.orderId(), PAYMENT_PENDING, CANCELLING, new ReleaseHold(p.orderId()));

    case PaymentCompleted p  -> {
      if (!advance(p.orderId(), PAYMENT_PENDING, CONFIRMED, new ConfirmHold(p.orderId())))

    }
    default -> { }
  }
}
boolean advance(String id, Status from, Status to, Command next) {

  return true;
}` },
