<script>
// Git internals + hosted Git (GitHub-like). Taught HERE: content-addressed objects (Merkle DAG), refs as pointers,
// merge base + 3-way merge, push/fetch negotiation + packfiles, ref update as compare-and-set, replicated repo
// storage, Git LFS. Kafka, S3 and DB scaling basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Row colours for objects (blob / tree / commit) and refs.
const ST = {
  BLOB: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  TREE: { fill: '#f2faf9', stroke: TEAL, color: TEAL },
  COMMIT: { fill: '#faf6fd', stroke: PURPLE, color: PURPLE },
  REF: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  LOG: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
// SVG collapses normal spaces, so pad with non-breaking ones to keep the monospace columns aligned.
const pad = (str, n) => str.padEnd(n, ' ');
const O = (sha, type, rest = '') => `${pad(sha, 5)}${pad(type, 7)}${rest}`;    // object row
const R = (ref, rest) => `${pad(ref, 9)}${rest}`;                              // ref row
const KIND = { blob: 'BLOB', tree: 'TREE', commit: 'COMMIT' };

// Commit graph (bottom left): columns and lanes.
const X = [28, 66, 104, 142, 180], MAIN = 410, FEAT = 470;
function drawCommit(s, v, id, x, y, parents = [], color = PURPLE) {
  for (const p of parents) {
    const P = v.dag[p], dx = x - P._x, dy = y - P._y, d = Math.hypot(dx, dy);
    v.dagLines.push(s.line(x - dx / d * 11, y - dy / d * 11, P._x + dx / d * 12, P._y + dy / d * 12, { stroke: '#9aa3a9', width: 1.4 }));
  }
  const g = s.g(x, y, s.root, { class: 'sd-commit' });
  g.circle = SD.el('circle', { cx: 0, cy: 0, r: 9, fill: '#fff', stroke: color, 'stroke-width': 2.2 }, g);
  s.text(g, 0, -17, id, { 'font-size': 10.5, 'font-weight': 700, fill: color, 'font-family': 'Consolas, "Cascadia Mono", monospace' });
  v.dag[id] = g;
  return g;
}
async function commit(s, v, id, lane, col, parents, color) { await s.pop(drawCommit(s, v, id, X[col], lane, parents, color), 260); }
const branchAt = (s, v, name, x, y, color) => { v.br[name] = s.chip(x, y + 23, name, { size: 10.5, mono: true, color, stroke: color, fill: '#fff' }); };
async function moveBranch(s, v, name, col, lane) { await s.move(v.br[name], X[col], lane + 23, 420); await s.pulse(v.br[name], 1, 1.1); }

// State drawn next to the components: objects, refs, commit graph, people, router and replica refs, PR.
function setup(s, v, { objs = [], refs = [], graph = [], branches = [], a = 'local repo', b = 'local repo', rt = 'repo-42 → A · B · C', ra = 'main → —', rb = 'main → —', rc = 'main → —', pr = 'no PR', objTitle = 'OBJECTS · repo-42', refTitle = 'REFS · repo-42' } = {}) {
  v.obj = s.store(885, 196, 205, objTitle, { color: PURPLE });
  v.ref = s.store(885, 366, 205, refTitle, { color: AMBER });
  v.rows = {};
  objs.forEach(([key, txt, st]) => { s.row(v.obj, txt, { ...ST[st], now: true }); v.rows[key] = v.obj.rows[v.obj.rows.length - 1]; v.rows[key].st = v.obj; });
  refs.forEach(([key, txt, st]) => { s.row(v.ref, txt, { ...ST[st ?? 'REF'], now: true }); v.rows[key] = v.ref.rows[v.ref.rows.length - 1]; v.rows[key].st = v.ref; });
  v.dag = {}; v.dagLines = []; v.br = {};
  v.dagT = s.note(15, 372, 'COMMIT GRAPH', { 'text-anchor': 'start', 'font-size': 11, 'font-weight': 700, fill: GREY, 'letter-spacing': '.04em' });
  graph.forEach(([id, lane, col, parents, color]) => drawCommit(s, v, id, X[col], lane, parents, color));
  branches.forEach(([name, lane, col, color]) => branchAt(s, v, name, X[col], lane, color ?? AMBER));
  v.ua = s.chip(95, 140, a, { color: GREY });
  v.ub = s.chip(95, 320, b, { color: GREY });
  v.rt = s.chip(310, 320, rt, { mono: true, color: GREY });
  v.ra = s.chip(555, 140, ra, { mono: true, color: GREY });
  v.rb = s.chip(555, 320, rb, { mono: true, color: GREY });
  v.rc = s.chip(555, 497, rc, { mono: true, color: GREY });
  v.pr = s.chip(785, 320, pr, { color: GREY });
  return v;
}
// Add (or update) an object row; keeps the last 5 visible.
async function obj(s, v, key, txt, st) {
  const r = v.rows[key];
  if (r) { r.label.textContent = txt; s.paintRow(r, ST[st]); await s.pulse(r, 1, 1.05); return; }
  if (v.obj.rows.length >= 5) { const old = v.obj.rows[0]; await s.unrow(v.obj, old); for (const k in v.rows) if (v.rows[k] === old) delete v.rows[k]; }
  v.rows[key] = await s.row(v.obj, txt, ST[st]); v.rows[key].st = v.obj;
}
async function ref(s, v, key, txt, st = 'REF') {
  const r = v.rows[key];
  if (r) { r.label.textContent = txt; s.paintRow(r, ST[st]); await s.pulse(r, 1, 1.05); return; }
  v.rows[key] = await s.row(v.ref, txt, ST[st]); v.rows[key].st = v.ref;
}
async function reset(s, v) {
  for (const st of [v.obj, v.ref]) for (const r of [...st.rows]) await s.unrow(st, r);
  v.rows = {};
  for (const g of Object.values(v.dag)) g.remove(); for (const l of v.dagLines) l.remove(); for (const c of Object.values(v.br)) c.remove();
  v.dag = {}; v.dagLines = []; v.br = {};
}
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const who = (s, v, u, txt, color = GREY) => s.setChip({ a: v.ua, b: v.ub, rt: v.rt, ra: v.ra, rb: v.rb, rc: v.rc, pr: v.pr }[u], txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, warn = { mono: true, color: AMBER, stroke: AMBER, fill: '#fdf6ea' };

// Server state shared by the hosted-Git flows: main → c2 on all three replicas.
const SERVER = { objs: [['c2', O('c2b7', 'commit', 'tree 7a41 ← c1a0'), 'COMMIT']], refs: [['main', R('main', '→ c2b7'), 'REF']],
  graph: [['c1', MAIN, 0, [], PURPLE], ['c2', MAIN, 1, ['c1'], PURPLE]], branches: [['main', MAIN, 1, AMBER]], ra: 'main → c2b7', rb: 'main → c2b7', rc: 'main → c2b7' };

window.DESIGN = {
  id: 'git', n: 14, title: 'Git', tagline: 'immutable content-addressed objects, branches as tiny pointers, and every ref update is a compare-and-set',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Developers', x0: 0, x1: 200, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Every developer has a **full local repository**: all objects and all history. Commits, branches and merges are local operations; only push and fetch talk to the server.',
      detail: 'The commit graph (bottom) is the history: each commit points to its parents.' },
    { id: 'app', title: 'Front end & LFS', x0: 200, x1: 420, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'The **Git front end** terminates SSH / HTTPS, authenticates and checks permissions; the **repo router** knows which storage nodes hold each repository. **LFS** keeps large binaries out of Git.',
      detail: 'Stateless; scale by adding instances.' },
    { id: 'data', title: 'Repo storage', x0: 420, x1: 690, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'A repository is a directory of **packfiles + refs** on local disk. Each repo lives on **3 storage nodes**; a push is written to all of them and the ref update needs a **quorum**.',
      detail: 'Repos are sharded by repo id: one repo never spans nodes, many repos share a node.' },
    { id: 'async', title: 'Events & checks', x0: 690, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'After a ref changes, a **push event** goes to Kafka. Pull requests, checks, webhooks and CI all react to it, without slowing the push down.',
      detail: 'The stores on the right show one repository\'s objects and refs.' },
  ],
  layersIntro: {
    title: 'Objects are immutable, refs are pointers, the server only moves pointers safely',
    text: 'Developers commit locally: content becomes **blobs, trees and commits** named by their **SHA**. A **push** sends only the missing objects in a **packfile** to the front end, which finds the repo\'s **storage nodes** and writes to all replicas; the branch then moves with a **compare-and-set**. A **push event** drives pull requests, webhooks and CI. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    devA: { x: 95, y: 90, w: 150, label: 'Asha', sub: 'git push', icon: '👩‍💻', layer: 'entry' },
    devB: { x: 95, y: 270, w: 150, label: 'Ben', sub: 'git fetch · merge', icon: '👨‍💻', layer: 'entry' },

    st3: { x: 555, y: 445, w: 160, label: 'Storage C', sub: 'replica · disk', icon: '🗄️', layer: 'data' },
    kafka: { x: 785, y: 90, w: 150, label: 'Kafka', sub: 'push events', icon: '📨', layer: 'async' },
    hooks: { x: 785, y: 270, w: 150, label: 'PRs & webhooks', sub: 'checks · merge', icon: '🔀', layer: 'async' },

  },
  wires: [['devA', 'edge'], ['devB', 'edge'], ['devA', 'lfs'], ['edge', 'router'], ['edge', 'st1'], ['edge', 'st2'], ['edge', 'st3'], ['st1', 'st2'], ['st1', 'st3'],
    ['st1', 'kafka'], ['kafka', 'hooks'], ['hooks', 'ci'], ['hooks', 'st1']],

  components: {
    devA: {
      name: 'Developers (local repositories)',
      what: '`git add` writes **blobs**, `git commit` writes a **tree** and a **commit**, and moves the branch. All of it happens in `.git/objects` and `.git/refs` on the laptop.',
      why: 'Git is distributed: every clone is a complete, verifiable copy of the history, so most work needs no server.',

    },
    devB: {
      name: 'Ben',
      what: 'A second developer: fetches Asha\'s work, merges branches and races her to push to `main`.',
      why: 'Two developers show merges, non-fast-forward rejections and fetch negotiation.',
      without: '—',
      tech: 'Same', scale: 'Same', fails: 'Same',
    },
    edge: {
      name: 'Git front end',
      what: 'Speaks the Git wire protocol (v2) over **SSH** and **smart HTTPS**: authenticates the key / token, checks repo permissions and branch protection, then streams the pack between client and storage.',

      without: 'Every storage node exposed to the internet with its own auth.',
      tech: 'SSH daemon + HTTP service (e.g. Spring Boot with JGit\'s `ReceivePack` / `UploadPack`), behind an LB', scale: 'Stateless: add instances; long-lived connections for big clones.', fails: 'A dropped push leaves only unreferenced objects behind; the ref never moved.',
      core: ['gw', 'API gateway'],
    },

      without: 'Hash repo id mod N: adding a node moves huge repos around.',

    },
    lfs: {
      name: 'Git LFS store',
      what: 'Large files (videos, models, PSDs) are replaced in Git by a **pointer** (`oid sha256:…, size`). The content goes to the LFS API, which hands out **presigned S3 URLs**.',
      why: 'Git keeps every version of every file in every clone; binaries do not delta well.',
      without: 'A 2 GB file in history makes every clone 2 GB bigger, forever.',
      tech: 'LFS batch API + S3 (+ CDN for downloads), content addressed by SHA-256', scale: 'Object storage: practically unlimited.', fails: 'Download fails → the pointer file stays; retry `git lfs pull`.',
      core: ['s3', 'Storage · S3'],
    },
    st1: {
      name: 'Storage nodes (replicas)',
      what: 'Plain Git repositories on local SSD: `objects/pack/*.pack` + `.idx`, refs, and **object pools** shared by forks. Every repo has **3 replicas** on different racks.',
      why: 'Git needs fast random access to packs on a local filesystem; replicating whole repos keeps that simple.',
      without: 'One disk per repo: a disk failure loses unpushed history for everyone else.',
      tech: 'Git on ext4/XFS, pack bitmaps, `git repack` / `gc` in the background (GitHub calls its system Spokes)', scale: 'Shard by repo; move hot or huge repos to their own nodes.', fails: 'One replica down → quorum of 2 continues; repair re-syncs it later.',
    },
    st2: {
      name: 'Storage B',
      what: 'Second replica of repo-42. Takes part in every ref-update vote and can serve reads.',

      without: '—',
      tech: 'Same', scale: 'Same', fails: 'Same',
    },
    st3: {

    },

      what: '`{ repo, ref, before, after, pusher }` published **after** the ref update commits, keyed by repo id.',

      core: ['kafka', 'Queue · Kafka'],
    },
    hooks: {

      why: 'Code review and CI live around Git, not inside it.',
      without: 'CI polls every repo for changes.',

    },

    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Hash the content, point a branch at it, send only what is missing, move the pointer with a compare-and-set.',
    points: [
      { t: 'Store', color: BLUE, d: 'File → **blob**, folder → **tree**, snapshot → **commit**; each named by the **SHA** of its content.' },
      { t: 'Point', color: AMBER, d: 'A **branch** is a 41-byte file holding one commit id; committing just moves it.' },
      { t: 'Push', color: TEAL, d: 'Send missing objects in a **packfile**; write to **3 replicas**; move `main` only if it still points where we expect.' },
      { t: 'React', color: PURPLE, d: 'A **push event** updates PRs, fires webhooks and starts CI.' },
    ],
    stats: [['100 M+', 'repositories'], ['3', 'replicas per repo'], ['40 hex', 'SHA-1 object id'], ['1', 'winner per ref update']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await reset(s, v);
    who(s, v, 'a', 'local repo'); who(s, v, 'b', 'local repo'); who(s, v, 'pr', 'no PR');
    for (const k of ['ra', 'rb', 'rc']) who(s, v, k, 'main → c1a0');
    drawCommit(s, v, 'c1', X[0], MAIN, [], PURPLE); branchAt(s, v, 'main', X[0], MAIN, AMBER);

    ui.say(0); ui.cap('**Store** · Asha commits: blob, tree and commit, each named by its hash');
    await obj(s, v, 'blob', O('5d2b', 'blob', '"fix typo"'), 'BLOB');
    await obj(s, v, 'tree', O('7a41', 'tree', 'README → 5d2b'), 'TREE');
    await obj(s, v, 'c2', O('c2b7', 'commit', 'tree 7a41 ← c1a0'), 'COMMIT');
    await commit(s, v, 'c2', MAIN, 1, ['c1'], PURPLE);
    ui.say(1); ui.cap('**Point** · the branch moves to the new commit; nothing is copied');
    await moveBranch(s, v, 'main', 1, MAIN);
    await ref(s, v, 'main', R('main', '→ c2b7'));
    ui.say(2); ui.cap('**Push** · only the 3 new objects travel; all replicas store them; main moves by CAS');
    await s.send(['devA', 'edge'], 'pack · 3 obj', TEAL, { ms: 400 });
    await s.send(['edge', 'router'], 'where repo-42?', GREY, { ms: 320 });
    await s.send(['edge', 'st1'], 'pack', TEAL, { ms: 360 });
    await Promise.all([s.send(['st1', 'st2'], 'pack', TEAL, { ms: 360 }), s.send(['st1', 'st3'], 'pack', TEAL, { ms: 360, pulse: false })]);
    for (const k of ['ra', 'rb', 'rc']) who(s, v, k, 'main → c2b7', GREEN);
    who(s, v, 'a', 'pushed ✓', GREEN);
    ui.say(3); ui.cap('**React** · the push event updates the PR and starts CI');
    await s.send(['st1', 'kafka', 'hooks'], 'push main', PURPLE, { ms: 360 });
    who(s, v, 'pr', 'PR #12 · checks running', PURPLE);
    await s.send(['hooks', 'ci'], 'webhook', PURPLE, { ms: 360 });
    await s.send(['devB', 'edge'], 'fetch', BLUE, { ms: 360 });
    who(s, v, 'b', 'fetched c2b7', BLUE);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'objects', title: 'Objects and hashes', sub: 'blob · tree · commit · dedup', color: BLUE,
      build: (s, v) => setup(s, v, { objTitle: 'OBJECTS · Asha .git', refTitle: 'REFS · Asha .git', a: 'empty repo', b: '—', rt: '—', ra: '—', rb: '—', rc: '—' }),
      takeaway: 'Git is a **content-addressed** object store. A blob\'s id is the SHA of its content, a tree lists names → ids, a commit points to a tree and its parents. Same content = same id (**dedup** for free), and every id covers everything below it: a **Merkle DAG**, so one hash verifies a whole history.',
      steps: [
        {
          title: 'git add: the file becomes a blob',
          text: 'Git hashes `"blob 6\\0hello\\n"` with SHA-1 → `ce0136…` and stores the zlib-compressed bytes at `.git/objects/ce/0136…`. The **name of the object is the hash of its content**. No file name, no date: just bytes.',
          observe: 'Blob ce01 appears.',
          say: 'Git stores content under the hash of that content.',
          focus: v => [v.obj],
          async run(s, v) {
            await s.flash(95, 40, 'git add hello.txt', { mono: true, color: BLUE, stroke: BLUE, fill: '#fff' }, 500);
            await obj(s, v, 'b1', O('ce01', 'blob', '"hello\\n"'), 'BLOB');
            who(s, v, 'a', 'staged hello.txt', BLUE);
          },
        },
        {
          title: 'git commit: a tree and a commit',
          text: 'The **tree** is a listing: `100644 hello.txt → ce01`. Its id is the hash of that listing. The **commit** records `tree 9f3e`, author, time, message and **no parent** (first commit). Its id `c1a0` is the hash of all that.',
          observe: 'Tree 9f3e and commit c1a0.',
          focus: v => [v.rows['t1'], v.rows['c1']],
          async run(s, v) {
            await obj(s, v, 't1', O('9f3e', 'tree', 'hello.txt → ce01'), 'TREE');
            await obj(s, v, 'c1', O('c1a0', 'commit', 'tree 9f3e · root'), 'COMMIT');
            await commit(s, v, 'c1', MAIN, 0, [], PURPLE);
          },
        },
        {
          title: 'A branch is just a pointer',
          text: '`.git/refs/heads/main` is a 41-byte text file containing `c1a0…`, and `HEAD` says `ref: refs/heads/main`. Creating a branch writes one tiny file, which is why branches in Git are instant.',
          observe: 'main → c1a0; HEAD → main.',
          say: 'A branch is a named pointer to one commit.',
          focus: v => [v.ref, v.br.main],
          async run(s, v) {
            branchAt(s, v, 'main', X[0], MAIN, AMBER); await s.pop(v.br.main, 260);
            await ref(s, v, 'main', R('main', '→ c1a0'));
            await ref(s, v, 'HEAD', R('HEAD', '→ refs/heads/main'), 'LOG');
          },
        },
        {
          title: 'Change one file: everything else is reused',
          text: 'Asha adds `README` and commits. New blob `5d2b`, new tree `7a41` = `{ README → 5d2b, hello.txt → ce01 }`, new commit `c2b7` with **parent c1a0**. `hello.txt` did not change, so the new tree points to the **same blob ce01**: unchanged files cost nothing.',
          observe: 'Tree 7a41 reuses blob ce01; main moves to c2b7.',
          say: 'Unchanged content keeps its id, so every snapshot shares it: deduplication by design.',
          focus: v => [v.rows['t2'], v.br.main],
          async run(s, v) {
            await obj(s, v, 'b2', O('5d2b', 'blob', '"# Demo"'), 'BLOB');

    summary: [
      "At its core, Git is a **content-addressed object store**. A file's content becomes a **blob**, a directory becomes a **tree** listing names to blob ids, and a **commit** points to a tree and to its parent commits. Every object is named by the SHA hash of its content. So identical content is stored once, and because each id covers everything beneath it, the history is a **Merkle DAG**: one commit hash verifies the whole history, and any corruption is detected.",
      "Objects never change. The only mutable state is **refs**: a branch is just a name pointing to one commit, so creating a branch is writing a tiny file. Merging finds the **merge base**, the common ancestor, and does a **3-way merge** per file; if only one side changed, take it, if both changed the same lines, it's a conflict. The merge commit simply has two parents.",
      "On push, the server first advertises its refs, the client works out which objects the server is missing by walking the graph, and sends only those in one delta-compressed **packfile**. The server re-hashes and checks connectivity, and then the important part: the branch update is a **compare-and-set**, \"move main from c2 to a1 only if it's still c2\". If someone pushed in between, you get the non-fast-forward rejection and have to fetch and merge or rebase. That's exactly how JGit's `RefUpdate` with an expected old id behaves.",
      "For a GitHub-like service I'd **shard by repository**, because Git wants a repo on one local filesystem, and keep **three replicas** on different racks. A push writes the pack to all replicas and moves the ref with a **majority vote**; a lagging replica is marked stale and repaired by comparing checksums. Large binaries go to **Git LFS**, a pointer in Git and the content in S3 via presigned URLs. And after the ref commits, a **push event** goes to Kafka so pull requests, signed webhooks and CI react without slowing the push down.",

String objectId(String type, byte[] content) throws Exception {
  MessageDigest sha1 = MessageDigest.getInstance("SHA-1");
  sha1.update((type + " " + content.length + "\\0").getBytes(UTF_8));  // header, e.g. "blob 6\\0"
  sha1.update(content);
  return HexFormat.of().formatHex(sha1.digest());                      // "ce013625…" for "hello\\n"
}

      { t: 'Server side: ref update as compare-and-set (JGit)', code: `RefUpdate.Result moveBranch(Repository repo, String branch, ObjectId expectedOld, ObjectId newId) throws IOException {
  try (RevWalk walk = new RevWalk(repo)) {
    boolean fastForward = walk.isMergedInto(walk.parseCommit(expectedOld), walk.parseCommit(newId));
    if (!fastForward) return RefUpdate.Result.REJECTED;              // "non-fast-forward: fetch first"
  }
  RefUpdate ru = repo.updateRef("refs/heads/" + branch);
  ru.setExpectedOldObjectId(expectedOld);                             // CAS: only if main is still c2b7
  ru.setNewObjectId(newId);
  return ru.update();                                                 // FAST_FORWARD, or LOCK_FAILURE if it moved
}` },
      { t: 'Merge base and 3-way merge (JGit)', code: `RevCommit mergeBase(Repository repo, ObjectId a, ObjectId b) throws IOException {
  try (RevWalk walk = new RevWalk(repo)) {
    walk.setRevFilter(RevFilter.MERGE_BASE);                         // walk parents until both sides meet
    walk.markStart(walk.parseCommit(a));
    walk.markStart(walk.parseCommit(b));
    return walk.next();                                              // c2b7
  }
}

boolean tryMerge(Repository repo, ObjectId ours, ObjectId theirs) throws IOException {
  ResolveMerger merger = (ResolveMerger) MergeStrategy.RECURSIVE.newMerger(repo, true);  // in memory
  return merger.merge(ours, theirs);                                 // false → conflicts: merger.getUnmergedPaths()
}` },

  kafka.send("repo-pushes", repo, new PushEvent(repo, ref, before, after, pusher));   // key = repo id
}

@KafkaListener(topics = "repo-pushes", groupId = "webhooks")
void deliver(PushEvent e) throws Exception {
  for (Hook hook : hooks.forRepo(e.repo())) {
    byte[] body = json.writeValueAsBytes(e);
    Mac mac = Mac.getInstance("HmacSHA256");
    mac.init(new SecretKeySpec(hook.secret(), "HmacSHA256"));
    String sig = "sha256=" + HexFormat.of().formatHex(mac.doFinal(body));
    http.post(hook.url(), body, Map.of("X-Hub-Signature-256", sig,
                                       "X-Delivery-Id", e.repo() + ":" + e.after()));  // receiver dedupes
  }                                                                                // failures → retry topic
}` },
