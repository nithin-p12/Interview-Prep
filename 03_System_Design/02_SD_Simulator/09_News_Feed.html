<script>
// News feed (Instagram home feed): fan-out on write into Redis sorted-set timelines, celebrities pulled at read time
// (hybrid), ids hydrated from the Post DB, cursor pagination. Kafka, Redis, API gateway and DB basics live in
// 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Timeline row colours (the table is B's Redis sorted set tl:B, newest first).
const ST = {
  OLD: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  NEW: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  PULL: { fill: '#faf6fd', stroke: PURPLE, color: PURPLE },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
const P = (id, by, t, note = '') => `${id} · by ${by} · ${t}${note ? ' · ' + note : ''}`;
const TL0 = [['p-90', P('p-90', 'D', '19:58'), 'OLD'], ['p-88', P('p-88', 'E', '19:40'), 'OLD'], ['p-85', P('p-85', 'A', '19:12'), 'OLD']];

// State shown next to the components: B's timeline, Post DB, follow graph, Kafka, fan-out, users.
function setup(s, v, { rows = TL0, title = 'TIMELINE tl:B · REDIS ZSET', clock = '20:00:00', pdb = 'posts · p-90 p-88 p-85', tl = 'tl:B · newest 800 ids', gr = 'A: 3 · C: 10 M followers', kaf = 'post-created · @499', fo = 'fan-out idle', a = 'has a new photo', b = 'will open the feed', c = '10 M followers' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.tl = s.store(840, 372, 248, title, { color: RED });
  v.rows = {};
  rows.forEach(([key, txt, st]) => { s.row(v.tl, txt, { ...ST[st], now: true }); v.rows[key] = v.tl.rows[v.tl.rows.length - 1]; });
  v.pdb = s.chip(685, 108, pdb, { mono: true, color: TEAL });
  v.tlc = s.chip(685, 316, tl, { mono: true, color: RED });
  v.gr = s.chip(685, 476, gr, { mono: true, color: TEAL });
  v.kaf = s.chip(960, 206, kaf, { mono: true, color: PURPLE });
  v.fo = s.chip(960, 336, fo, { mono: true, color: PURPLE });
  v.ua = s.chip(72, 121, a, { color: GREY });
  v.ub = s.chip(72, 296, b, { color: GREY });
  v.uc = s.chip(72, 466, c, { color: GREY });
  return v;
}
// Re-stack the timeline rows after inserting at the top (a ZSET read with ZREVRANGE is newest first).
function restack(st) { st.rows.forEach((r, i) => { r._x = 0; r._y = 18 + i * 24; r.setAttribute('transform', `translate(0 ${r._y}) scale(${r._s ?? 1})`); }); }
async function onTop(s, v, key, txt, st) {
  const p = s.row(v.tl, txt, ST[st]);
  const r = v.tl.rows.pop(); v.tl.rows.unshift(r); restack(v.tl); v.rows[key] = r;
  await p;
  while (v.tl.rows.length > 5) {
    const last = v.tl.rows[v.tl.rows.length - 1];
    for (const k in v.rows) if (v.rows[k] === last) delete v.rows[k];
    await s.unrow(v.tl, last);
  }
}
async function put(s, v, key, txt, st) {
  const r = v.rows[key];
  if (!r) return onTop(s, v, key, txt, st);
  if (txt) r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
async function drop(s, v, key) { const r = v.rows[key]; if (!r) return; delete v.rows[key]; await s.unrow(v.tl, r); }
async function clearRows(s, v) { for (const r of [...v.tl.rows]) await s.unrow(v.tl, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const chip = (s, c, t, color) => s.setChip(c, t, color ? paint(color) : {});
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'B' ? v.ub : u === 'C' ? v.uc : v.ua, txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' };

window.DESIGN = {
  id: 'feed', n: 9, title: 'News Feed (Instagram)', tagline: 'push post ids into follower timelines, pull celebrities, hydrate on read, page by cursor',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Users & gateway', x0: 0, x1: 300, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Most users **read far more than they post** (≈ 100 : 1); a few **celebrities** have millions of followers. The **API gateway** authenticates and rate-limits every call.',
      detail: 'The skew in follower counts is what shapes the whole design.' },
    { id: 'app', title: 'Services', x0: 300, x1: 550, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'The **Post Service** owns the write path (store + event). The **Feed Service** owns the read path (timeline ids → merge → hydrate → rank → cursor). **Ranking** only reorders a small candidate set.',
      detail: 'Both services are stateless Spring Boot apps; all state lives in the stores.' },
    { id: 'data', title: 'Stores', x0: 550, x1: 820, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: '**Post DB** is the source of truth for content. The **timeline cache** keeps a Redis sorted set of **post ids** per active user. The **follow graph** answers "who follows A" and "whom does B follow".',
      detail: 'Timelines are a rebuildable cache: losing one costs a slower first read, never data.' },
    { id: 'async', title: 'Fan-out (async)', x0: 820, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: '**Kafka** buffers `PostCreated` events; **fan-out workers** push each new post id into every follower\'s timeline. Posting returns before any of this happens.',
      detail: 'The table bottom right is B\'s timeline, `tl:B`, newest first.' },
  ],
  layersIntro: {
    title: 'Write once, push ids, read one sorted set',
    text: 'A post is stored once in the **Post DB** and announced on **Kafka**. **Fan-out workers** push its **id** into each follower\'s Redis **sorted set**, so reading a feed is one `ZREVRANGE` plus a batch **hydrate**. Celebrities are **pulled** at read time instead of pushed. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    userA: { x: 72, y: 75, w: 136, label: 'User A', sub: 'posts', icon: '👤', layer: 'entry' },
    userB: { x: 72, y: 250, w: 136, label: 'User B', sub: 'reads feed', icon: '👤', layer: 'entry' },
    userC: { x: 72, y: 420, w: 136, label: 'Celebrity', sub: 'C · 10 M', icon: '⭐', layer: 'entry' },
    gateway: { x: 222, y: 250, w: 136, label: 'API Gateway', sub: 'auth · limits', icon: '🚪', layer: 'entry' },
    post: { x: 425, y: 130, w: 160, label: 'Post Svc', sub: 'store · publish', icon: '📝', layer: 'app' },
    feed: { x: 425, y: 340, w: 160, label: 'Feed Svc', sub: 'read · hydrate', icon: '📰', layer: 'app' },
    ranker: { x: 425, y: 460, w: 160, label: 'Ranking', sub: 'score candidates', icon: '📊', layer: 'app' },
    postdb: { x: 685, y: 62, w: 170, label: 'Post DB', sub: 'MongoDB · by id', icon: '🍃', layer: 'data' },
    timeline: { x: 685, y: 270, w: 170, label: 'Timeline cache', sub: 'Redis ZSET / user', icon: '⚡', layer: 'data' },
    graph: { x: 685, y: 430, w: 170, label: 'Follow Graph', sub: 'who follows whom', icon: '🔗', layer: 'data' },
    kafka: { x: 960, y: 160, w: 170, label: 'Kafka', sub: 'post-created', icon: '📨', layer: 'async' },
    fanout: { x: 960, y: 290, w: 170, label: 'Fan-out workers', sub: 'ZADD per follower', icon: '📤', layer: 'async' },
  },
  wires: [['userA', 'gateway'], ['userB', 'gateway'], ['userC', 'gateway'], ['gateway', 'post'], ['gateway', 'feed'], ['post', 'postdb'], ['post', 'kafka'], ['kafka', 'fanout'], ['fanout', 'graph'], ['fanout', 'timeline'], ['feed', 'timeline'], ['feed', 'postdb'], ['feed', 'graph'], ['feed', 'ranker']],

  components: {
    userA: {
      name: 'Poster (A)',
      what: 'An ordinary account with a few followers. Uploads the photo first (presigned URL to object storage), then sends `POST /posts { caption, mediaIds }`.',
      why: 'Normal accounts are the cheap case for fan-out on write: a handful of timeline writes per post.',
      without: '—',
      tech: 'Mobile app', scale: '~100 M posts/day across all users.', fails: 'Retries `POST /posts` with an idempotency key so a flaky network does not create two posts.',
    },
    userB: {
      name: 'Reader (B)',
      what: 'Opens the home feed, scrolls with a **cursor**, pulls to refresh. Follows A, D, E and the celebrity C.',
      why: 'Reads dominate (≈ 100 reads per post), so the design optimises B\'s path.',
      without: '—',
      tech: 'Mobile app', scale: '500 M daily users, ~10 feed loads each.', fails: 'Reads are idempotent: a failed refresh is simply retried.',
    },
    userC: {
      name: 'Celebrity (C)',
      what: 'An account with **10 M followers**. One post from C would mean 10 M timeline writes with plain fan-out on write.',
      why: 'The reason the design is **hybrid**: celebrities are pulled at read time, not pushed.',
      without: '—',
      tech: 'Same app', scale: 'A few thousand accounts above the threshold (e.g. 100 k followers).', fails: '—',
    },
    gateway: {
      name: 'API gateway',
      what: 'Terminates TLS, validates the JWT, rate-limits per user, routes `/posts` to the Post Service and `/feed` to the Feed Service.',
      why: 'One place for auth and limits instead of every service doing it.',
      without: 'Each service re-implements auth; a buggy client can hammer `/feed`.',
      tech: 'Spring Cloud Gateway / Kong / AWS API Gateway', scale: 'Stateless; scale out behind a load balancer.', fails: 'Several instances; a dead one is taken out by health checks.',
      core: ['gw', 'API gateway'],
    },
    post: {
      name: 'Post Service',
      what: 'Inserts the post into the Post DB and writes a `PostCreated` **outbox** row in the same transaction; a relay publishes it to Kafka. Answers `201 { postId }` right away.',
      why: 'Posting stays fast no matter how many followers the author has.',
      without: 'Writing every follower\'s timeline inside the request: a celebrity post would take minutes.',
      tech: 'Spring Boot · MongoDB · KafkaTemplate', scale: 'Stateless.', fails: 'Outbox → a post is never stored without its event (or the event sent without the post).',
    },
    feed: {
      name: 'Feed Service',
      what: '`ZREVRANGE tl:B` for pushed ids, pulls `recent:{celeb}` for followed celebrities, merges, **hydrates** ids from the Post DB (drops deleted), asks Ranking to order, returns `nextCursor`.',
      why: 'All read-time logic in one stateless service.',
      without: 'Clients would assemble feeds from many calls.',
      tech: 'Spring Boot', scale: 'Stateless; ~60 k feed loads/s average.', fails: 'Ranking slow → chronological fallback; timeline missing → rebuild by pull.',
    },
    ranker: {
      name: 'Ranking',
      what: 'Scores a **candidate set** of a few hundred posts by recency, affinity (how often B interacts with the author) and engagement.',
      why: 'The timeline decides **which** posts are candidates; ranking only decides the **order**.',
      without: 'Pure chronological feed: fine, but less engaging.',
      tech: 'Feature store + model server', scale: 'Scores hundreds of posts per request, never millions.', fails: 'Strict timeout (~50 ms) → fall back to time order.',
    },
    postdb: {
      name: 'Post DB',
      what: '`posts { _id: "p-91", author, caption, media, createdAt, deleted }`, plus index `{ author, createdAt }` for "recent posts of these authors".',
      why: 'The single copy of content: edits and deletes happen here once.',
      without: 'Content copied into millions of timelines goes stale.',
      tech: 'MongoDB sharded by `_id`; hot posts cached; media on S3 + CDN', scale: 'Read by batch `$in` of ~20–50 ids per page.', fails: 'Slow → hydration is the bottleneck; cache hot posts, return fewer.',
      core: ['db', 'DB scaling'],
    },
    timeline: {
      name: 'Timeline cache (Redis)',
      what: '`tl:{user}` = sorted set of **post ids** scored by `createdAt`, capped at **800**. Also `recent:{celeb}` per celebrity for the pull side.',
      why: '`ZADD`, `ZREVRANGE`, `ZREVRANGEBYSCORE`, `ZREMRANGEBYRANK` are exactly the operations a feed needs, in memory.',
      without: 'Every feed load = "recent posts of 300 accounts" query, merged on the fly.',
      tech: 'Redis Cluster, sharded by user id', scale: 'Only **active** users keep one (TTL 30 days).', fails: 'Lost or expired → rebuild on read from followees.',
      core: ['cache', 'Cache · Redis'],
    },
    graph: {
      name: 'Follow graph',
      what: '`follows { follower, followee }` with indexes on both sides: followers of A (fan-out), following of B (rebuild, celebrities B follows).',
      why: 'Fan-out and pull both start with "who is connected to whom".',
      without: '—',
      tech: 'Sharded MongoDB / MySQL, or a graph store; follower counts cached', scale: 'Read in pages of 1 000 for big accounts.', fails: 'Stale list → a post lands in a just-unfollowed timeline; filter on read.',
    },
    kafka: {
      name: 'Kafka (post-created)',
      what: '`post-created` topic, key = author id. Fan-out workers consume it in a consumer group and **commit offsets after** writing the timelines.',
      why: 'Decouples posting from fan-out and absorbs spikes.',
      without: 'The Post Service blocks on thousands of Redis writes.',
      tech: 'Kafka', scale: 'Partitions × workers set fan-out throughput.', fails: 'Lag → followers see posts later, never lost. Redelivery is harmless (idempotent ZADD).',
      core: ['kafka', 'Queue · Kafka'],
    },
    fanout: {
      name: 'Fan-out workers',
      what: 'For each event: read the author\'s followers page by page, then pipeline `ZADD tl:{f} ts postId` + `ZREMRANGEBYRANK tl:{f} 0 -801`. Skip celebrities and inactive followers.',
      why: 'Moves the cost of building feeds from read time to write time.',
      without: 'Fan-out on read for everyone: every feed load merges hundreds of authors.',
      tech: 'Spring Kafka `@KafkaListener` + Redis pipelines', scale: 'Cost ∝ followers → the celebrity threshold caps it.', fails: 'Crash mid-way → re-consume from the last committed offset; ZADD of the same id is idempotent.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Store once, push ids to followers, read one sorted set.',
    points: [
      { t: 'Post', color: TEAL, d: 'The post is stored in the **Post DB**; `PostCreated` goes to **Kafka**; A gets 201 at once.' },
      { t: 'Fan-out', color: PURPLE, d: 'A worker reads A\'s **followers** and `ZADD`s the post **id** into each follower\'s timeline.' },
      { t: 'Read', color: BLUE, d: 'B\'s feed = one `ZREVRANGE`, a batch **hydrate** from the Post DB, **rank**, return a **cursor**.' },
      { t: 'Celebrities', color: AMBER, d: 'No fan-out for 10 M followers: B\'s read **pulls** `recent:C` and merges it.' },
    ],
    stats: [['500 M', 'daily users'], ['100 M', 'posts / day'], ['800', 'ids per timeline'], ['< 200 ms', 'feed load p99']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await clearRows(s, v);
    for (const [k, t, st] of TL0) { await s.row(v.tl, t, ST[st]); v.rows[k] = v.tl.rows[v.tl.rows.length - 1]; }
    chip(s, v.pdb, 'posts · p-90 p-88 p-85'); chip(s, v.kaf, 'post-created · @499'); chip(s, v.fo, 'fan-out idle');
    chip(s, v.gr, 'A: 3 · C: 10 M followers'); chip(s, v.tlc, 'tl:B · newest 800 ids');
    who(s, v, 'A', 'has a new photo'); who(s, v, 'B', 'will open the feed'); who(s, v, 'C', '10 M followers');

    ui.say(0); ui.cap('**Post** · A posts a photo: stored once in the Post DB, PostCreated goes to Kafka');
    await s.send(['userA', 'gateway', 'post'], 'POST /posts', BLUE, { ms: 400 });
    await s.send(['post', 'postdb'], 'insert p-91', TEAL, { ms: 400 });
    chip(s, v.pdb, 'posts · p-91 (new) p-90 …');
    await s.send(['post', 'gateway', 'userA'], '201 p-91', GREEN, { ms: 360 });
    who(s, v, 'A', 'posted ✓', GREEN);
    await s.send(['post', 'kafka'], 'PostCreated p-91', PURPLE, { ms: 420 });
    chip(s, v.kaf, 'post-created · @500 p-91');
    ui.say(1); ui.cap('**Fan-out** · a worker reads A\'s followers and ZADDs p-91 into each timeline');
    await s.send(['kafka', 'fanout'], 'p-91 by A', PURPLE, { ms: 400 });
    await s.send(['fanout', 'graph'], 'followers of A', TEAL, { ms: 400 });
    chip(s, v.gr, 'A → B, D, E');
    await s.send(['fanout', 'timeline'], 'ZADD ×3', RED, { ms: 420 });
    chip(s, v.fo, 'ZADD tl:B tl:D tl:E ✓');
    await onTop(s, v, 'p-91', P('p-91', 'A', '20:00', 'new'), 'NEW');
    ui.say(2); ui.cap('**Read** · B opens the feed: one ZREVRANGE, hydrate the ids, rank, return a cursor');
    await s.send(['userB', 'gateway', 'feed'], 'GET /feed', BLUE, { ms: 380 });
    await s.send(['feed', 'timeline'], 'ZREVRANGE 0 19', RED, { ms: 380 });
    await s.send(['feed', 'postdb'], '$in [20 ids]', TEAL, { ms: 380 });
    await s.send(['feed', 'ranker'], 'rank 20', AMBER, { ms: 360 });
    await s.send(['feed', 'gateway', 'userB'], '200 + cursor', GREEN, { ms: 360 });
    await put(s, v, 'p-91', P('p-91', 'A', '20:00', 'shown'), 'OK');
    who(s, v, 'B', 'sees A\'s sunset ✓', GREEN);
    ui.say(3); ui.cap('**Celebrities** · C has 10 M followers: no fan-out; B\'s read pulls recent:C and merges');
    tick(s, v, '20:01:00');
    await s.send(['userC', 'gateway', 'post'], 'POST /posts', BLUE, { ms: 360 });
    await s.send(['post', 'kafka', 'fanout'], 'p-92 by C', PURPLE, { ms: 360 });
    await s.flash(960, 240, '10 M > 100 k → skip', { color: AMBER, stroke: AMBER }, 700);
    await s.send(['fanout', 'timeline'], 'ZADD recent:C', PURPLE, { ms: 380 });
    chip(s, v.tlc, 'recent:C · p-92');
    await s.send(['userB', 'gateway', 'feed'], 'refresh', BLUE, { ms: 360 });
    await s.send(['feed', 'timeline'], 'tl:B + recent:C', RED, { ms: 380 });
    await onTop(s, v, 'p-92', P('p-92', 'C', '20:01', 'pulled'), 'PULL');
    await s.send(['feed', 'gateway', 'userB'], '200 [p-92, p-91…]', GREEN, { ms: 360 });
    who(s, v, 'B', 'sees C\'s post ✓', GREEN);
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'post', title: 'A posts → B\'s feed', sub: 'fan-out on write · one ZREVRANGE', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'Fan-out on write moves the work to posting time: one **ZADD per follower**, done asynchronously from Kafka. Reading becomes one **ZREVRANGE** of ids, one batch **hydrate**, a quick **rank** and a **cursor** for the next page.',
      steps: [
        {
          title: 'A posts a photo',
          text: 'The app first uploads the image to object storage with a **presigned URL** (served later by the CDN), then sends `POST /posts { caption: "Sunset", mediaIds: ["m-55"] }`. The gateway checks the JWT and the rate limit.',
          observe: 'The request reaches the Post Service.',
          focus: v => [v.n.post],
          async run(s, v) {
            who(s, v, 'A', 'posting…', AMBER);
            await s.send(['userA', 'gateway', 'post'], 'POST /posts', BLUE);
          },
        },
        {
          title: 'Store the post and its event together',
          text: '`posts.insertOne({ _id: "p-91", author: "A", caption: "Sunset", media: ["m-55"], createdAt: 20:00:00 })` and an **outbox** row `PostCreated(p-91)` in the **same transaction**, so the post never exists without its event.',
          observe: 'p-91 is in the Post DB.',
          say: 'The post is stored once, in the Post DB, together with an outbox event.',
          focus: v => [v.pdb],
          async run(s, v) {
            await s.send(['post', 'postdb'], 'insert p-91 + outbox', TEAL);
            chip(s, v.pdb, 'posts · p-91 (new) p-90 …', TEAL); await s.pulse(v.pdb);
          },
        },
        {
          title: '201 to A, PostCreated to Kafka',
          text: 'A gets `201 { postId: "p-91" }` immediately: posting does **not** wait for any follower. The outbox relay publishes `{ postId: "p-91", author: "A", createdAt }` to `post-created`, key = author id.',
          observe: 'A sees "posted"; the event is at offset 500.',
          focus: v => [v.kaf, v.n.userA],
          async run(s, v) {
            await s.send(['post', 'gateway', 'userA'], '201 p-91', GREEN);
            who(s, v, 'A', 'posted ✓', GREEN);
            await s.send(['post', 'kafka'], 'PostCreated p-91', PURPLE);
            chip(s, v.kaf, 'post-created · @500 p-91'); await s.pulse(v.kaf);
          },
        },
        {
          title: 'A fan-out worker reads A\'s followers',
          text: 'A worker in consumer group `fanout` polls offset 500, then pages through `follows.find({ followee: "A" })` → **B, D, E**. For big accounts this is read in pages of 1 000.',
          observe: 'Three followers.',
          focus: v => [v.n.fanout, v.gr],
          async run(s, v) {
            await s.send(['kafka', 'fanout'], 'p-91 by A', PURPLE);
            await s.send(['fanout', 'graph'], 'followers of A', TEAL);
            chip(s, v.gr, 'A → B, D, E (3)', TEAL); await s.pulse(v.gr);
          },
        },
        {
          title: 'ZADD the id into each timeline, keep 800',
          text: 'One Redis pipeline: `ZADD tl:B 1761249600 "p-91"` (score = createdAt) and `ZREMRANGEBYRANK tl:B 0 -801` for B, D and E. Only the **id** goes in, never the caption or image. Posting cost = number of followers.',
          observe: 'p-91 is on top of tl:B.',
          say: 'Fan-out on write puts the post id into every follower\'s sorted-set timeline, capped at 800.',
          focus: v => [v.tl, v.fo],
          async run(s, v) {
            await s.send(['fanout', 'timeline'], 'ZADD ×3 + trim', RED);
            chip(s, v.fo, 'ZADD tl:B tl:D tl:E ✓', PURPLE);
            await onTop(s, v, 'p-91', P('p-91', 'A', '20:00', 'new'), 'NEW');
          },
        },
        {
          title: 'B opens the feed: one ZREVRANGE',
          text: '`GET /feed?limit=20` → `ZREVRANGE tl:B 0 19 WITHSCORES`: the 20 newest ids, already sorted, from memory. No query across the 300 accounts B follows.',
          observe: 'The Feed Service has 20 ids.',
          focus: v => [v.tl, v.n.feed],

      "So reading the feed is cheap: one `ZREVRANGE` on B's timeline gives the newest ids, then I **hydrate** them with a single `$in` query on the Post DB, which also filters deleted posts, because timelines hold ids and not copies. A ranking service reorders that small candidate set, and the response carries a **cursor**, the score of the last item, so the next page asks for strictly older posts and new posts at the top never cause duplicates.",

      { t: 'Post Service: store + outbox, relay with KafkaTemplate', code: `@Transactional
public Post create(String author, CreatePost req) {
  Post p = mongo.insert(new Post(ids.next(), author, req.caption(), req.mediaIds(), Instant.now(), false));
  outbox.insert(new OutboxEvent("post-created", author,
      new PostCreated(p.id(), author, p.createdAt())));      // same transaction as the post
  return p;                                                   // 201 { postId } — no fan-out here
}

@Scheduled(fixedDelay = 200)                                  // or Debezium on the outbox collection
void relay() {
  for (OutboxEvent e : outbox.pending(500))
    kafka.send("post-created", e.key(), e.payload())          // key = authorId
         .thenRun(() -> outbox.markSent(e.id()));
}` },
      { t: 'Fan-out worker: @KafkaListener, ZADD + trim, celebrity skip', code: `@KafkaListener(topics = "post-created", groupId = "fanout")   // enable.auto.commit=false, AckMode.MANUAL
public void onPost(PostCreated e, Acknowledgment ack) {
  double score = e.createdAt().toEpochMilli();             // from the event → replays give the same score
  if (graph.followerCount(e.author()) > CELEBRITY_THRESHOLD) {  // e.g. 100 000
    redis.opsForZSet().add("recent:" + e.author(), e.postId(), score);   // pulled at read time
    ack.acknowledge();
    return;
  }
  for (List<String> page : graph.followerPages(e.author(), 1000)) {
    redis.executePipelined((RedisCallback<Object>) c -> {
      for (String f : page) {
        if (!activeUsers.contains(f)) continue;            // inactive: rebuilt on their next visit
        byte[] key = ("tl:" + f).getBytes(UTF_8);
        c.zSetCommands().zAdd(key, score, e.postId().getBytes(UTF_8));   // idempotent
        c.zSetCommands().zRemRange(key, 0, -801);          // keep the newest 800
      }
      return null;
    });
  }
  ack.acknowledge();                                       // commit only after every timeline is written
}` },
      { t: 'Feed read: merge celebrities, hydrate, rank, cursor', code: `public FeedPage feed(String user, Cursor cursor, int limit) {
  double max = cursor == null ? Double.POSITIVE_INFINITY : cursor.score();
  ZSetOperations<String, String> z = redis.opsForZSet();

  Set<TypedTuple<String>> ids = z.reverseRangeByScoreWithScores("tl:" + user, NEG_INF, max, 0, limit * 2);
  if (cursor == null && (ids == null || ids.isEmpty())) ids = rebuild(user);          // cache miss
  for (String celeb : graph.celebritiesFollowedBy(user))                             // pull side
    ids.addAll(z.reverseRangeByScoreWithScores("recent:" + celeb, NEG_INF, max, 0, 10));

  List<TypedTuple<String>> page = ids.stream()
      .filter(t -> cursor == null || cursor.isAfter(t.getScore(), t.getValue()))    // strictly older (score, id)
      .sorted(BY_SCORE_DESC_THEN_ID).limit(limit).toList();

  Map<String, Post> posts = mongo.find(query(where("_id").in(idsOf(page)).and("deleted").ne(true)), Post.class)
      .stream().collect(toMap(Post::id, p -> p));                                   // one batch hydrate
  List<Post> visible = page.stream().map(t -> posts.get(t.getValue())).filter(Objects::nonNull).toList();

  List<Post> ranked = ranking.rank(user, visible, Duration.ofMillis(50));          // timeout → time order
  TypedTuple<String> last = page.isEmpty() ? null : page.get(page.size() - 1);
  return new FeedPage(ranked, last == null ? null : Cursor.of(last.getScore(), last.getValue()));
}` },
      { t: 'Rebuild on a timeline miss', code: `Set<TypedTuple<String>> rebuild(String user) {
  String tl = "tl:" + user;
  Boolean mine = redis.opsForValue().setIfAbsent("rebuild:" + user, "1", Duration.ofSeconds(10));
  if (!Boolean.TRUE.equals(mine)) return pullOnly(user);   // another request is already rebuilding

  List<String> following = graph.following(user);          // ~300 accounts
  List<Post> recent = mongo.find(query(where("author").in(following)
          .and("deleted").ne(true)
          .and("createdAt").gt(Instant.now().minus(7, ChronoUnit.DAYS)))
      .with(Sort.by(Sort.Direction.DESC, "createdAt")).limit(800), Post.class);

  Set<TypedTuple<String>> tuples = recent.stream()
      .map(p -> TypedTuple.of(p.id(), (double) p.createdAt().toEpochMilli()))
      .collect(toCollection(LinkedHashSet::new));
  if (!tuples.isEmpty()) redis.opsForZSet().add(tl, tuples);
  redis.expire(tl, Duration.ofDays(30));                    // refreshed on every read
  activeUsers.add(user);                                    // fan-out writes to this timeline again
  return tuples;
}` },
