<script>
// File Upload & Storage (Google Drive attachments / Dropbox style). Everything specific to this design lives here;
// engine/app.js renders it.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';

// File record status colours (the metadata DB is the truth about what may be downloaded).
const ST = {
  PENDING: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  READY: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  INFECTED: { fill: '#fff4f4', stroke: RED, color: RED },
  EXPIRED: { fill: '#f0f1f2', stroke: '#c3c9ce', color: GREY },
};
const fmt = (id, name, status) => `${id} ${name.padEnd(10)} ${status}`;

// State shown next to the components: the signed URL the API holds, the files collection, the S3 objects, the queue.
function setup(s, v, { files = [], objects = [], queue = 0, sign = 'no URL issued' } = {}) {
  v.sign = s.chip(445, 62, sign, { mono: true, color: GREY });
  v.files = s.store(605, 170, 170, 'FILES · metadata', { color: AMBER });
  v.objs = s.store(605, 428, 170, 'S3 · uploads/', { color: AMBER });
  v.queue = s.chip(995, 428, `queue depth ${queue}`, { mono: true, color: PURPLE });
  v.q = queue;
  v.rows = {};
  // With now: true the row is drawn immediately (s.row still returns a promise), so read it back from the store.
  files.forEach(([id, name, status], k) => {
    s.row(v.files, fmt(id, name, status), { ...ST[status], now: true });
    v.rows[id] = v.files.rows[k];
    v.rows[id].meta = [id, name, status];
  });
  for (const o of objects) s.row(v.objs, o, { now: true });
  return v;
}
async function addFile(s, v, id, name, status) {
  v.rows[id] = await s.row(v.files, fmt(id, name, status), ST[status]);
  v.rows[id].meta = [id, name, status];
}
async function setStatus(s, v, id, status) {
  const r = v.rows[id], [, name] = r.meta;
  r.meta = [id, name, status];
  r.label.textContent = fmt(id, name, status);
  s.paintRow(r, ST[status]);
  await s.pulse(r, 1, 1.05);
}
function setQueue(s, v, n) { v.q = n; s.setChip(v.queue, `queue depth ${n}`); }
const objRow = (v, prefix) => v.objs.rows.find(r => r.label.textContent.startsWith(prefix));

window.DESIGN = {
  id: 'files', n: 6, title: 'File Upload & Storage', tagline: 'Drive / Dropbox style: direct-to-S3 uploads, scan before serve',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Clients & edge', x0: 0, x1: 340, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Where uploads start. The client talks to us only for **small JSON calls** (permission, URLs, status); the gateway authenticates and rate-limits them.',
      detail: 'The client is also the one moving the bytes, straight to S3. That is the whole trick of this design: the edge never carries file content.' },
    { id: 'app', title: 'Control plane', x0: 340, x1: 552, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'Decides **who may upload or download what**, records it, and signs short-lived URLs. It never touches file bytes.',
      detail: 'Because the API only signs and records, a couple of small stateless pods handle millions of uploads a day.' },
    { id: 'data', title: 'Storage', x0: 552, x1: 828, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: 'Two stores with different jobs: **S3 holds the bytes** (cheap, durable, huge), the **metadata DB holds the truth** about each file (owner, status, sharing).',
      detail: 'Neither replaces the other: S3 cannot answer "is this file clean and may B read it?", and a database is a terrible place for gigabytes of blobs.' },
    { id: 'async', title: 'Async processing', x0: 828, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'Work that happens **after** the upload, driven by S3 events: virus scanning, and housekeeping for uploads that never finished.',
      detail: 'Events come from S3 itself, not from the client, so a crashed or lying client cannot skip the scan.' },
  ],
  layersIntro: {
    title: 'Control path and data path are separate',
    text: 'Small JSON requests go **Client → Gateway → Upload API → Metadata DB**. File bytes go **Client → S3** directly. S3 then drives the **async** side (events → scanner), which flips the file record to READY. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    client: { x: 80, y: 245, w: 140, label: 'Client', sub: 'browser / app', icon: '👤', layer: 'entry' },
    gateway: { x: 245, y: 110, w: 150, label: 'API Gateway', sub: 'auth · rate limits', icon: '🛡️', layer: 'entry' },
    api: { x: 445, y: 110, label: 'Upload API', sub: 'presign · metadata', icon: '✍️', layer: 'app' },
    meta: { x: 690, y: 110, label: 'Metadata DB', sub: 'files · status', icon: '🍃', layer: 'data' },
    s3: { x: 690, y: 375, label: 'S3 bucket', sub: 'private · versioned', icon: '🪣', layer: 'data' },
    events: { x: 995, y: 375, w: 160, label: 'S3 events', sub: 'SQS queue', icon: '📨', layer: 'async' },
    scanner: { x: 995, y: 250, w: 160, label: 'Virus scanner', sub: 'scan workers', icon: '🔬', layer: 'async' },
    cleanup: { x: 995, y: 110, w: 160, label: 'Cleanup job', sub: 'stale PENDING', icon: '🧹', layer: 'async' },
  },
  wires: [['client', 'gateway'], ['gateway', 'api'], ['api', 'meta'], ['api', 's3'], ['client', 's3'], ['s3', 'events'], ['events', 'scanner'], ['scanner', 's3'], ['scanner', 'meta'], ['cleanup', 'meta']],

  components: {
    client: {
      what: 'Browser or mobile app. Asks the API for permission and a URL, then sends the **bytes straight to S3**, with progress and retries.',
      why: 'It is the only party that has the file, so letting it upload directly removes our servers from the byte path entirely.',
      without: 'Not optional, but the alternative design (client → our API → S3) makes every byte cross our servers: bandwidth, memory and timeouts become our problem.',
      tech: '`fetch` / XHR with progress events; multipart upload for big files', scale: 'Each client brings its own bandwidth.', fails: 'Network drops are normal: retry only the failed part and resume with the stored `uploadId`.',
    },
    gateway: {
      name: 'API Gateway',
      what: 'Entry point for the **small JSON calls**: authenticate (JWT), rate-limit per user, route to the Upload API.',
      why: 'Auth and abuse protection in one place, before any URL is signed. Uploads cost storage money, so limits matter.',
      without: 'Every service re-implements auth; nothing stops one user from requesting millions of upload URLs.',
      tech: 'Spring Cloud Gateway / AWS ALB / API Gateway', scale: 'Light: no file bytes pass through it.', fails: 'Redundant instances behind DNS / LB; health checks drop bad ones.',
    },
    api: {
      name: 'Upload API (control plane)',
      what: 'Checks type, size and quota, inserts a **PENDING** record, and **signs** a presigned URL for exactly one key, method and content type. Also authorises downloads.',
      why: 'It is the place that decides **who may write which key** and **who may read which file**. The URL it signs is the permission slip.',
      without: 'Clients would need AWS credentials, or the bucket would be writable by anyone. Neither is acceptable.',
      tech: 'Spring Boot + AWS SDK v2 `S3Presigner` (signing is local SigV4, no call to S3)', scale: 'Stateless pods; ~25 uploads/s is tiny.', fails: 'A crash after signing is harmless: the PENDING record is expired later by the cleanup job.',
    },
    meta: {
      name: 'Metadata DB (source of truth)',
      what: 'One document per file: `{ _id, owner, name, key, size, contentType, status, etag, versionId, sharedWith }`. Status: PENDING → READY / INFECTED / EXPIRED.',
      why: 'S3 knows bytes, not business rules. Downloads are decided by the **record** (READY + shared with you), not by whether an object exists.',
      without: 'You would serve whatever is in the bucket, including unscanned or infected files, and could not list or share files efficiently.',
      tech: 'MongoDB (or PostgreSQL); index `{ owner: 1, createdAt: -1 }` and `{ status: 1, createdAt: 1 }`', scale: '~1 KB per file, ~2 GB/day: easy. Shard by owner if needed.', fails: 'Down → no new upload URLs (503); uploads already in flight still land in S3 and the scanner retries its update later.',
    },
    s3: {
      name: 'S3 bucket (bytes)',
      what: 'Private bucket (Block Public Access on), versioning on, SSE-KMS encryption. Keys are **generated by us** (`uploads/{owner}/{fileId}.ext`), never user file names.',
      why: 'Cheap, practically unlimited, 11-nines-durable storage that accepts uploads directly from clients using signed URLs.',
      without: 'Blobs in the database: huge backups, slow replication, and app servers proxying every byte.',
      tech: 'Amazon S3 (or GCS / Azure Blob); multipart up to 5 TiB per object; lifecycle rules for tiers and cleanup', scale: 'Practically unlimited; spread keys across prefixes for very high request rates.', fails: 'Very rare; event notifications are at-least-once and can arrive late or out of order.',
    },
    events: {
      name: 'S3 events → SQS',
      what: 'S3 publishes an **ObjectCreated** event for every new object into a queue the scanner reads.',
      why: 'S3 knows when an object **really** exists. Driving the scan from S3 means a client that crashes, or lies, cannot skip it.',
      without: 'You depend on the client calling "upload finished"; some never will, and a malicious one could claim a file is done before it is.',
      tech: 'S3 Event Notifications → SQS (or EventBridge), with a DLQ', scale: 'Buffers bursts; scanners scale on queue depth.', fails: 'Duplicates happen (at-least-once) → idempotent handler; poison messages go to the DLQ after N receives.',
    },
    scanner: {
      name: 'Virus scanner',
      what: 'Takes an event, checks the real size/type with **HeadObject**, streams the object through the scanner, then conditionally sets the record to READY or INFECTED (and moves infected files to `quarantine/`).',
      why: 'User uploads are untrusted. Scan-before-serve stops one user from distributing malware to everyone they share with.',
      without: 'Infected files are served to other users straight from your domain.',
      tech: 'ClamAV workers or a vendor scanning API', scale: 'Scale workers on queue depth; big files need a longer visibility timeout.', fails: 'Crash mid-scan → the message reappears after the visibility timeout and another worker scans again.',
    },
    cleanup: {
      name: 'Cleanup job',
      what: 'Expires **PENDING** records nobody finished uploading. An S3 lifecycle rule (`AbortIncompleteMultipartUpload`) removes orphan multipart parts.',
      why: 'Abandoned uploads are normal (tab closed, app killed). Without housekeeping, records and billed parts pile up forever.',
      without: 'Ghost "uploading…" files in users\' lists and a growing storage bill for invisible multipart parts.',
      tech: 'Scheduled job (hourly) + S3 lifecycle rule', scale: 'One indexed query per run.', fails: 'If it stops, nothing breaks; only storage cost and clutter grow.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Ask for a URL, upload to S3, scan, then share.',
    points: [
      { t: 'Ask & sign', color: BLUE, d: 'Client sends only metadata. The API records **PENDING** and signs a URL for one key, valid 15 min.' },
      { t: 'Upload direct', color: BLUE, d: 'Client PUTs the bytes **straight to S3**. Our servers never see them.' },
      { t: 'Scan', color: TEAL, d: 'S3 emits **ObjectCreated** → queue → scanner, which flips the record to **READY** (or INFECTED).' },
      { t: 'Download', color: PURPLE, d: 'API checks READY + sharing, then **302** to a 5-minute presigned GET.' },
    ],
    stats: [['2 M', 'uploads / day'], ['≤ 5 GB', 'per file'], ['~4 TB', 'new data / day'], ['0 bytes', 'through our servers']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    for (const r of [...v.files.rows]) await s.unrow(v.files, r);
    for (const r of [...v.objs.rows]) await s.unrow(v.objs, r);
    s.setChip(v.sign, 'no URL issued', { color: GREY });
    setQueue(s, v, 0);

    ui.say(0); ui.cap('**Ask** · the client sends only metadata: `POST /files { name, size, type }`');
    await s.send(['client', 'gateway', 'api'], 'POST /files', BLUE, { ms: 460 });
    ui.cap('The API records the file as **PENDING** and signs a URL for one key, valid 15 minutes');
    await s.send(['api', 'meta'], 'insert PENDING', BLUE, { ms: 440 });
    await addFile(s, v, 'f-1', 'report.pdf', 'PENDING');
    s.setChip(v.sign, 'PUT A/f-1.pdf · 15 min', { color: BLUE }); await s.pulse(v.sign);
    await s.send(['api', 'gateway', 'client'], '201 uploadUrl', GREEN, { ms: 440 });

    ui.say(1); ui.cap('**Upload** · the bytes go **straight to S3**, gateway and API are skipped');
    await s.send(['client', 's3'], 'PUT 2 MB', BLUE, { ms: 900 });
    await s.row(v.objs, 'A/f-1.pdf    2 MB');

    ui.say(2); ui.cap('**Scan** · S3 emits **ObjectCreated**; a scanner checks and scans the object');
    await s.send(['s3', 'events'], 'ObjectCreated', TEAL, { ms: 440 });
    setQueue(s, v, 1);
    await s.send(['events', 'scanner'], 'f-1', TEAL, { ms: 400 });
    setQueue(s, v, 0);
    await s.send(['scanner', 's3'], 'GET stream', TEAL, { ms: 440 });
    await s.flash(995, 205, 'clean ✓', { color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, 350);
    ui.cap('Conditional update: **PENDING → READY**, so a duplicate event changes nothing');
    await s.send(['scanner', 'meta'], 'PENDING → READY', TEAL, { ms: 460 });
    await setStatus(s, v, 'f-1', 'READY');

    ui.say(3); ui.cap('**Download** · B asks the API; it checks READY + sharing and redirects to a 5-minute GET');
    await s.send(['client', 'gateway', 'api'], 'B: download', PURPLE, { ms: 440 });
    await s.send(['api', 'meta'], 'READY? shared?', PURPLE, { ms: 400 });
    await s.send(['api', 'gateway', 'client'], '302 GET · 5 min', PURPLE, { ms: 440 });
    await s.send(['client', 's3'], 'GET', PURPLE, { ms: 600 });
    await s.send(['s3', 'client'], '2 MB', PURPLE, { ms: 800 });
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'happy', title: 'Upload, scan, download', sub: 'presigned PUT · direct to S3', color: BLUE,
      build: (s, v) => setup(s, v),
      takeaway: 'Bytes go **client → S3**; our servers only **sign, record and decide**. Files become downloadable only after the scanner flips them to **READY**.',
      steps: [
        {
          title: 'A asks for an upload URL',
          text: 'User A picks `report.pdf` (2 MB). The client sends only **metadata**: `POST /files { name, size, contentType }`. No file bytes go to our servers, ever.',
          observe: 'A small JSON request reaches the Upload API through the gateway.',
          say: 'The client first asks our API for permission and a URL; the bytes never go through us.',
          focus: v => [v.n.api],
          async run(s) { await s.send(['client', 'gateway', 'api'], 'POST /files', BLUE); },
        },
        {
          title: 'Validate, record PENDING, sign locally',
          text: 'The API checks type, size and quota, inserts `f-1` as **PENDING**, and signs a presigned PUT for **one key** (`uploads/A/f-1.pdf`), **one method**, **one content type**, valid **15 minutes**. Signing is local SigV4 with our credentials: no call to S3.',
          observe: 'A PENDING row appears and the API holds a signed URL; nothing goes to S3.',
          say: 'The API writes a PENDING record and signs a URL scoped to one key for 15 minutes.',
          focus: v => [v.files, v.sign],
          async run(s, v) {
            await s.send(['api', 'meta'], 'insert PENDING', BLUE);
            await addFile(s, v, 'f-1', 'report.pdf', 'PENDING');
            s.setChip(v.sign, 'PUT A/f-1.pdf · 15 min', { color: BLUE, stroke: BLUE }); await s.pulse(v.sign);
            await s.flash(445, 190, 'signed locally · no S3 call', { color: TEAL, stroke: TEAL }, 600);
          },
        },
        {
          title: 'Return the upload URL',
          text: 'The API answers **201** with `{ fileId: "f-1", uploadUrl }`. The URL is a bearer token, so it is short-lived and scoped to exactly what A asked for.',
          observe: 'The signed URL travels back to the client.',
          focus: v => [v.n.client],
          async run(s) { await s.send(['api', 'gateway', 'client'], '201 uploadUrl', GREEN); },
        },
        {
          title: 'Upload straight to S3',
          text: 'The client PUTs the 2 MB **directly to S3** with the signed URL. S3 checks the signature, key, content type and expiry, stores the object and returns an **ETag**. Gateway and API carry none of these bytes, so upload bandwidth never limits our servers.',
          observe: 'The big packet goes from the client straight to S3, skipping gateway and API.',
          say: 'Bytes go client to S3 directly, so our servers do not scale with upload bandwidth.',
          focus: v => [v.n.s3, v.objs],
          async run(s, v) {
            await s.send(['client', 's3'], 'PUT 2 MB', BLUE, { ms: 1100 });
            await s.row(v.objs, 'A/f-1.pdf    2 MB');
            await s.flash(80, 195, 'ETag "9b2c…"', { mono: true, color: BLUE, stroke: BLUE }, 600);
          },
        },
        {
          title: 'S3 announces the new object',
          text: 'S3 publishes an **ObjectCreated** event to an SQS queue. We do not trust the client to say "upload finished": S3 knows when the object really exists. Delivery is **at-least-once**, so every handler must be idempotent.',
          observe: 'An event lands in the queue.',
          focus: v => [v.n.events, v.queue],
          async run(s, v) {
            await s.send(['s3', 'events'], 'ObjectCreated', TEAL);
            setQueue(s, v, 1); await s.pulse(v.queue);
          },
        },
        {
          title: 'The scanner checks and scans',
          text: 'A scanner worker takes the message, calls **HeadObject** to compare the real size and type with the record, then streams the object through the virus scanner (ClamAV or a vendor API).',
          observe: 'The scanner reads the object from S3 and finds it clean.',
          say: 'S3 events drive a scanner, so a file is checked before anyone can download it.',
          focus: v => [v.n.scanner],
          async run(s, v) {
            await s.send(['events', 'scanner'], 'f-1 event', TEAL);
            setQueue(s, v, 0);
            await s.send(['scanner', 's3'], 'HEAD + GET', TEAL);
            await s.send(['s3', 'scanner'], 'stream', TEAL);
            await s.flash(995, 205, 'size ✓ · clean ✓', { color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, 600);
          },
        },
        {
          title: 'Mark READY, only if still PENDING',
          text: '`updateOne({ _id: "f-1", status: "PENDING", etag }, { $set: { status: "READY" } })`. The condition makes the update **idempotent**: a duplicate event or a retry matches nothing and changes nothing.',
          observe: 'The f-1 row turns green: READY.',
          say: 'The scanner updates conditionally from PENDING, so duplicate events are harmless.',
          focus: v => [v.rows['f-1']],
          async run(s, v) {
            await s.send(['scanner', 'meta'], 'PENDING → READY', TEAL);
            await setStatus(s, v, 'f-1', 'READY');
          },
        },
        {
          title: 'B asks to download',
          text: 'User B, whom A shared the file with, asks for it. The API checks the **record**, not just the object: status must be **READY** and B must be the owner or in `sharedWith`.',
          observe: 'The API looks up f-1 before handing out anything.',
          focus: v => [v.n.api, v.rows['f-1']],
          async run(s) {
            await s.send(['client', 'gateway', 'api'], 'B: GET /download', PURPLE);
            await s.send(['api', 'meta'], 'READY? shared?', PURPLE);
            await s.flash(690, 158, '✓ READY · shared with B', { color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, 500);
          },
        },
        {
          title: 'A short-lived GET straight from S3',
          text: 'The API answers **302** to a presigned GET valid **5 minutes**, with `Content-Disposition: attachment`. B downloads straight from S3 (or from a CDN with signed URLs for popular files).',
          observe: 'The download also bypasses our servers.',
          say: 'Downloads are authorised by the API and served by S3 through a five-minute URL.',
          focus: v => [v.n.client, v.n.s3],
          async run(s) {
            await s.send(['api', 'gateway', 'client'], '302 GET · 5 min', PURPLE);
            await s.send(['client', 's3'], 'GET', PURPLE, { ms: 700 });
            await s.send(['s3', 'client'], '2 MB', PURPLE, { ms: 1000 });
          },
        },
      ],
    },
    {
      id: 'multipart', title: 'Large file: multipart', sub: '10 MB parts · retry one part', color: TEAL,
      build: (s, v) => setup(s, v, { files: [['f-1', 'report.pdf', 'READY']], objects: ['A/f-1.pdf    2 MB'] }),
      takeaway: 'Multipart turns one fragile 1.2 GB transfer into **120 small ones**: parallel, individually retried, resumable with the stored `uploadId`, and assembled by S3.',
      steps: [
        {
          title: 'A starts a 1.2 GB upload',
          text: 'A picks `video.mp4` (1.2 GB) on a mobile connection. One PUT of 1.2 GB would restart from zero on every network drop, so above ~100 MB the client uses **multipart upload**.',
          observe: 'The request asks for a multipart upload.',
          focus: v => [v.n.api],
          async run(s) { await s.send(['client', 'gateway', 'api'], 'POST /files 1.2 GB', TEAL); },
        },
        {
          title: 'The API opens a multipart upload',
          text: 'The API records `f-2` as PENDING, calls **CreateMultipartUpload** to get an `uploadId`, and presigns one URL **per part** (10 MB each → 120 parts). Parts must be at least 5 MiB (except the last); up to 10,000 parts and 5 TiB per object.',
          observe: 'S3 returns an uploadId and the client receives 120 part URLs.',
          say: 'For large files the API opens a multipart upload and signs one URL per part.',
          focus: v => [v.sign, v.objs],
          async run(s, v) {
            await s.send(['api', 'meta'], 'insert PENDING', TEAL, { ms: 460 });
            await addFile(s, v, 'f-2', 'video.mp4', 'PENDING');
            await s.send(['api', 's3'], 'CreateMultipartUpload', TEAL);
            await s.send(['s3', 'api'], 'uploadId u-77', TEAL);
            await s.row(v.objs, 'A/f-2.mp4 parts 0/120', ST.PENDING);
            s.setChip(v.sign, 'u-77 · 120 part URLs', { color: TEAL, stroke: TEAL }); await s.pulse(v.sign);
            await s.send(['api', 'gateway', 'client'], '120 part URLs', GREEN);
          },
        },
        {
          title: 'Parts upload in parallel',
          text: 'The client uploads several parts at once, each with its own signed URL, and keeps the **ETag** S3 returns for every part. Parallel parts also use the bandwidth much better than one long stream.',
          observe: 'Parts stream into S3 and the counter climbs.',
          focus: v => [objRow(v, 'A/f-2')],
          async run(s, v) {
            const r = objRow(v, 'A/f-2');
            await Promise.all([1, 2, 3].map(k => s.wait((k - 1) * 220).then(() => s.send(['client', 's3'], `part ${k}`, TEAL, { ms: 650, pulse: false }))));
            r.label.textContent = 'A/f-2.mp4 parts 3/120';
            await s.clock.tween(900, t => { r.label.textContent = `A/f-2.mp4 parts ${Math.round(3 + t * 54)}/120`; });
            await s.flash(80, 195, 'ETags kept per part', { color: TEAL, stroke: TEAL }, 500);
          },
        },
        {
          title: 'One part fails',
          text: 'The train enters a tunnel and **part 58** fails halfway. Without multipart, A would lose everything uploaded so far.',
          observe: 'Part 58 bounces; the 57 parts already in S3 stay there.',
          focus: v => [v.n.client],
          async run(s) {
            await s.bounce('client', 's3', 'part 58', TEAL);
            await s.flash(80, 195, 'network drop', { color: RED, stroke: RED, fill: '#fff4f4' }, 600);
          },
        },

    { g: 'cc', q: 'S3 delivers the same ObjectCreated event twice. What happens?', what: 'The scanner may run twice for one upload.', why: 'S3 event notifications are at-least-once.', how: 'The status update is **conditional** on `status: "PENDING"` (and the ETag), so the second run matches nothing. Optionally skip early if the record is already final.', trade: 'Scanning twice still costs CPU.', flow: 'edge' },
