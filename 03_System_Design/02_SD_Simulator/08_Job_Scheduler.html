<script>
// Distributed job scheduler (cron at scale). Leases, atomic claims and fencing tokens are taught HERE.
// Leader election is only the alternative (follow-ups / decisions). DB basics live in 00_Core_Components.html.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', PURPLE = '#8f4fc4', AMBER = '#c47d1e', RED = '#ce3434', GREY = '#7b878f';
const KEEP = '#d5d9dc';

// Row colours: job documents, run-log entries and report documents.
const ST = {
  SCHED: { fill: '#f3f6fe', stroke: BLUE, color: BLUE },
  RUN: { fill: '#fdf6ea', stroke: AMBER, color: '#8a5a12' },
  OK: { fill: '#f1f9ee', stroke: GREEN, color: GREEN },
  LOG: { fill: '#f6f7fb', stroke: '#e3e6ee', color: '#203347' },
  BAD: { fill: '#fff4f4', stroke: RED, color: RED },
};
// SVG collapses normal spaces, so pad with non-breaking ones to keep the monospace columns aligned.
const pad = (str, n) => str.padEnd(n, ' ');
const J = (id, status, rest = '') => `${pad(id, 7)}${pad(status, 10)}${rest}`;   // job row
const R = (key, rest) => `${pad(key, 12)}${rest}`;                                // run-log / report row

// State shown next to the components: job docs + run log, lease, reports, inbox, workers, owner.
function setup(s, v, { jobs = [], reps = [], clock = '01:59:58', lease = 'lease —', a = 'owns job-7', w1 = 'idle · polling', w2 = 'idle · polling', inbox = 'B inbox: 0' } = {}) {
  v.clock = s.chip(15, 500, `🕒 ${clock}`, { anchor: 'start', mono: true, color: GREY });
  v.db = s.store(300, 322, 250, 'JOB DB · jobs + runs', { color: TEAL });
  v.rep = s.store(842, 378, 250, 'REPORT STORE · reports', { color: PURPLE });
  v.rows = {};
  jobs.forEach(([key, txt, st]) => { s.row(v.db, txt, { ...ST[st], now: true }); v.rows[key] = v.db.rows[v.db.rows.length - 1]; v.rows[key].st = v.db; });
  reps.forEach(([key, txt, st]) => { s.row(v.rep, txt, { ...ST[st], now: true }); v.rows[key] = v.rep.rows[v.rep.rows.length - 1]; v.rows[key].st = v.rep; });
  v.lease = s.chip(425, 292, lease, { mono: true, color: TEAL });
  v.inbox = s.chip(965, 302, inbox, { color: GREY });
  v.ua = s.chip(70, 156, a, { color: GREY });
  v.uw1 = s.chip(695, 158, w1, { color: GREY });
  v.uw2 = s.chip(695, 378, w2, { color: GREY });
  return v;
}
// Add or update a row in the Job DB (default) or the Report Store.
async function put(s, v, key, txt, st, store = v.db) {
  const r = v.rows[key];
  if (!r) { v.rows[key] = await s.row(store, txt, ST[st]); v.rows[key].st = store; return; }
  r.label.textContent = txt;
  s.paintRow(r, ST[st]);
  await s.pulse(r, 1, 1.05);
}
async function drop(s, v, key) { const r = v.rows[key]; if (r) { await s.unrow(r.st, r); delete v.rows[key]; } }
async function clearRows(s, v) { for (const st of [v.db, v.rep]) for (const r of [...st.rows]) await s.unrow(st, r); v.rows = {}; }
const paint = color => ({ color, stroke: color === GREY ? KEEP : color });
const tick = (s, v, t) => s.setChip(v.clock, `🕒 ${t}`);
const lease = (s, v, t, color = TEAL) => s.setChip(v.lease, t, { color });
const inbox = (s, v, t, color = GREY) => s.setChip(v.inbox, t, paint(color));
const who = (s, v, u, txt, color = GREY) => s.setChip(u === 'w1' ? v.uw1 : u === 'w2' ? v.uw2 : v.ua, txt, paint(color));
const ok = { mono: true, color: GREEN, stroke: GREEN, fill: '#f1f9ee' }, bad = { mono: true, color: RED, stroke: RED, fill: '#fff4f4' }, warn = { mono: true, color: AMBER, stroke: AMBER, fill: '#fdf6ea' };
const JOB7 = ['job-7', J('job-7', 'SCHEDULED', 'next 02:00 f0'), 'SCHED'];

window.DESIGN = {
  id: 'jobs', n: 8, title: 'Distributed Job Scheduler', tagline: 'jobs in a database, stateless workers claim them atomically with a lease and a fencing token',
  viewBox: [1100, 520],

  // ---------------- architecture ----------------
  layers: [
    { id: 'entry', title: 'Owners & API', x0: 0, x1: 290, color: '#4f7bd9', soft: '#f5f8fe', chip: '#e3ebfb', line: '#d5e0f6',
      why: 'Teams create, pause and trigger jobs through a small **Job API**: a cron expression, a **time zone**, a payload and a misfire policy.',
      detail: 'The API only writes job documents; it never runs anything.' },
    { id: 'data', title: 'Job DB', x0: 290, x1: 560, color: '#13968a', soft: '#f2faf9', chip: '#dcf1ee', line: '#c8e8e3',
      why: 'The **Job DB** is the single source of truth: `nextRunAt`, `status`, and the **lease** (`lockedBy`, `leaseUntil`, `fence`). Claims are **atomic updates** on one document.',
      detail: 'Index `{status, nextRunAt}` makes "what is due now?" a cheap range query.' },
    { id: 'app', title: 'Workers', x0: 560, x1: 830, color: '#c47d1e', soft: '#fefaf3', chip: '#f8e8cc', line: '#f1dfbf',
      why: '**Stateless workers** poll every second and claim one due job with `findOneAndUpdate`. No leader: any worker can take any job, and a dead worker\'s job comes back when its lease expires.',
      detail: 'Add workers to run more jobs in parallel.' },
    { id: 'async', title: 'Side effects', x0: 830, x1: 1100, color: '#8f4fc4', soft: '#faf6fd', chip: '#efe2f8', line: '#e6d5f3',
      why: 'What jobs actually do: write a **report**, send an **email**. Execution is **at-least-once**, so these must be **idempotent** and the store must reject **stale fences**.',
      detail: 'The Report Store (bottom right) keeps the last fence it accepted per document.' },
  ],
  layersIntro: {
    title: 'Jobs in the database, workers that claim them, idempotent side effects',
    text: 'A team creates a job through the **Job API**; it is stored with its **nextRunAt**. Stateless **workers** poll and **claim** a due job in one atomic update that sets a **lease** and bumps a **fencing token**. The worker runs it, writes results with its fence, and **completes** only if it still owns the lease, computing the next run from cron + time zone. Hover a layer or a component to see why it exists.',
  },
  nodes: {
    userA: { x: 70, y: 110, w: 120, label: 'Team A', sub: 'job owner', icon: '👤', layer: 'entry' },
    api: { x: 200, y: 240, w: 140, label: 'Job API', sub: 'create · pause', icon: '🗓️', layer: 'entry' },
    jobdb: { x: 425, y: 240, w: 160, label: 'Job DB', sub: 'Mongo · leases', icon: '🍃', layer: 'data' },
    w1: { x: 695, y: 110, w: 160, label: 'Worker 1', sub: 'polls every 1 s', icon: '⚙️', layer: 'app' },
    w2: { x: 695, y: 330, w: 160, label: 'Worker 2', sub: 'polls every 1 s', icon: '⚙️', layer: 'app' },
    reports: { x: 965, y: 110, w: 170, label: 'Report Store', sub: 'checks the fence', icon: '📦', layer: 'async' },
    email: { x: 965, y: 250, w: 170, label: 'Email (SES)', sub: 'external', icon: '✉️', layer: 'async', ext: true },
  },
  wires: [['userA', 'api'], ['api', 'jobdb'], ['w1', 'jobdb'], ['w2', 'jobdb'], ['w1', 'reports'], ['w2', 'reports'], ['w1', 'email'], ['w2', 'email']],

  components: {
    userA: {
      name: 'Job owner (Team A)',
      what: 'Registers "daily-report at 02:00 Asia/Kolkata" and gets alerts when a job ends up **FAILED**.',
      why: 'Jobs belong to teams; somebody has to hear about permanent failures.',
      without: '—',
      tech: 'Any service or an admin UI calling the Job API', scale: '—', fails: 'Gets an alert after max attempts.',
    },
    api: {

      what: '`POST /jobs { name, cron, tz, payload, misfire }` validates the cron, computes the first **nextRunAt** and inserts the job. Also pause, resume, trigger now, run history.',
      why: 'One place that validates cron expressions and time zones before they reach the workers.',
      without: 'Teams write job documents by hand, with broken crons and missing time zones.',
      tech: 'Spring Boot REST, `CronExpression.parse` for validation', scale: 'Low traffic: jobs change rarely.', fails: 'Stateless; if it is down, existing jobs keep running.',
    },
    jobdb: {
      name: 'Job DB',
      what: '`jobs { _id, cron, tz, status, nextRunAt, lockedBy, leaseUntil, fence, attempts, misfire }` and a run log `runs { _id: "job-7@02:00", emailSent }`.',
      why: 'Job state and the lease live in **one document**, so a single atomic update both finds a due job and takes it.',
      without: 'Separate lock service + job store → two systems to keep consistent.',
      tech: 'MongoDB replica set; indexes `{status, nextRunAt}`, `{status, leaseUntil}`; TTL index on old runs', scale: '~1 M jobs fit easily; shard by jobId and give worker groups their own shards beyond that.', fails: 'Primary failover pauses claims for seconds; leases are long enough to survive it.',
      core: ['db', 'DB scaling'],
    },
    w1: {
      name: 'Workers',
      what: 'Every second: claim one due job (`findOneAndUpdate`), run it, **heartbeat** the lease while it runs, then **complete** with a filter on `lockedBy` + `fence`.',
      why: 'No leader to elect or fail over: every worker is equal and the database arbitrates.',
      without: 'A single cron box: one machine dies and nothing runs.',
      tech: 'Spring Boot, `@Scheduled(fixedDelay = 1000)`, `MongoTemplate.findAndModify`', scale: 'Add workers; claim in small batches; shard the poll for millions of jobs.', fails: 'Crash → lease expires → another worker re-runs the job (at-least-once).',
    },
    w2: {
      name: 'Worker 2',
      what: 'Same code as worker 1. Races it for jobs, takes over after crashes and zombies.',
      why: 'Two workers show every concurrency problem this design solves.',
      without: '—',
      tech: 'Same', scale: 'Same', fails: 'Same',
    },
    reports: {
      name: 'Report Store (fenced)',
      what: 'Stores `reports { _id: "rpt-11-13", data, lastFence }` and accepts a write only if its **fence is newer** than `lastFence`.',
      why: 'A lease cannot stop a worker that froze and woke up late; the **resource** must reject its stale write.',
      without: 'A paused "zombie" worker overwrites fresh results with stale ones.',
      tech: 'MongoDB conditional upsert on `lastFence: { $lt: fence }`; S3 conditional writes or a DB version column elsewhere', scale: 'One document per scheduled run.', fails: 'Rejects stale writes with a duplicate-key error; the zombie aborts.',
      core: ['db', 'DB scaling'],
    },
    email: {
      name: 'Email provider (SES)',
      what: 'Sends the report to B. Not ours, not transactional, not fenced.',
      why: 'The typical side effect you cannot undo.',
      without: '—',
      tech: 'Amazon SES / SMTP', scale: 'External rate limits.', fails: 'Can be down (retry with backoff) and cannot check fences → dedupe with a run key.',
    },
  },

  // ---------------- 1 · overview loop ----------------
  intro: {
    headline: 'Store the job, claim it atomically, run it idempotently, complete only if you still own it.',
    points: [
      { t: 'Store', color: BLUE, d: 'The job is a document with **cron**, **time zone** and **nextRunAt**.' },
      { t: 'Claim', color: TEAL, d: 'Workers poll; one `findOneAndUpdate` sets **RUNNING**, a **60 s lease** and **fence + 1**. The loser gets null.' },
      { t: 'Run', color: AMBER, d: 'Write results **with the fence**; dedupe side effects with a **run key** (job + scheduled time).' },
      { t: 'Complete', color: GREEN, d: 'Only if `lockedBy` and `fence` still match; **nextRunAt** from cron + time zone.' },
    ],
    stats: [['1 M', 'jobs'], ['1 s', 'poll interval'], ['60 s', 'lease'], ['0', 'double starts']],
  },
  async overview(s, v, ui) {
    if (!v.ready) { setup(s, v); v.ready = true; }
    await clearRows(s, v);
    tick(s, v, '18:00:00'); lease(s, v, 'lease —'); inbox(s, v, 'B inbox: 0');
    who(s, v, 'A', 'owns job-7'); who(s, v, 'w1', 'idle · polling'); who(s, v, 'w2', 'idle · polling');

    ui.say(0); ui.cap('**Store** · A creates "daily-report at 02:00 IST"; the API stores nextRunAt');
    await s.send(['userA', 'api', 'jobdb'], 'POST /jobs', BLUE, { ms: 420 });
    await put(s, v, 'job-7', J('job-7', 'SCHEDULED', 'next 02:00 f0'), 'SCHED');
    ui.say(1); ui.cap('**Claim** · at 02:00 both workers poll; one atomic update gives the job to w1');
    tick(s, v, '02:00:00');
    await Promise.all([
      s.send(['w1', 'jobdb'], 'claim due', TEAL, { ms: 420 }),
      s.send(['w2', 'jobdb'], 'claim due', TEAL, { ms: 460, pulse: false }),
    ]);
    await put(s, v, 'job-7', J('job-7', 'RUNNING', 'w1 f1'), 'RUN');
    lease(s, v, 'w1 · until 02:01:00 · fence 1');
    await Promise.all([
      s.send(['jobdb', 'w1'], 'job-7 · f1', GREEN, { ms: 400 }),
      s.send(['jobdb', 'w2'], 'null', GREY, { ms: 400, pulse: false }),
    ]);
    who(s, v, 'w1', 'running job-7', AMBER);
    ui.say(2); ui.cap('**Run** · write the report with fence 1, email B, record it in the run log');
    await s.send(['w1', 'reports'], 'put · fence 1', PURPLE, { ms: 400 });
    await put(s, v, 'rpt', R('rpt-11-13', 'fence 1 · w1'), 'OK', v.rep);
    await s.send(['w1', 'email'], 'report → B', PURPLE, { ms: 400 });
    inbox(s, v, 'B inbox: 1 ✓', GREEN);
    ui.say(3); ui.cap('**Complete** · only if lockedBy w1 and fence 1 still match; next run from cron + TZ');
    await s.send(['w1', 'jobdb'], 'complete if w1·f1', GREEN, { ms: 400 });
    await put(s, v, 'job-7', J('job-7', 'SCHEDULED', 'next +1d 02:00'), 'SCHED');
    lease(s, v, 'lease —'); who(s, v, 'w1', 'idle · polling');
    await s.wait(1800);
    ui.say(-1); ui.cap('');
    await s.wait(400);
  },

  // ---------------- 3 · flows ----------------
  flows: [
    {
      id: 'happy', title: 'A scheduled run', sub: 'create · claim · run · complete', color: BLUE,
      build: (s, v) => setup(s, v, { clock: '18:00:00' }),
      takeaway: 'The job document **is** the schedule and the lock. A worker claims it with one atomic update (status, lease, **fence + 1**), writes results with that fence, and completes **only if it still owns the lease**. The next run is computed from **cron + time zone**, never by adding 24 h.',
      steps: [
        {
          title: 'A creates the job',
          text: '`POST /jobs { name: "daily-report", cron: "0 0 2 * * *", tz: "Asia/Kolkata" }`. The API validates the cron, computes the first run and inserts `{ _id: "job-7", status: "SCHEDULED", nextRunAt: 02:00 IST, fence: 0 }`. Spring cron has **6 fields** (seconds first).',
          observe: 'job-7 is SCHEDULED for 02:00.',
          focus: v => [v.n.jobdb, v.db],
          async run(s, v) {
            await s.send(['userA', 'api', 'jobdb'], 'POST /jobs', BLUE);
            await put(s, v, 'job-7', J('job-7', 'SCHEDULED', 'next 02:00 f0'), 'SCHED');
            await s.send(['api', 'userA'], '201 job-7', GREEN);
            who(s, v, 'A', 'job-7 created', BLUE);
          },
        },
        {
          title: '02:00: a worker claims the due job',
          text: 'Worker 1\'s poll runs `findOneAndUpdate({ status: "SCHEDULED", nextRunAt: { $lte: now } }, { $set: { status: "RUNNING", lockedBy: "w1", leaseUntil: now + 60s }, $inc: { fence: 1 } })`. Finding and taking the job is **one** operation, and it returns the job with **fence 1**.',
          observe: 'job-7 is RUNNING, leased to w1 until 02:01:00.',
          say: 'Workers claim a due job with one atomic update that sets a lease and increments a fencing token.',
          focus: v => [v.lease, v.rows['job-7']],
          async run(s, v) {
            tick(s, v, '02:00:00');
            await s.send(['w1', 'jobdb'], 'claim due job', TEAL);
            await put(s, v, 'job-7', J('job-7', 'RUNNING', 'w1 f1'), 'RUN');
            lease(s, v, 'w1 · until 02:01:00 · fence 1'); await s.pulse(v.lease);
            await s.send(['jobdb', 'w1'], 'job-7 · fence 1', GREEN);
            who(s, v, 'w1', 'running job-7 · f1', AMBER);
          },
        },
        {
          title: 'Run: write the report with the fence',
          text: 'The worker builds the report and writes it **with its fence**: `updateOne({ _id: "rpt-11-13", lastFence: { $lt: 1 } }, { $set: { data, lastFence: 1 } }, { upsert: true })`. Same `_id` for the same scheduled run, so a re-run overwrites instead of adding a copy.',
          observe: 'The report exists, written with fence 1.',
          focus: v => [v.n.reports, v.rep],
          async run(s, v) {
            tick(s, v, '02:00:04');
            await s.send(['w1', 'reports'], 'put rpt · fence 1', PURPLE);
            await put(s, v, 'rpt', R('rpt-11-13', 'fence 1 · w1'), 'OK', v.rep);
          },
        },
        {
          title: 'Email B, then record it in the run log',
          text: 'The worker sends the email and upserts `runs { _id: "job-7@02:00", emailSent: true }`. The run key is **jobId + scheduled time**, not the attempt number, so any retry of this same run sees that the email already went out.',
          observe: 'B has one email; the run log says so.',
          focus: v => [v.inbox, v.rows['run']],
          async run(s, v) {
            await s.send(['w1', 'email'], 'report → B', PURPLE);
            inbox(s, v, 'B inbox: 1 ✓', GREEN);
            await s.send(['w1', 'jobdb'], 'run log', TEAL);
            await put(s, v, 'run', R('job-7@02:00', 'emailSent ✓'), 'LOG');
          },
        },
        {
          title: 'Complete only if we still own it',

          observe: 'job-7 is SCHEDULED again for tomorrow 02:00.',
          say: 'Completion is conditional on still holding the lease, and the next run comes from cron plus time zone.',
          focus: v => [v.rows['job-7'], v.lease],
          async run(s, v) {
            await s.send(['w1', 'jobdb'], 'complete if w1·f1', GREEN);
            await put(s, v, 'job-7', J('job-7', 'SCHEDULED', 'next +1d 02:00'), 'SCHED');
            lease(s, v, 'lease —');
            who(s, v, 'w1', 'idle · polling');
          },
        },
      ],
    },
    {
      id: 'race', title: 'Two workers, one job', sub: 'read-then-update vs atomic claim', color: PURPLE,
      build: (s, v) => setup(s, v, { jobs: [JOB7], clock: '01:59:59' }),
      takeaway: 'Never "find, then update": both workers read the same due job and both run it. Put the condition (`status: "SCHEDULED"`, due) **inside** one `findOneAndUpdate`. MongoDB updates a single document atomically, so the second worker\'s filter no longer matches and it gets **null**.',
      steps: [
        {
          title: '02:00:00: both workers poll at the same moment',
          text: 'Workers poll every second, so at 02:00:00 both see job-7 as due. This is not a rare race: with 20 workers it happens to **every** job.',
          observe: 'Two polls hit the Job DB together.',
          focus: v => [v.n.w1, v.n.w2],
          async run(s, v) {
            tick(s, v, '02:00:00');
            await Promise.all([
              s.send(['w1', 'jobdb'], 'find due', BLUE),
              s.send(['w2', 'jobdb'], 'find due', BLUE, { pulse: false }),
            ]);
          },
        },
        {
          title: '❌ Read, then update',
          text: 'Naive code: `job = find({ status: "SCHEDULED", nextRunAt: { $lte: now } })`, then `updateOne({ _id: job.id }, { $set: { status: "RUNNING", lockedBy: me } })`. Both reads return job-7 because neither update has happened yet.',
          observe: 'Both workers think job-7 is theirs.',
          focus: v => [v.uw1, v.uw2],
          async run(s, v) {
            await Promise.all([
              s.send(['jobdb', 'w1'], 'job-7', AMBER),
              s.send(['jobdb', 'w2'], 'job-7', AMBER, { pulse: false }),
            ]);
            who(s, v, 'w1', 'got job-7', AMBER); who(s, v, 'w2', 'got job-7', AMBER);
          },
        },
        {
          title: '❌ Both updates succeed, both run it',
          text: 'The update filters only on `_id`, so both match. The last writer wins the `lockedBy` field, but **both** workers run the job: two reports, and B gets **two emails**.',
          observe: 'B gets the report twice.',
          say: 'Read-then-update is a race: both workers can start the same job.',
          focus: v => [v.inbox, v.rows['job-7']],
          async run(s, v) {
            await Promise.all([
              s.send(['w1', 'jobdb'], 'set RUNNING w1', RED),
              s.send(['w2', 'jobdb'], 'set RUNNING w2', RED, { pulse: false }),
            ]);
            await put(s, v, 'job-7', J('job-7', 'RUNNING', 'w2 (w1 too!)'), 'BAD');
            await Promise.all([
              s.send(['w1', 'email'], 'report → B', RED),
              s.send(['w2', 'email'], 'report → B', RED, { pulse: false }),
            ]);
            inbox(s, v, 'B inbox: 2 ✕', RED);
            who(s, v, 'w1', 'running job-7', RED); who(s, v, 'w2', 'running job-7', RED);
          },
        },
        {
          title: '✅ Rewind: one atomic findOneAndUpdate',
          text: 'Put the condition **in the update**: `findOneAndUpdate({ status: "SCHEDULED", nextRunAt: { $lte: now } }, { $set: { status: "RUNNING", lockedBy: me, leaseUntil: now + 60s }, $inc: { fence: 1 } })`. MongoDB applies updates to one document atomically: whichever arrives first flips status to RUNNING.',
          observe: 'Two claims reach the DB again.',
          say: 'The claim is a single atomic findOneAndUpdate with the status in the filter.',
          focus: v => [v.n.jobdb],
          async run(s, v) {
            await put(s, v, 'job-7', J('job-7', 'SCHEDULED', 'next 02:00 f0'), 'SCHED');
            inbox(s, v, 'B inbox: 0'); who(s, v, 'w1', 'idle · polling'); who(s, v, 'w2', 'idle · polling');
            await Promise.all([
              s.send(['w1', 'jobdb'], 'claim (atomic)', TEAL),
              s.send(['w2', 'jobdb'], 'claim (atomic)', TEAL, { pulse: false }),
            ]);
          },
        },
        {
          title: 'One winner, one null',
          text: 'w1\'s update arrives first: job-7 becomes RUNNING with fence 1. When w2\'s update is evaluated, `status: "SCHEDULED"` no longer matches, so it returns **null** and w2 simply polls again next second.',
          observe: 'w1 owns job-7; w2 got null.',
          focus: v => [v.lease, v.uw2],
          async run(s, v) {
            await put(s, v, 'job-7', J('job-7', 'RUNNING', 'w1 f1'), 'RUN');

  ZonedDateTime now = ZonedDateTime.now(ZoneId.of(tz));        // "Asia/Kolkata"
  return CronExpression.parse(cron)                            // "0 0 2 * * *": 6 fields, seconds first
                       .next(now).toInstant();                 // DST-aware: local 02:00, not now + 24 h
}

void fail(Job j, Exception e) {
  int attempts = j.attempts() + 1;
  Update u = attempts >= 5 || !isTransient(e)
      ? new Update().set("status", "FAILED")                   // parked: alert the owner
      : new Update().set("status", "SCHEDULED").set("attempts", attempts)

}` },
