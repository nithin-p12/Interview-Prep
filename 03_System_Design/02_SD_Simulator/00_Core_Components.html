<script>
// Core Components: every building block taught ONCE, here. Design pages link to these pills instead of re-teaching.
const BLUE = '#2f6fe0', TEAL = '#13968a', GREEN = '#348747', AMBER = '#c47d1e', PURPLE = '#8f4fc4', RED = '#ce3434', GREY = '#7b878f';
const LAYER = { entry: ['#4f7bd9', '#e3ebfb'], app: ['#13968a', '#dcf1ee'], data: ['#c47d1e', '#f8e8cc'], async: ['#8f4fc4', '#efe2f8'] };
const N = (s, id, x, y, label, sub, icon, layer, o = {}) => s.node(id, { x, y, label, sub, icon, color: LAYER[layer][0], soft: LAYER[layer][1], ...o });
const vis = (on, ...els) => els.forEach(e => { if (e) e.style.opacity = on ? '' : 0; });
const num = n => Math.round(n).toLocaleString('en');
// overloaded for a while → DOWN; comfortably below capacity for a while → back up. h = { over, calm, down }
function health(h, load, dt) {
  h.over = load >= 1 ? h.over + dt : 0;
  h.calm = load < .75 ? h.calm + dt : 0;
  if (!h.down && h.over > 1.2) { h.down = true; return 'down'; }
  if (h.down && h.calm > 1.5) { h.down = false; return 'up'; }
}
// A looping script of packets (How it works slides). set(i) switches the scenario immediately.
function scripted(s, scenarios, pause = 1300) {
  let mode = 0;
  const run = async () => {
    try { for (;;) { await scenarios[mode](); await s.wait(pause); } }
    catch (e) { if (!(e instanceof SD.Cancelled)) throw e; }
  };
  return {
    set(i) {
      mode = i;
      s.clock.cancel(); s.top.replaceChildren();
      for (const w of Object.values(s.links)) { w.classList.remove('flow', 'rev'); w.style.removeProperty('--c'); }
      scenarios.reset?.(i);
      run();
    },
  };
}
const down = (s, n, sub) => { s.tone(n, 'fail'); s.setSub(n, sub, RED); s.shake(n).catch(() => {}); };
const up = (s, n, sub) => { s.tone(n, 'ok'); s.setSub(n, sub, GREEN); };

// ================= Load balancer =================
const LB = {
  id: 'lb', title: 'Load Balancer', short: 'Load balancer', icon: '⚖️', color: BLUE,
  what: {
    title: 'One address in front of many identical servers',
    text: 'Clients talk to **one address**. The load balancer **spreads** each request to one of several identical app servers, **health-checks** them and stops sending to a dead one. Examples: **AWS ALB / NLB, Nginx, HAProxy, Envoy, Kubernetes Service / Ingress**.',
    build(s) {
      N(s, 'client', 90, 200, 'Users', 'browsers · apps', '👥', 'entry', { w: 150 });
      N(s, 'lb', 345, 200, 'Load Balancer', 'one public address', '⚖️', 'entry');
      const S = ['s1', 's2', 's3'];
      S.forEach((id, i) => N(s, id, 650, 80 + 120 * i, `App server ${i + 1}`, 'stateless · identical', '🖥️', 'app'));
      N(s, 'db', 950, 200, 'Database', 'shared state', '🗄️', 'data', { w: 150 });
      s.wire('client', 'lb'); S.forEach(id => { s.wire('lb', id); s.wire(id, 'db'); });
      s.chip(345, 252, 'TLS · routing · health checks', { color: GREY });
      s.chip(950, 252, 'state lives here, not in servers', { color: GREY });
      let acc = 0, k = 0;
      SD.loop(s, dt => {
        for (acc += dt * 3; acc >= 1; acc--) {
          const id = S[k++ % 3];
          SD.dot(s, ['client', 'lb', id], BLUE).then(ok => ok && SD.dot(s, [id, 'lb', 'client'], GREEN, { r: 4 }));
        }
      });
    },
  },
  why: {
    title: 'One server is a ceiling and a single point of failure',
    text: '**Without:** every user hits the same server. One server handles about **7,000 req/s**; we send **12,000**, so its CPU and threads run out and it goes **DOWN**. **With:** three identical servers behind a load balancer share the traffic, about 4,000 each.',
    without: 'Without · 1 server', with: 'With · LB + 3 servers',
    hint: 'Start with **Without**, watch it go down, then switch.',
    build(s) {
      const CAP = 7, RATE = 12;
      N(s, 'client', 90, 200, 'Users', '12,000 req/s', '👥', 'entry', { w: 150 });
      const lb = N(s, 'lb', 340, 200, 'Load Balancer', 'round robin · health', '⚖️', 'entry');
      const ids = ['s1', 's2', 's3'], Y = { s1: 85, s2: 200, s3: 315 };
      for (const id of ids) N(s, id, 640, Y[id], id === 's2' ? 'App server' : `App server ${id[1]}`, 'stateless', '🖥️', 'app');
      const direct = s.wire('client', 's2');
      const lbWires = [s.wire('client', 'lb'), ...ids.map(id => s.wire('lb', id))];
      const st = Object.fromEntries(ids.map(id => [id, { load: 0, over: 0, calm: 0, down: false, meter: SD.meter(s, 640, Y[id] + 44) }]));
      const traffic = s.chip(15, 148, '', { color: TEAL, anchor: 'start' });
      const L = { lb: false, acc: 0, rr: 0, rate: 0 };
      const look = on => {
        L.lb = on;
        vis(on, lb, ...lbWires, s.nodes.s1, s.nodes.s3, st.s1.meter.g, st.s3.meter.g);
        vis(!on, direct);
        for (const id of ids) { Object.assign(st[id], { down: false, over: 0, calm: 0 }); s.tone(s.nodes[id], null); s.setSub(s.nodes[id], 'stateless'); }
        s.setSub(s.nodes.s2, on ? 'stateless' : 'the only server');
      };
      const pool = () => L.lb ? ids.filter(id => !st[id].down) : ['s2'];
      const spawn = () => {
        const p = pool(); if (!p.length) return;
        const id = p[L.rr++ % p.length], head = L.lb ? ['client', 'lb', id] : ['client', id];
        SD.dot(s, head, TEAL, { fail: st[id].down }).then(ok => {
          if (ok === undefined) return;
          if (!ok) return SD.dot(s, L.lb ? ['lb', 'client'] : [id, 'client'], RED, { r: 4 });
          SD.dot(s, [...head].reverse(), GREEN, { r: 4, ms: 380 });
        });
      };
      SD.loop(s, dt => {
        L.rate += (RATE - L.rate) * Math.min(1, dt * .8);
        for (L.acc += dt * L.rate; L.acc >= 1; L.acc--) spawn();
        const p = pool();
        let failing = !p.length;
        for (const id of ids) {
          const h = st[id], inPool = p.includes(id);
          h.load += ((inPool ? L.rate / p.length / CAP : 0) - h.load) * Math.min(1, dt * 1.4);
          h.meter.set(h.load);
          if (!L.lb && id !== 's2') continue;
          const ch = health(h, h.load, dt);
          if (ch === 'down') down(s, s.nodes[id], '✕ DOWN · out of threads');
          else if (ch === 'up') up(s, s.nodes[id], 'back up');
          if (!L.lb && h.down) failing = true;
        }
        s.setChip(traffic, `traffic ${num(L.rate * 1000)} req/s${failing ? ' · errors!' : ''}`, { color: failing ? RED : TEAL, stroke: failing ? RED : '#d5d9dc' });
      });
      return { set: look };
    },
  },
  how: {
    title: 'How does it pick a server?',
    text: 'Each dot is a request, coloured by user **A B C D**. Server 1 is **slow** (a long GC pause), so its requests take 4× longer. Watch the **active** count next to each server.',
    options: ['Round robin', 'Least connections', 'IP hash · sticky'],
    explain: [
      '**Round robin:** next server in turn. Simple and even, but blind: the slow server keeps getting its share and its queue grows.',
      '**Least connections:** send to the server with the fewest requests in flight. The slow server naturally gets fewer. Good default for uneven request costs.',
      '**Hash / sticky:** `hash(user) → server`, so a user always lands on the same server (sessions, local caches). Spread can be uneven and a dead server moves its users. Better: keep servers stateless, sessions in Redis.',
    ],
    build(s) {
      const USERS = [['A', BLUE], ['B', PURPLE], ['C', AMBER], ['D', TEAL]];
      N(s, 'client', 90, 200, 'Users', 'A · B · C · D', '👥', 'entry', { w: 150 });
      const lb = N(s, 'lb', 345, 200, 'Load Balancer', 'round robin', '⚖️', 'entry');
      const ids = ['s1', 's2', 's3'], st = {};
      ids.forEach((id, i) => {
        const n = N(s, id, 650, 80 + 120 * i, `App server ${i + 1}`, i ? 'normal speed' : 'slow · GC pause', '🖥️', 'app');
        if (!i) s.tone(n, 'warn');
        s.wire('lb', id);
        st[id] = { active: 0, chip: s.chip(750, 80 + 120 * i, '0 active', { anchor: 'start' }), users: s.chip(650, 80 + 120 * i + 44, '', { color: GREY }) };
        st[id].users.style.display = 'none';
      });
      s.wire('client', 'lb');
      let mode = 0, rr = 0, u = 0, acc = 0;
      const paint = id => s.setChip(st[id].chip, `${st[id].active} active`, { color: st[id].active > 4 ? RED : st[id].active > 2 ? AMBER : '#203347', stroke: st[id].active > 4 ? RED : '#d5d9dc' });
      const pick = ui => mode === 0 ? ids[rr++ % 3] : mode === 1 ? ids.reduce((a, b) => st[b].active < st[a].active ? b : a) : ids[ui % 3];
      const spawn = () => {
        const ui = u++ % 4, [name, color] = USERS[ui], id = pick(ui);
        SD.dot(s, ['client', 'lb', id], color, { r: 6 }).then(ok => {
          if (!ok) return;
          st[id].active++; paint(id);
          s.wait(id === 's1' ? 2800 : 700).then(() => {
            st[id].active--; paint(id);
            SD.dot(s, [id, 'lb', 'client'], GREEN, { r: 4 });
          }).catch(() => {});
        });
      };
      SD.loop(s, dt => { for (acc += dt * 3.2; acc >= 1; acc--) spawn(); });
      return {
        set(i) {
          mode = i;
          s.setSub(lb, ['round robin', 'least connections', 'hash(user) → server'][i]);
          ids.forEach((id, k) => {
            st[id].users.style.display = i === 2 ? '' : 'none';
            s.setChip(st[id].users, `users ${USERS.filter((_, ui) => ui % 3 === k).map(x => x[0]).join(' · ')}`);
          });
        },
      };
    },
  },
  pros: {
    pros: [
      ['Horizontal scale.', 'Add servers to add capacity; no code change.'],
      ['High availability.', 'Health checks take a dead server out of the pool; users never notice.'],
      ['Zero-downtime deploys.', 'Drain one server, update it, put it back (rolling / blue-green).'],
      ['One public endpoint.', 'TLS termination, path routing (`/api` vs `/static`), rate limits in one place.'],
    ],
    cons: [
      ['The LB itself must be redundant.', 'Use a managed LB or an active/passive pair, or it becomes the new single point of failure.'],
      ['Servers must be stateless.', 'Sessions or in-memory data on one server break when the next request lands elsewhere.'],
      ['Sticky sessions skew load.', 'One heavy user pins one server; failover drops their session.'],
      ['An extra hop.', 'Adds about 1 ms and one more component to configure and monitor.'],
    ],
    bottom: 'As soon as a service runs more than one instance, put a load balancer in front and keep the instances stateless.',
  },
  when: {
    choose: [
      'A service needs **more than one instance** (capacity or availability).',
      'You want **rolling deploys** and automatic failover.',
      'Clients need **one stable address** (public API, web app).',
      'Long-lived **WebSocket** connections need to be spread (L4 or L7 with sticky upgrade).',
    ],
    avoid: [
      'A single-instance internal tool or batch job: nothing to balance.',
      'Service-to-service calls inside a mesh: **client-side** load balancing (Spring Cloud LoadBalancer, gRPC, Istio) is often enough.',
      'You are trying to fix a **database** bottleneck: an LB spreads app servers, not one DB.',
    ],
    alt: {
      head: ['Option', 'Works at', 'Good for', 'Watch out'],
      me: 'L7 load balancer',
      rows: [
        ['L7 load balancer', 'HTTP (path, header, cookie)', 'Web/API traffic, routing, TLS, rate limits', 'More CPU per request'],
        ['L4 load balancer', 'TCP/UDP (IP + port)', 'Very high throughput, WebSockets, non-HTTP', 'Cannot route by URL'],
        ['DNS round robin', 'DNS answers', 'Spreading across regions', 'Clients cache DNS; slow failover'],
        ['Client-side LB', 'Inside the caller', 'Microservice-to-microservice', 'Every client needs the logic / registry'],
      ],
    },
  },
  say: {
    lines: [
      'The app tier is **stateless**, so I run several instances behind an **L7 load balancer**.',
      'The LB does **TLS termination**, **health checks** and **least-connections** routing.',
      'State lives in the database and Redis, so any instance can serve any request; **no sticky sessions**.',
      'I size the pool for **N+1** (survive losing one) and autoscale on CPU or latency.',
      'The LB itself is **managed and multi-AZ**, so it is not a single point of failure.',
    ],
    used: [['URL Shortener', '01_URL_Shortener.html'], ['Ticket Booking', '03_Ticket_Booking.html'], ['File Upload', '06_File_Upload.html'], ['Chat (sticky WebSockets)'], ['every design']],
    qa: [
      ['L4 vs L7?', '**L4** forwards TCP connections by IP/port: fast, protocol-agnostic. **L7** understands HTTP: routes by path/header/cookie, terminates TLS, can retry. Most web APIs use L7; use L4 for raw TCP, very high throughput or WebSockets.'],
      ['How does it know a server is down?', 'Active **health checks** (e.g. `GET /health` every 5 s, unhealthy after 2–3 failures) plus passive checks (errors/timeouts on real traffic). Unhealthy servers leave the pool and rejoin when healthy.'],
      ['What if the load balancer fails?', 'Run it redundantly: managed cloud LBs are multi-AZ; self-hosted use an active/passive pair with a floating IP (keepalived) or DNS failover.'],
      ['Why not sticky sessions?', 'They pin users to servers, skew load and lose sessions on failure. Store sessions in **Redis** or use stateless **JWTs** so any server can answer.'],
      ['Which algorithm would you pick?', '**Least connections** (or least response time) when request cost varies; round robin when requests are uniform; consistent hashing when you want cache affinity.'],
    ],
  },
};

// ================= Cache =================
const CACHE = {
  id: 'cache', title: 'Cache (Redis)', short: 'Cache · Redis', icon: '⚡', color: AMBER,
  what: {
    title: 'Keep hot data in memory, in front of the database',
    text: 'A cache is a fast **in-memory key → value** store. The app checks it first: a **hit** answers in about **1 ms**; a **miss** reads the database (~10 ms) and stores the result with a **TTL**. Examples: **Redis**, Memcached, local caches like Caffeine.',
    build(s) {
      N(s, 'client', 90, 200, 'Users', 'read the same things', '👥', 'entry', { w: 160 });
      N(s, 'app', 360, 200, 'App service', 'cache-aside', '🖥️', 'app');
      N(s, 'redis', 680, 100, 'Redis cache', 'in memory · ~1 ms', '⚡', 'data');
      N(s, 'db', 680, 300, 'Database', 'on disk · ~10 ms', '🗄️', 'data');
      s.wire('client', 'app'); s.wire('app', 'redis'); s.wire('app', 'db');
      s.chip(780, 100, 'HIT ≈ 90% of reads', { anchor: 'start', color: GREEN });
      s.chip(780, 300, 'only the misses', { anchor: 'start', color: GREY });
      let acc = 0;
      SD.loop(s, dt => {
        for (acc += dt * 3; acc >= 1; acc--) {
          const hit = Math.random() < .85;
          SD.dot(s, ['client', 'app', 'redis'], AMBER).then(ok => {
            if (!ok) return;
            if (hit) return SD.dot(s, ['redis', 'app', 'client'], GREEN, { r: 4 });
            SD.dot(s, ['app', 'db'], TEAL, { ms: 500 }).then(ok => ok && SD.dot(s, ['db', 'app'], TEAL, { r: 4 })).then(ok => {
              if (!ok) return;
              SD.dot(s, ['app', 'redis'], AMBER, { r: 3, ms: 300 });
              SD.dot(s, ['app', 'client'], GREEN, { r: 4 });
            });
          });
        }
      });
    },
  },
  why: {
    title: 'Without a cache, every read hits the database',
    text: 'A product goes viral: **14,000 reads/s**, mostly for the **same few items**. The database serves about **8,000 reads/s**. **Without:** it overloads and goes **DOWN**. **With:** Redis answers ~92% of reads from memory; the database sees only ~1,100/s.',
    without: 'Without cache', with: 'With Redis',
    hint: 'Watch the **Database** meter, then switch.',
    build(s) {
      const CAP = 8, RATE = 14;
      N(s, 'client', 90, 200, 'Users', '14,000 reads/s', '👥', 'entry', { w: 150 });
      N(s, 'app', 360, 200, 'App service', 'GET /product/42', '🖥️', 'app');
      const db = N(s, 'db', 680, 200, 'Database', 'serves ~8,000 reads/s', '🗄️', 'data');
      const redis = N(s, 'redis', 680, 335, 'Redis cache', 'hot keys · TTL', '⚡', 'data');
      s.wire('client', 'app'); s.wire('app', 'db');
      const rw = s.wire('app', 'redis');
      const meter = SD.meter(s, 680, 245);
      const traffic = s.chip(15, 148, '', { color: TEAL, anchor: 'start' });
      const hitChip = s.chip(780, 335, '', { anchor: 'start', color: AMBER });
      let downChip = null;
      const L = { cache: false, hit: 0, load: 0, rate: 0, acc: 0, h: { over: 0, calm: 0, down: false } };
      const spawn = () => {
        const toCache = L.cache && Math.random() < L.hit, fail = !toCache && L.h.down;
        const path = ['client', 'app', toCache ? 'redis' : 'db'];
        SD.dot(s, path, toCache ? AMBER : TEAL, { fail }).then(ok => {
          if (ok === undefined) return;
          if (!ok) return SD.dot(s, ['app', 'client'], RED, { r: 4 });
          if (!toCache && L.cache) SD.dot(s, ['app', 'redis'], AMBER, { r: 3, ms: 300 });
          SD.dot(s, [...path].reverse(), GREEN, { r: 4, ms: 380 });
        });
      };
      SD.loop(s, dt => {
        L.rate += (RATE - L.rate) * Math.min(1, dt * .8);
        for (L.acc += dt * L.rate; L.acc >= 1; L.acc--) spawn();
        L.hit = L.cache ? L.hit + (.92 - L.hit) * Math.min(1, dt * .7) : 0;
        L.load += (L.rate * (1 - L.hit) / CAP - L.load) * Math.min(1, dt * 1.4);
        meter.set(L.load);
        s.setChip(traffic, `traffic ${num(L.rate * 1000)} reads/s${L.h.down ? ' · errors!' : ''}`, { color: L.h.down ? RED : TEAL, stroke: L.h.down ? RED : '#d5d9dc' });
        hitChip.style.display = L.cache ? '' : 'none';
        if (L.cache) s.setChip(hitChip, `hit ratio ${Math.round(L.hit * 100)}% · DB sees ${num(L.rate * (1 - L.hit) * 1000)}/s`);
        const ch = health(L.h, L.load, dt);
        if (ch === 'down') { down(s, db, '✕ DOWN · timeouts'); downChip = s.chip(680, 150, '✕ DOWN', { color: '#fff', fill: RED, stroke: RED }); }
        else if (ch === 'up') { up(s, db, 'healthy again'); downChip?.remove(); downChip = null; }
      });
      return { set(on) { L.cache = on; L.hit = 0; vis(on, redis, rw); } };
    },
  },
  how: {
    title: 'Cache-aside: read, write and expiry',
    text: 'The **app** owns the logic: Redis is just a fast map. Pick a case and follow the packets; the chip next to Redis shows what it holds.',
    options: ['Read · hit', 'Read · miss → fill', 'Write → delete key', 'TTL expires'],
    explain: [
      '**Hit:** the key is in Redis, answer from memory in ~1 ms. The database is not touched.',
      '**Miss:** not in Redis, so read the database once, then `SET` it with a TTL. Every later read is a hit until it expires or is deleted.',
      '**Write:** update the **database first**, then **delete** the cache key (do not update it). The next read misses and loads fresh data, so the cache cannot keep an old value.',
      '**TTL:** every key expires on its own (minutes to hours). It bounds how stale data can get, and memory is freed. When memory is full Redis **evicts** (LRU / LFU).',
    ],
    build(s) {
      N(s, 'app', 240, 200, 'App service', 'cache-aside logic', '🖥️', 'app');
      N(s, 'redis', 640, 100, 'Redis cache', 'key → value', '⚡', 'data');
      N(s, 'db', 640, 300, 'Database', 'source of truth', '🗄️', 'data');
      s.wire('app', 'redis'); s.wire('app', 'db');
      const box = s.chip(740, 100, '', { anchor: 'start', mono: true });
      const FULL = 'product:42 → {…}  TTL 3600s', EMPTY = '(empty)';
      const hold = (str, c) => s.setChip(box, str, { color: c ?? '#203347' });
      const fill = async () => {
        await s.send(['app', 'db'], 'SELECT 42', TEAL);
        await s.send(['db', 'app'], 'row', TEAL);
        await s.send(['app', 'redis'], 'SET product:42 EX 3600', AMBER);
        hold(FULL, GREEN);
      };
      const sc = [
        async () => { hold(FULL); await s.send(['app', 'redis'], 'GET product:42', AMBER); await s.send(['redis', 'app'], 'HIT', GREEN); await s.flash(240, 140, '~1 ms', { color: GREEN, stroke: GREEN }); },
        async () => { hold(EMPTY, GREY); await s.send(['app', 'redis'], 'GET product:42', AMBER); await s.send(['redis', 'app'], 'MISS', RED); await fill(); await s.flash(240, 140, '~12 ms, once', { color: AMBER, stroke: AMBER }); },
        async () => {
          hold(FULL);
          await s.send(['app', 'db'], 'UPDATE price', TEAL); await s.send(['db', 'app'], 'ok', TEAL);
          await s.send(['app', 'redis'], 'DEL product:42', RED); hold(EMPTY, GREY);
          await s.flash(240, 140, 'next read refills fresh data', { color: GREY }, 1200);
        },
        async () => {
          await s.clock.tween(3000, t => hold(`product:42 → {…}  TTL ${Math.max(0, Math.ceil(3 * (1 - t)))}s`, t > .66 ? RED : '#203347'), true);
          hold('(expired)', RED);
          await s.send(['app', 'redis'], 'GET product:42', AMBER); await s.send(['redis', 'app'], 'MISS', RED); await fill();
        },
      ];
      return scripted(s, sc);
    },
  },
  pros: {
    pros: [
      ['Huge read throughput.', 'Redis does 100k+ ops/s per node; most reads never reach the database.'],
      ['Millisecond latency.', 'Memory instead of disk + query planning.'],
      ['Protects the database.', 'Absorbs viral spikes; the DB only sees misses and writes.'],
      ['More than a cache.', 'Counters, rate limits, sessions, leaderboards (sorted sets), distributed locks.'],
    ],
    cons: [
      ['Stale data.', 'The cache can disagree with the DB until delete/TTL. Choose TTLs per data type.'],
      ['Invalidation is hard.', 'Every write path must delete the right keys, or users see old values.'],
      ['Cold start & stampede.', 'Empty cache or one hot key expiring sends a burst to the DB (use single-flight / locks, jittered TTLs).'],
      ['Extra component + memory cost.', 'Needs monitoring, replicas for HA, and RAM is pricier than disk.'],
    ],
    bottom: 'Cache read-heavy, hot, slightly-stale-is-OK data with cache-aside + TTL; delete on write.',
  },
  when: {
    choose: [
      'Reads ≫ writes (10:1 or more) and the **same keys** are read again and again.',
      'You need **~1 ms** responses or the DB is busy with repeated reads.',
      'A few seconds of **staleness is acceptable** (product page, profile, short-URL lookup).',
      'Shared fast state: **sessions, rate limit counters, leaderboards**.',
    ],
    avoid: [
      'Write-heavy data or every read is **unique** (no reuse → no hits).',
      'Must be **strictly up to date** (bank balance, seat count at checkout): read the DB.',
      'The DB is fast enough already: a cache adds invalidation bugs for no gain.',
