<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FireFlink System Design</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--ink:#141824;--muted:#5d6678;--line:#dbe0ea;--accent:#f05a28;--accent-soft:#fde8df;
  --svc:#eef3ff;--svc-b:#8aa4ee;--store:#e9f7ee;--store-b:#47b072;--bus:#1d2230;--bus-ink:#f4f6fa;--bus-sub:#c3c9d6;
  --ext:#f4f5f8;--ext-b:#aab2c3;--prop:#fff6e5;--prop-b:#e39a12;--zone:#fafbfd;--zone-b:#c3cadb;--edge:#6d778b;--grid:#e6eaf2;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1117;--surface:#151a23;--ink:#e7eaf1;--muted:#97a1b5;--line:#272e3c;--accent:#ff7a45;--accent-soft:#3a2219;
  --svc:#18213a;--svc-b:#5878dc;--store:#12261b;--store-b:#3fa566;--bus:#2a3244;--bus-ink:#f4f6fa;--bus-sub:#b9c1d2;
  --ext:#1a1f29;--ext-b:#4c5568;--prop:#2c2312;--prop-b:#e39a12;--zone:#121721;--zone-b:#333b4c;--edge:#8790a5;--grid:#1b212c;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface);z-index:30}
.ib{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:grid;place-items:center;font-size:16px}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.brand{font-weight:700;white-space:nowrap}.brand span{color:var(--accent)}
#slideTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px}#count{min-width:54px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
nav#menu{position:fixed;top:52px;left:0;bottom:0;width:310px;max-width:86vw;background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;z-index:25;overflow:auto;padding:10px}
nav#menu.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.12)}
nav#menu a{display:flex;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
nav#menu a b{color:var(--muted);font-weight:600;min-width:22px;font-variant-numeric:tabular-nums}
nav#menu a:hover{background:var(--bg)}nav#menu a.cur{background:var(--accent-soft);color:var(--accent)}
nav#menu .sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
main#deck{position:absolute;top:52px;left:0;right:0;bottom:0}
.slide{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1fr) 410px}
.slide.active{display:grid}
.slide.collapsed{grid-template-columns:minmax(0,1fr) 0}.slide.collapsed .panel{display:none}
.stage{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
.dia,.dia svg{width:100%;height:100%;display:block}
.dia svg{touch-action:none;cursor:grab;user-select:none}.dia svg.grabbing{cursor:grabbing}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;pointer-events:none}
.ctrl{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:6px}
.player{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:min(880px,calc(100% - 28px))}
.player .cap{flex:1;min-width:0;font-size:13.5px}.player .cap b{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;margin-right:8px}
.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:20px 22px 48px}
.kicker{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.panel h2{margin:4px 0 10px;font-size:22px;line-height:1.25}
.panel h4,.htmlwrap h4{margin:20px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel ol,.panel ul{padding-left:20px;margin:0}.panel li{margin:5px 0}
.lead{font-size:15px;margin:0 0 6px}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--grid);padding:1px 5px;border-radius:4px}
.verify{display:inline-block;font-size:10.5px;font-weight:700;color:var(--prop-b);border:1px solid var(--prop-b);border-radius:999px;padding:0 6px;line-height:16px;vertical-align:1px}
.repo{display:inline-block;font-size:10.5px;font-weight:700;color:var(--store-b);border:1px solid var(--store-b);border-radius:999px;padding:0 6px;line-height:16px;vertical-align:1px}
.qa{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.qa b{display:block;margin-bottom:2px}
table.kv{width:100%;border-collapse:collapse;font-size:13px}table.kv td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}table.kv td:first-child{color:var(--muted);width:42%}
.steps li{cursor:pointer;border-radius:6px;padding:2px 4px}.steps li:hover{background:var(--bg)}.steps li.cur{background:var(--accent-soft);color:var(--accent)}
.sel{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--bg)}
.sel h3{margin:0 0 4px;font-size:16px}.sel p{margin:4px 0}
.go{margin-top:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:4px 12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid}
/* svg */
.node rect{stroke-width:1.6}
.node{cursor:pointer;transition:opacity .25s}
.k-svc>rect,.k-chip>rect{fill:var(--svc);stroke:var(--svc-b)}
.k-store>rect{fill:var(--store);stroke:var(--store-b)}
.k-bus>rect{fill:var(--bus);stroke:var(--bus)}.k-bus{color:var(--bus-ink)}.k-bus .t1{fill:var(--bus-ink)}.k-bus .t2{fill:var(--bus-sub)}
.k-ext>rect{fill:var(--ext);stroke:var(--ext-b)}
.k-prop>rect{fill:var(--prop);stroke:var(--prop-b);stroke-dasharray:7 5}
.k-lead>rect{fill:var(--accent-soft);stroke:var(--accent)}
.k-group>rect{fill:var(--zone);stroke:var(--zone-b)}
.k-zone>rect{fill:none;stroke:var(--zone-b);stroke-dasharray:8 7;stroke-width:2}
.k-group,.k-zone{cursor:default}
.node.hi>rect{stroke:var(--accent);stroke-width:2.6}
.node:not(.k-group):not(.k-zone):hover>rect{stroke-width:2.8}
.node.sel>rect{stroke:var(--accent);stroke-width:3.4}
.node{color:var(--ink)}.node.k-bus{color:var(--bus-ink)}
.t1{font-size:17px;font-weight:600;fill:var(--ink)}
.tc{font-size:15px;font-weight:600;fill:var(--ink)}
.t2{font-size:13px;fill:var(--muted)}
.tg{font-size:14px;font-weight:700;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.edge{fill:none;stroke:var(--edge);stroke-width:2}
.edge.dash{stroke-dasharray:7 6}
.edge.prop{stroke:var(--prop-b);stroke-dasharray:7 6}
.pulse{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:4 22;animation:flow 1.4s linear infinite;opacity:.35}
@keyframes flow{to{stroke-dashoffset:-26}}
.ah{fill:var(--edge)}.ahh{fill:var(--accent)}.ahp{fill:var(--prop-b)}
.elabel rect{fill:var(--surface);stroke:var(--line)}.elabel text{font-size:12.5px;fill:var(--muted)}
.eg,.elabel{transition:opacity .25s}
.playing .node:not(.k-group):not(.k-zone),.playing .eg,.playing .elabel{opacity:.13}
.playing .k-group,.playing .k-zone{opacity:.45}
.playing .on{opacity:1!important}
.playing .eg.on .edge{stroke:var(--accent);stroke-width:3.2}
.playing .eg.on .pulse{opacity:1;stroke-width:3.4}
.playing .elabel.on rect{stroke:var(--accent)}.playing .elabel.on text{fill:var(--accent);font-weight:600}
/* html slides */
.slide.htmlslide{grid-template-columns:1fr}
.htmlwrap{overflow:auto;padding:28px clamp(16px,4vw,56px) 60px}
.htmlwrap h1{margin:6px 0 6px;font-size:28px}
.htmlwrap .sub{color:var(--muted);margin:0 0 18px;max-width:900px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.card ul{margin:0;padding-left:18px}.card li{margin:4px 0}
.svcrow{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.svcrow:last-child{border-bottom:0}
.svcrow b{font-size:13.5px}.svcrow .p{font-family:Consolas,monospace;font-size:12px;color:var(--accent);min-width:42px}
.svcrow .d{color:var(--muted);font-size:12.5px}
.pitch{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;max-width:1000px;font-size:15px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;max-width:1000px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{color:var(--accent);margin-bottom:6px}
.ico{width:22px;height:22px;flex:none}
@media (max-width:900px){
  html,body{overflow:auto}
  .slide{grid-template-columns:1fr!important;grid-template-rows:62vh auto;overflow:auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .slide.collapsed .panel{display:block}
  .hint{display:none}.brand{display:none}
}
</style>
</head>

<script>
/* ============================== DATA ============================== */
const SVC = {
  'tyss-auth':['8200','Sign-in, token issue/refresh, user context'],
  'tyss-project':['8202','Projects, scripts (test cases), steps, elements, test data, files'],
  'tyss-all-trees':['8203','Folder / module trees for scripts, elements, test data'],
  'tyss-refactoring':['8204','Impact analysis & reference updates for shared steps/elements'],
  'fireflink-workbench':['9011','Authoring & debugging workbench (web / mobile)'],
  'webservice-workbench':['8212','API (web-service) testing workbench'],
  'dashboard-execution':['8209','Suites, run requests, queue & priority, machine allocation, execution dashboard'],
  'tyss-scheduler':['8216','Scheduled / recurring suite runs'],
  'client-systemconfig':['8207','Registered client machines, capabilities, live machine status'],
  'execution-result':['8210','Consumes step results, persists, computes status, fans out events'],
  'tyss-analytics':['8215','Aggregations, dashboards, Elasticsearch indexing & search'],
  'fireflink-reports':['8055','HTML / PDF reports, screenshots, archival'],

  <p class="lead">Everything a tester builds — projects, scripts, steps, elements, test data — is owned by <b>tyss-project</b> and stored in MongoDB.</p>
  <h4>Data model (hierarchy)</h4>
  <ol><li><b>Project</b> → modules / folders (tree)</li><li><b>Script</b> (test case) → ordered <b>steps</b> (NLP actions)</li><li><b>Elements</b> (locators) reused across scripts</li><li><b>Test data</b>, variables, files (files on S3)</li></ol>
  <h4>How it works</h4>
  <ol><li>UI / workbench saves a script → tyss-project validates and writes MongoDB.</li><li>It publishes events (project, tree, file-operation) to Kafka.</li><li><b>tyss-all-trees</b> keeps folder trees / counts in sync; integrations react to reference updates.</li><li>Recorder and bulk import enter via their own topics, so large imports don't block the API.</li></ol>
  <h4>Why this design</h4>
  <ul><li><b>MongoDB</b> fits nested, evolving documents (steps with varied params).</li><li>Tree maintenance split out → heavy hierarchy updates don't slow authoring.</li><li>Kafka fan-out keeps services decoupled.</li></ul>

  <p class="lead"><b>dashboard-execution</b> turns "run this suite" into executable work and tracks it until it finishes.</p>
  <h4>Lifecycle of a run</h4>
  <ol><li>Request arrives (UI, CI/API, or scheduler).</li><li>Validate licence / parallel-run quota (Feign → license-management).</li><li>Resolve suite → scripts, data sets, environment, machines.</li><li>Persist execution doc (status <code>Queued</code>).</li><li>Queue with <b>priority</b>; pick a free machine — client-systemconfig knows machine status from <code>client-updates</code> heartbeats.</li><li>Publish <code>execution-initialize-request</code> → client starts → <code>Running</code>.</li><li>Results update status → <code>Passed / Failed / Warning / Skipped / Aborted</code>.</li><li>Old runs are archived via <code>archive-details</code> → reports.</li></ol>

  <p class="lead"><b>execution-result</b> is the hot path: every step of every run passes through it.</p>
  <h4>How it works</h4>
  <ol><li>Client publishes step results to <code>response-topic</code>.</li><li>execution-result consumes with configurable concurrency (<code>config.concurrency.execution.result.*</code>).</li><li>Upserts results in MongoDB, rolls up script → suite status.</li><li>Emits events: <code>websocket.inbound</code> (live UI), analytics updates, <code>failure-notification</code>.</li><li>websocket-service pushes to the browser that is watching that run.</li></ol>
  <h4>Correctness</h4>
  <ul><li><b>Ordering</b>: key messages by <code>executionId</code> → one partition → in-order per run.</li><li><b>At-least-once</b>: commit offset after DB write; upsert by <code>executionId + stepId</code> makes duplicates harmless.</li><li><b>Back-pressure</b>: Kafka buffers spikes; scale pods up to the partition count.</li></ul>
  <div class="qa"><b>If asked: "multiple websocket pods — how does the right browser get the update?"</b>Each pod consumes <code>websocket.inbound</code> (e.g. a unique group per pod, or Redis pub/sub) and pushes only to sessions it holds.</div>`},

  <p class="lead">Today failures are published on <code>failure-notification</code>. A dedicated service would turn events into user-facing alerts.</p>
  <h4>Design</h4>
  <ol><li><b>Event-driven</b>: consume run-completed / failure events — producers don't change.</li><li><b>Enrich</b>: fetch project, owner, failure summary, report link.</li><li><b>Route</b> by user / project preferences (channel, severity, quiet hours).</li><li><b>Send</b> through a channel interface (Strategy pattern): Email, Slack, Teams, webhook, in-app.</li><li><b>Log</b> each send for audit and de-duplication.</li></ol>
  <h4>Reliability</h4>
  <ul><li>Idempotency key = <code>eventId + channel + recipient</code>.</li><li>Retry with exponential backoff → then dead-letter topic.</li><li>Rate-limit / digest to avoid alert storms (e.g. 200 failed scripts → 1 message).</li><li>Templates versioned in DB; secrets (SMTP, webhooks) in K8s Secrets.</li></ul>`},

  <p class="lead"><b>fireflink-reports</b> turns stored results + S3 artifacts into shareable HTML / PDF reports.</p>
  <h4>Generation pipeline</h4>
  <ol><li>User asks for a report (or a run finishes).</li><li>Fetch results (Feign → execution-result / MongoDB).</li><li>Assemble with HtmlReportService / PdfReportService; screenshots via ScreenshotService.</li><li>Store the file on S3 → return a <b>pre-signed URL</b> (time-limited, no public bucket).</li></ol>
  <h4>Why S3?</h4>
  <ul><li>Artifacts are large and binary — keep them out of MongoDB (16 MB doc limit).</li><li>Client uploads <b>directly</b> to S3 → backend never proxies big files.</li><li>Lifecycle rules: Standard → IA / Glacier → delete, controls cost.</li></ul>

  <p class="lead">Analytics is a <b>separate read model</b>: execution writes, analytics reshapes the same events for fast dashboards.</p>
  <h4>How it works</h4>
  <ol><li>Result events (cloud, manual, updates) arrive on analytics topics.</li><li>tyss-analytics transforms them into query-friendly documents.</li><li>Bulk-indexes into Elasticsearch.</li><li>Dashboards query ES aggregations: <code>date_histogram</code> for trends, <code>terms</code> for top failing scripts, <code>avg</code> durations.</li></ol>
  <h4>Typical widgets</h4>
  <ul><li>Pass / fail % by suite, project, environment.</li><li>Flaky tests (status flips across runs).</li><li>Execution time trends, slowest steps.</li><li>Defects raised per run.</li></ul>
  <h4>Why not only MongoDB?</h4>
  <p>Aggregations over millions of step results are much faster in ES, and heavy analytics queries don't load the operational DB (CQRS-style split).</p>`},

  <p class="lead">MongoDB stays the source of truth; Elasticsearch is a <b>derived index</b> built for searching and filtering.</p>
  <h4>Write path</h4>
  <ol><li>Service saves to MongoDB.</li><li>Publishes a change event on the <code>elastic_search</code> topic.</li><li>Consumer maps it and bulk-indexes into ES (~1 s until searchable).</li></ol>
  <h4>Read path</h4>
  <ol><li>UI sends text + filters (project, status, date, tags).</li><li>API builds a <code>bool</code> query: <code>must</code> = text match, <code>filter</code> = exact fields (cached, no scoring).</li><li>Aggregations return facet counts for the filter sidebar.</li><li>Paginate with <code>search_after</code> rather than deep <code>from/size</code>.</li></ol>
  <h4>Key ideas</h4>
  <ul><li>Mapping: <code>keyword</code> for exact filters, <code>text</code> for full-text.</li><li>Eventually consistent — a fresh write may take ~1 s to appear.</li><li>If ES is lost: reindex from MongoDB / replay Kafka.</li></ul>`},

{id:'kafka',kicker:'Infra',title:'Kafka setup',dia:{W:1620,H:720,nodes:[
  {id:'prod',k:'group',x:40,y:80,w:280,h:330,t:'Producers',chips:[[null,'execution-client',''],[null,'dashboard-execution',''],[null,'execution-result',''],[null,'tyss-project','']]},

  {id:'dur',k:'ext',x:380,y:580,w:870,h:100,t:'Durability settings (recommended)',s:'RF = 3 · min.insync.replicas = 2 · acks = all · idempotent producer',ic:'gear'}
 ],edges:[
  {f:'prod',t:'b1',pts:[[320,164],[380,164]]},
  {f:'b1',t:'b2',pts:[[630,164],[690,164]],d:1},{f:'b2',t:'b3',pts:[[940,224],[1000,224]],d:1},
  {f:'b3',t:'cg1',pts:[[1250,284],[1320,284]],l:'poll',lp:[1285,262]},
  {f:'b3',t:'cg2',pts:[[1250,350],[1285,350],[1285,540],[1320,540]]}
 ]},panel:`
  <p class="lead">Kafka is the backbone: <b>30+ <code>@KafkaListener</code>s</b>, each with its own consumer group, container factory and concurrency (<code>config.concurrency.*</code>).</p>
  <h4>Core concepts</h4>
  <ul><li><b>Topic → partitions</b>: a partition is the unit of ordering and parallelism.</li><li><b>Replication</b>: each partition has 1 leader + followers on other brokers (RF 3). The in-sync replicas (ISR) take over if the leader dies.</li><li><b>Producer key</b> → partition. Key = <code>executionId</code> keeps one run's events in order.</li><li><b>Consumer group</b>: each partition is read by one consumer in the group. Different groups read the same topic independently (execution-result vs analytics).</li><li><b>Offsets</b> committed after processing → at-least-once.</li><li><b>Rebalance</b> when pods scale or crash.</li></ul>
  <h4>Failure handling</h4>
  <ul><li>Broker down → follower in ISR becomes leader; <code>acks=all</code> + min ISR 2 means no acknowledged message is lost.</li><li>Consumer down → partitions reassigned.</li><li>Poison message → retry, then dead-letter topic (<code>DefaultErrorHandler</code> + <code>DeadLetterPublishingRecoverer</code>).</li></ul>
  <h4>Sizing rule</h4>
  <p>Partitions ≥ pods × listener concurrency; extra consumers beyond that sit idle.</p>
  <p><span class="verify">verify</span> broker count / RF / partitions in your cluster.</p>`},

{id:'mongo',kicker:'Infra',title:'MongoDB setup',dia:{W:1500,H:780,nodes:[

 ],edges:[
  {f:'app',t:'pri',l:'writes · w: majority'},{f:'app',t:'s1',l:'reads (secondaryPreferred)',d:1},
  {f:'pri',t:'s1',l:'oplog'},{f:'pri',t:'s2',l:'oplog'},{f:'s1',t:'s2',l:'heartbeat · election',d:1,b:1},
  {f:'ms',t:'cfg'},{f:'ms',t:'sh',pts:[[1440,165],[1458,165],[1458,520],[1440,520]]}
 ]},panel:`
  <p class="lead">MongoDB is the <b>system of record</b>. Run it as a <b>replica set</b>; sharding is the next step when data or write volume outgrows one primary.</p>
  <h4>Replica set</h4>
  <ul><li>1 primary takes all writes and records them in the <b>oplog</b>.</li><li>Secondaries replay the oplog asynchronously.</li><li>Primary fails → secondaries hold an <b>election</b> (seconds) → new primary; drivers retry writes automatically.</li><li>Odd number of voting members (3 / 5) so a majority exists.</li></ul>
  <h4>Consistency knobs</h4>
  <ul><li><code>w: majority</code> — survives failover.</li><li><code>readPreference</code>: primary for fresh data, secondary for reports / analytics reads.</li><li>Multi-document transactions are available on replica sets (use sparingly).</li></ul>
  <h4>Modelling tips</h4>
  <ul><li>Compound indexes, e.g. <code>{projectId, status, createdAt}</code>.</li><li>16 MB document limit → store results per script / step, binaries on S3.</li><li>TTL indexes for temporary data; scope every query by tenant / project.</li></ul>
  <p><span class="verify">verify</span> server version and topology.</p>`},

{id:'es',kicker:'Infra',title:'Elasticsearch cluster',dia:{W:1440,H:760,nodes:[

  {id:'n1',k:'group',x:390,y:80,w:300,h:330,t:'Node 1 · master/data',note:'index: executions',chips:[[null,'P0 · primary','','lead'],[null,'R1 · replica','']]},
  {id:'n2',k:'group',x:730,y:80,w:300,h:330,t:'Node 2 · master/data',note:'index: executions',chips:[[null,'P1 · primary','','lead'],[null,'R2 · replica','']]},
  {id:'n3',k:'group',x:1070,y:80,w:300,h:330,t:'Node 3 · master/data',note:'index: executions',chips:[[null,'P2 · primary','','lead'],[null,'R0 · replica','']]},
  {id:'ilm',k:'ext',x:390,y:470,w:980,h:110,t:'Index lifecycle',s:'rollover by size / age · hot → warm → delete · aliases for zero-downtime reindex',ic:'gear'},
  {id:'nrt',k:'ext',x:390,y:620,w:980,h:100,t:'Near-real-time',s:'refresh every 1 s → a doc is searchable ~1 s after indexing (eventually consistent with MongoDB)',ic:'clock'}
 ],edges:[
  {f:'an',t:'n1',l:'index / query'},{f:'n1',t:'n2',pts:[[690,300],[730,300]],d:1},{f:'n2',t:'n3',pts:[[1030,300],[1070,300]],d:1}
 ]},panel:`
  <p class="lead">ES powers search, filters and analytics. Data is split into <b>shards</b>, and every shard has a <b>replica</b> on another node.</p>
  <h4>Concepts</h4>
  <ul><li><b>Index</b> ≈ collection; split into primary shards (P0–P2).</li><li><b>Replica</b> shard (R) lives on a different node → survives a node failure and serves reads.</li><li>Any node can coordinate a query: scatter to shards → gather → merge.</li><li><b>Inverted index</b>: term → list of docs; this is why full-text search is fast.</li><li>Node roles: master-eligible (cluster state), data, ingest.</li></ul>
  <h4>Operational must-knows</h4>
  <ul><li>Shard count is fixed at index creation → plan it, or use rollover + aliases.</li><li>Mapping changes need a reindex → read and write through an alias.</li><li>Cluster health: green (all replicas) / yellow (replica missing) / red (primary missing).</li></ul>
  <p>Repo: <code>elasticsearch</code> 7.17.10 + Java client 8.11.3. <span class="verify">verify</span> server version.</p>`},

  <p class="lead">Keycloak is the <b>identity provider</b>; services only <b>verify</b> tokens, they never store passwords.</p>
  <h4>Flow</h4>

const INTERVIEW = `
<p class="sub">Start with the 2-minute story, then go wherever the interviewer points. Each Q links back to a slide.</p>
<div class="pitch">
<b>FireFlink</b> is a codeless test-automation platform for web, mobile, API and accessibility testing. The backend is about <b>23 Spring Boot 4 / Java 25 microservices</b> in Docker on <b>Kubernetes</b>.<br><br>
Users <b>author</b> tests in the web UI. tyss-project and all-trees store scripts, steps and elements in <b>MongoDB</b>. When a suite runs, <b>dashboard-execution</b> checks the licence, queues the run with priority, picks a machine and publishes the request to <b>Kafka</b>.<br><br>
The <b>execution client</b> — a Spring Boot JAR on the customer's machine or our cloud — consumes it. It runs Selenium / Appium / API steps locally, uploads screenshots and videos to <b>S3</b>, and streams step results back through Kafka.<br><br>
<b>execution-result</b> persists them and fans out events: websocket-service pushes live status to the browser, analytics indexes <b>Elasticsearch</b> for dashboards and search, and reports builds HTML / PDF reports.<br><br>
Identity is <b>Keycloak</b> with JWTs validated in each service. Kafka decouples everything, so a slow consumer never blocks execution, and each service scales independently.
</div>
<h4>Likely questions</h4>
<details><summary>Why microservices and not a monolith?</summary>Different parts scale differently: the results path takes thousands of messages per run, authoring is low-traffic. Teams can deploy independently, and a failure in reports doesn't stop execution. The cost is operations and eventual consistency, which Kafka and idempotent consumers manage.</details>
<details><summary>Why Kafka instead of REST between services?</summary>Execution produces bursts of events with several consumers (results, live UI, analytics, notifications). Kafka buffers spikes, lets each consumer group read independently, keeps per-run ordering with a key, and replays after failures. REST (Feign) is kept for synchronous queries.</details>
<details><summary>How can the client run inside a customer's network?</summary>It only makes outbound connections (Kafka consumer + HTTPS), so no inbound firewall port is needed. It registers, sends heartbeats on client-updates, and pulls work assigned to its machine.</details>
<details><summary>How do you avoid losing or duplicating results?</summary>Producer acks=all with replication 3 and min ISR 2. Consumers commit offsets after the DB write (at-least-once). Writes are upserts keyed by executionId + stepId, so redelivery is harmless. Poison messages go to a dead-letter topic after retries.</details>
<details><summary>How is ordering guaranteed for a run?</summary>Messages are keyed by executionId, so they land on one partition, and Kafka preserves order within a partition.</details>
<details><summary>Results volume spikes — how do you scale?</summary>Add execution-result pods (HPA on consumer lag) up to the partition count, tune listener concurrency, batch writes to Mongo. If that's still not enough, increase partitions.</details>
<details><summary>Why MongoDB?</summary>Scripts and results are nested, variable-shape documents whose schema evolves. Mongo stores them naturally, handles high write volume, and gives HA through replica sets with a path to sharding.</details>
<details><summary>Why Elasticsearch as well as Mongo?</summary>Full-text search, facet counts and large aggregations are what ES is built for. It is a derived read model (CQRS-style) that can be rebuilt from Mongo, so it never becomes the source of truth.</details>
<details><summary>What happens if a Mongo primary or Kafka broker dies?</summary>Mongo: secondaries elect a new primary within seconds and drivers retry writes. Kafka: an in-sync follower becomes partition leader, and producers / consumers reconnect automatically.</details>
<details><summary>How does authentication work across services?</summary>Keycloak issues a signed JWT. Each service validates it locally with cached JWKS keys (signature, expiry, issuer) and uses roles for authorisation. Service-to-service calls use client credentials or relay the token.</details>
<details><summary>How do live updates reach the browser?</summary>execution-result publishes websocket.inbound; websocket-service consumes it and pushes over WebSocket to the sessions watching that run.</details>
<details><summary>How would you add notifications?</summary>A new consumer of failure / completion events that enriches each event, routes it by user preference, and sends through pluggable channels. It uses idempotency keys, retries with backoff and a DLT, and digests events to avoid alert storms. See the Notification slide.</details>
<details><summary>What would you improve?</summary>End-to-end tracing across Kafka hops, consumer-lag-based autoscaling, async report generation for very large runs, S3 lifecycle tiers, and a contract/schema registry for Kafka events.</details>`;

function clip(r,to){const [cx,cy]=ctr(r),dx=to[0]-cx,dy=to[1]-cy;if(!dx&&!dy)return[cx,cy];const t=Math.min(dx?(r.w/2)/Math.abs(dx):1e9,dy?(r.h/2)/Math.abs(dy):1e9);return[cx+dx*t,cy+dy*t];}

function buildDiagram(host,spec,key,opts){

    if(n.chip){txt(g,n.x+16,n.y+n.h/2+5,n.t,'tc');if(n.s)txt(g,n.x+n.w-14,n.y+n.h/2+5,n.s,'t2','end');return;}
    const lines=n.s?n.s.split('\n'):[];let x0=n.x+16;
    if(n.ic){const sz=Math.min(46,n.h-28);useIc(g,n.ic,n.x+16,n.y+(n.h-sz)/2,sz);x0=n.x+16+sz+14;}

  spec.nodes.forEach(n=>{

    (n.chips||[]).forEach((c,i)=>{const id=c[0]||(n.id+'-c'+i);
      drawNode({id,k:c[3]==='prop'?'prop':c[3]==='lead'?'lead':'chip',chip:1,x:n.x+20,y:n.y+60+i*60,w:n.w-40,h:48,t:c[1],s:c[2],parent:n.id,info:(SVC[c[1]]||[])[1]},gN);});

    const g=el('g',{class:'eg'},gE);

  function focus(r,pad){pad=pad||140;const ns=Math.min(W/(r.w+pad*2),H/(r.h+pad*2),4);animateTo(ns,W/2-(r.x+r.w/2)*ns,H/2-(r.y+r.h/2)*ns);}
  svg.addEventListener('wheel',ev=>{ev.preventDefault();const p=pt(ev);zoomAt(Math.exp(-ev.deltaY*.0015),p.x,p.y);},{passive:false});

  svg.addEventListener('pointermove',ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,ev);
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);

/* ============================== DECK ============================== */
const deck=document.getElementById('deck'),menu=document.getElementById('menu');
const pad2=i=>String(i+1).padStart(2,'0');
let cur=0,step=0,timer=null,bigApi=null;
const SECTIONS={0:'Overview',2:'Flows',10:'Infrastructure',15:'Wrap-up'};

SL.forEach((s,i)=>{
  const sec=document.createElement('section');sec.className='slide'+(s.html?' htmlslide':'');sec.dataset.i=i;
  if(s.html){
    const body=s.html==='CATALOG'?catalogHTML():s.html==='CROSS'?CROSS:INTERVIEW;
    sec.innerHTML=`<div class="htmlwrap"><div class="kicker">${pad2(i)} · ${s.kicker}</div><h1>${s.title}</h1>${body}</div>`;
  }else{
    sec.innerHTML=`<div class="stage"><div class="dia"></div><div class="hint">Scroll / pinch to zoom · drag to pan · double-click to focus${i===0?' · click a box for details':''}</div>
      <div class="ctrl"><button class="ib" data-z="in" title="Zoom in (+)">+</button><button class="ib" data-z="out" title="Zoom out (−)">−</button><button class="ib" data-z="fit" title="Fit (0)">⤢</button><button class="ib" data-z="panel" title="Toggle side panel (T)">◧</button></div>
      ${i===0?`<div class="player"><button class="ib" id="pPrev" title="Previous step">⏮</button><button class="ib" id="pPlay" title="Play (P)">▶</button><button class="ib" id="pNext" title="Next step">⏭</button><div class="cap" id="pCap"></div><button class="ib" id="pClr" title="Clear">✕</button></div>`:''}
      </div><aside class="panel"><div class="kicker">${pad2(i)} · ${s.kicker}</div><h2>${s.title}</h2>${s.panel}</aside>`;
    deck.appendChild(sec);
    const api=buildDiagram(sec.querySelector('.dia'),s.dia,s.id,i===0?{onSelect:showSel}:{onSelect:(id,r)=>{}});
    sec._api=api;
    sec.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')api.zoomIn();else if(z==='out')api.zoomOut();else if(z==='fit')api.fit();else sec.classList.toggle('collapsed');});
    if(i===0)bigApi=api;
  }
  if(!sec.parentNode)deck.appendChild(sec);
  if(SECTIONS[i])menu.insertAdjacentHTML('beforeend',`<div class="sec">${SECTIONS[i]}</div>`);
  menu.insertAdjacentHTML('beforeend',`<a href="#${i+1}" data-i="${i}"><b>${pad2(i)}</b><span>${s.title}</span></a>`);
});

/* big-picture panel */
const DEFAULT_SEL=`<div class="sel"><h3>60-second version</h3><p>Users author tests in the web UI; scripts live in <b>MongoDB</b>. A run request goes to <b>dashboard-execution</b>, which queues it and publishes to <b>Kafka</b>. The <b>execution client</b> on the user's machine runs the steps, sends artifacts to <b>S3</b> and results back via Kafka. <b>execution-result</b> stores them and fans out to live UI (WebSocket), analytics (<b>Elasticsearch</b>) and reports. <b>Keycloak</b> secures everything; all of it runs as Docker containers on <b>Kubernetes</b>.</p><p style="color:var(--muted);font-size:12.5px">Click any box on the diagram for details.</p></div>`;
function showSel(id,r){
  const box=document.getElementById('sel');
  if(!r||r.n.k==='zone'){box.innerHTML=DEFAULT_SEL;bigApi&&bigApi.select(null);return;}
  const n=r.n;bigApi.select(id);
  const parent=n.parent?BIG.nodes.find(x=>x.id===n.parent):null;
  const go=n.go||(parent&&parent.go);
  const sub=n.chip?(SVC[n.t]?('port '+SVC[n.t][0]):''):(n.s||'').replace(/\n/g,' · ');
  const info=n.info||(n.k==='group'?'Group of '+(n.chips||[]).length+' services: '+n.chips.map(c=>c[1]).join(', ')+'.':'');
  box.innerHTML=`<div class="sel"><h3>${n.t}</h3><p style="color:var(--muted);font-size:12.5px">${sub}</p><p>${info}</p>${go?`<button class="go" data-go="${go}">Deep dive →</button>`:''} <button class="go" data-reset style="border-color:var(--line);color:var(--muted)">Reset</button></div>`;
}
document.getElementById('sel').innerHTML=DEFAULT_SEL;
document.getElementById('sel').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){goTo(SL.findIndex(s=>s.id===g.dataset.go));}if(e.target.closest('[data-reset]'))showSel(null);});
const stepList=document.getElementById('stepList');
stepList.innerHTML=STEPS.map((s,i)=>`<li data-s="${i+1}"><b>${s[0]}</b> — ${s[1]}</li>`).join('');
stepList.onclick=e=>{const li=e.target.closest('li');if(li){stopPlay();setStep(+li.dataset.s);}};
function setStep(n){step=n;bigApi.setStep(n);
  document.getElementById('pCap').innerHTML=n?`<span class="badge">${n}</span><b>${STEPS[n-1][0]}</b> — ${STEPS[n-1][1]}`:'<span style="color:var(--muted)">▶ Play the life of a test run, step by step (11 steps)</span>';
  stepList.querySelectorAll('li').forEach(li=>li.classList.toggle('cur',+li.dataset.s===n));}
function stopPlay(){clearInterval(timer);timer=null;document.getElementById('pPlay').textContent='▶';}
function togglePlay(){if(timer){stopPlay();return;}if(step>=STEPS.length||step===0)setStep(1);document.getElementById('pPlay').textContent='⏸';
  timer=setInterval(()=>{if(step>=STEPS.length){stopPlay();return;}setStep(step+1);},3600);}
document.getElementById('pPlay').onclick=togglePlay;
document.getElementById('pNext').onclick=()=>{stopPlay();setStep(Math.min(STEPS.length,step+1));};
document.getElementById('pPrev').onclick=()=>{stopPlay();setStep(Math.max(1,step-1));};
document.getElementById('pClr').onclick=()=>{stopPlay();setStep(0);};
setStep(0);

/* navigation */
function goTo(i){if(i<0||i>=SL.length)return;cur=i;
  deck.querySelectorAll('.slide').forEach(s=>s.classList.toggle('active',+s.dataset.i===i));
  document.getElementById('slideTitle').textContent=SL[i].title;
  document.getElementById('count').textContent=`${i+1} / ${SL.length}`;
  menu.querySelectorAll('a').forEach(a=>a.classList.toggle('cur',+a.dataset.i===i));
  menu.classList.remove('open');
  if(location.hash!=='#'+(i+1))history.replaceState(null,'','#'+(i+1));
}
document.getElementById('prev').onclick=()=>goTo(cur-1);
document.getElementById('next').onclick=()=>goTo(cur+1);
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');
menu.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();goTo(+a.dataset.i);}});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  const sec=deck.querySelector('.slide.active'),api=sec&&sec._api;
  if(e.key==='ArrowRight'||e.key==='PageDown')goTo(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')goTo(cur-1);
  else if(e.key==='Home')goTo(0);else if(e.key==='End')goTo(SL.length-1);
  else if(e.key==='m'||e.key==='M')menu.classList.toggle('open');
  else if(e.key==='Escape')menu.classList.remove('open');
  else if(api&&(e.key==='+'||e.key==='='))api.zoomIn();
  else if(api&&(e.key==='-'||e.key==='_'))api.zoomOut();
  else if(api&&e.key==='0')api.fit();
  else if(api&&(e.key==='t'||e.key==='T'))sec.classList.toggle('collapsed');
  else if(cur===0&&(e.key==='p'||e.key==='P'))togglePlay();
});
const h=parseInt(location.hash.slice(1),10);goTo(h>=1&&h<=SL.length?h-1:0);
</script>
</body>
</html>
