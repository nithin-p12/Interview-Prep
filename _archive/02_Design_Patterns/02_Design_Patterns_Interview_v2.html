<header class="top"><a class="home" href="../../00_Index.html">🏠 Interview Prep · NITHIN P</a><h1>Design Patterns — Interview Guide</h1><p>All examples use one running scenario: FireFlink suite-execution notifications (Email, Slack, Teams). Each pattern: problem → code without vs with the pattern → advantages, trade-offs, interview questions.</p></header>
<nav class="nav"><div class="in" id="nav"></div></nav>

<script>
const COL={blue:{bg:'#EEF5FF',bd:'#3B82F6',dk:'#1D4ED8',lt:'#BFDBFE'},purple:{bg:'#F7F0FF',bd:'#9333EA',dk:'#7E22CE',lt:'#E9D5FF'},
 orange:{bg:'#FFF6EC',bd:'#F97316',dk:'#C2410C',lt:'#FED7AA'},red:{bg:'#FFF1F1',bd:'#EF4444',dk:'#B91C1C',lt:'#FECACA'},green:{bg:'#EFFCF3',bd:'#22C55E',dk:'#15803D',lt:'#BBF7D0'}};
// ---------- highlighter ----------
const ESC=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW='public|private|protected|static|final|class|interface|enum|record|extends|implements|new|return|if|else|try|catch|throw|throws|void|int|double|long|boolean|var|this|super|for|switch|case|default|abstract|null|true|false';
const RE={java:new RegExp(String.raw`(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@\w+)|\b(${KW})\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d[\d_.]*[LlFfDd]?)\b|([a-z_]\w*)(?=\()`,'gm'),
 yaml:/(#.*$)|^(\s*-?\s*[\w.\-]+)(?=:)|("(?:[^"\\]|\\.)*")|\b(true|false)\b|\b(\d[\w.]*)\b/gm,text:/(#.*$)/gm};
const CLS={java:['c','s','a','k','t','nu','f'],yaml:['c','y','s','k','nu'],text:['c']};
function hl(src,lang){const re=RE[lang],cls=CLS[lang];let out='',last=0,m;re.lastIndex=0;
 while((m=re.exec(src))){if(m[0]===''){re.lastIndex++;continue;}out+=ESC(src.slice(last,m.index));const g=m.slice(1).findIndex(x=>x!==undefined);
  let c=cls[g];if(c==='c'){if(m[0].includes('❌'))c='cb';else if(m[0].includes('✅'))c='cg';}
  out+=`<span class="${c}">${ESC(m[0])}</span>`;last=m.index+m[0].length;}
 return out+ESC(src.slice(last));}
// On normal screens: tighten comment padding; long lines get the comment on its own line above.
const WIDE=new URLSearchParams(location.search).has('png')||window.innerWidth>=1500;
function tidy(src){if(WIDE)return src;return src.split('\n').map(l=>{const m=l.match(/^(\s*)(.*?\S)(\s+)(\/\/ .*|# .*)$/);if(!m)return l;const s=m[1]+m[2]+'  '+m[4];return s.length>64?m[1]+m[4]+'\n'+m[1]+m[2]:s;}).join('\n');}
const mac=(file,lang,src)=>`<div class="mac"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="fn">${file}</div></div><pre>${hl(tidy(src.replace(/^\n|\n\s*$/g,'')),lang)}</pre></div>`;

// ---------- content ----------
// Running example shared by every pattern (simplified FireFlink suite-execution notifications)
const RUNEX=['RunningExample.java','java',`
// Simplified from FireFlink suite-execution notifications
// (NotificationDetails -> EmailData / SlackData / MSTeamsData)
public record ExecutionResult(String runId, String suiteId, String suiteName,
                              String status, int passed, int failed) {}

public interface Notifier {
    void send(ExecutionResult result);
}

@Component("EMAIL") class EmailNotifier implements Notifier { ... } // SMTP
@Component("SLACK") class SlackNotifier implements Notifier { ... } // webhook
@Component("TEAMS") class TeamsNotifier implements Notifier { ... } // webhook`];

const PAGES=[
{id:'creational',n:1,col:'blue',title:'Creational Patterns',lede:'How objects get created — control instance count, hide concrete classes, build complex objects cleanly.',
 must:[
 {name:'Singleton',
  problem:'Every <code>EmailNotifier.send()</code> creates its own template loader, which reads <b>all email templates from MongoDB</b>. After a big regression run, thousands of emails mean thousands of identical DB reads and copies in memory.',
  bad:['EmailNotifier.java','java',`
class EmailNotifier implements Notifier {
    public void send(ExecutionResult r) {
        EmailTemplates t = new EmailTemplates(); // ❌ new copy per email
        mailSender.send(t.render("run-completed", r));
    }
}

class EmailTemplates {
    private final Map<String, String> templates;

    EmailTemplates() {
        templates = loadAllFromDb();            // ❌ DB read every time
    }
}
// ❌ 5,000 emails after a big run = 5,000 identical DB reads

// ❌ naive lazy init is NOT thread-safe:
// if (instance == null) instance = new EmailTemplates();
// two threads can both see null and create two copies`],
  good:[['EmailTemplates.java','java',`
public final class EmailTemplates {
    private final Map<String, String> templates;

    private EmailTemplates() { templates = loadAllFromDb(); } // ✅ once

    private static class Holder {              // ✅ loaded on first use
        static final EmailTemplates INSTANCE = new EmailTemplates();
    }
    public static EmailTemplates get() {       // ✅ thread-safe, no locks
        return Holder.INSTANCE;
    }
    public String render(String name, ExecutionResult r) { ... }
}

class EmailNotifier implements Notifier {
    public void send(ExecutionResult r) {
        String html = EmailTemplates.get().render("run-completed", r);
        mailSender.send(html);                 // ✅ shared, no DB read
    }
}
// Spring way: make EmailTemplates a @Component -> singleton bean`]],
  adv:['One shared instance → one DB read, less memory','Expensive setup runs only once','Holder idiom / enum give lazy, thread-safe creation without locks'],
  cons:['Cached templates go stale when someone edits them — add a refresh / evict','Global state hides dependencies — in Spring prefer an injected bean'],
  qa:[['How do you make a Singleton thread-safe?','Holder idiom or enum — JVM class loading is thread-safe. Or double-checked locking with a <code>volatile</code> field.'],
      ['How can a Singleton be broken?','Reflection, serialization (fix: <code>readResolve()</code>), cloning, or multiple class loaders. An enum blocks reflection and serialization.'],
      ['Spring singleton vs GoF singleton?','Spring: one per ApplicationContext. GoF: one per class loader. Spring beans must be stateless or thread-safe.']]},
 {name:'Factory Method',
  problem:'Each suite has saved integrations — an email group, a Slack webhook, a Teams webhook. Code that builds the right notifier with <code>new</code> + if/else is <b>copied into the execution, scheduler and manual "send report" flows</b>.',
  bad:['ExecutionService.java','java',`
// in ExecutionService ... and again in Scheduler, ManualReport
for (ChannelConfig cfg : suite.channels()) {
    Notifier n;
    if (cfg.type().equals("EMAIL")) {
        n = new EmailNotifier(cfg.recipients());
    } else if (cfg.type().equals("SLACK")) {
        n = new SlackNotifier(cfg.webhookUrl());
    } else {
        n = new TeamsNotifier(cfg.webhookUrl());
    }
    n.send(result);
}
// ❌ same if/else copied in 3 flows
// ❌ adding WhatsApp = edit all 3 (easy to miss one)
// ❌ callers know every class and its constructor arguments`],
  good:[['NotifierFactory.java','java',`
public final class NotifierFactory {

    public static Notifier create(ChannelConfig cfg) {   // ✅ ONE place
        return switch (cfg.type()) {
            case "EMAIL" -> new EmailNotifier(cfg.recipients());
            case "SLACK" -> new SlackNotifier(cfg.webhookUrl());
            case "TEAMS" -> new TeamsNotifier(cfg.webhookUrl());
            default -> throw new IllegalArgumentException(cfg.type());
        };
    }
}

// execution, scheduler and manual report all do just this:
for (ChannelConfig cfg : suite.channels()) {
    NotifierFactory.create(cfg).send(result);  // ✅ only the interface
}
// ✅ WhatsApp = one new case here, callers untouched`]],
  adv:['Creation logic lives in one place','Callers depend only on <code>Notifier</code>','New channel = change one factory; easy to mock in tests'],
  cons:['Extra indirection for very simple cases','The switch itself still needs editing for each new type'],
  qa:[['Simple Factory vs Factory Method vs Abstract Factory?','Simple factory: one method with a switch (above). Factory Method: subclasses override a create method. Abstract Factory: creates a family of related objects.'],
      ['Factory vs Strategy — aren\'t they the same here?','Factory <i>creates</i> objects (here from saved config). Strategy <i>picks</i> among ready-made behaviours at runtime — see the Strategy card.']]},
 {name:'Builder',
  problem:'A notification request has many optional parts — PDF / HTML / test-data attachments, recipients, start / end / fail flags (just like <code>NotificationDetails</code>). An 8-argument constructor is unreadable; setters allow a <b>half-built request</b>.',
  bad:['ReportService.java','java',`
// ❌ which boolean is which?
NotificationRequest req = new NotificationRequest(
        runId, "Smoke Suite", true, false, true, null, recipients, false);

// ❌ setters: mutable, and can be sent half-built
NotificationRequest r2 = new NotificationRequest();
r2.setRunId(runId);
r2.setPdfAttachment(true);
// forgot setRecipients() -> email goes to nobody, no error

// ❌ every new option = another constructor overload`],
  good:[['NotificationRequest.java','java',`
NotificationRequest req = NotificationRequest.builder()
        .runId(runId)                         // ✅ every value is named
        .suiteName("Smoke Suite")
        .pdfAttachment(true)
        .htmlAttachment(true)
        .recipient("qa-team@company.com")
        .build();                             // ✅ complete & immutable

// Lombok writes the builder (NotificationDetails uses @Builder too)
@Builder
@Getter
public class NotificationRequest {
    @NonNull private final String runId;      // ✅ null check in build()
    private final String suiteName;
    private final boolean pdfAttachment;
    private final boolean htmlAttachment;
    @Singular private final List<String> recipients;
}`]],
  adv:['Readable: every value is named','Result is immutable and never half-built','Optional fields are easy to add'],
  cons:['Boilerplate if hand-written (Lombok removes it)','Overkill for 2–3 fields — a <code>record</code> is enough'],
  qa:[['Why Builder instead of setters?','Setters leave the object mutable and possibly incomplete. Builder returns a complete, immutable object in one step.'],
      ['What does Lombok @Builder generate?','A static inner Builder class with one fluent method per field and a <code>build()</code> that calls the all-args constructor.'],
      ['Builder vs Factory?','Factory decides <i>which</i> class to create. Builder decides <i>how</i> to assemble one complex object.']]}
 ],
 good:[
 {name:'Abstract Factory',why:'Creates a matching <b>family</b> of objects — e.g. a channel\'s formatter + sender — so they always fit together.',
  code:['ChannelKit.java','java',`
interface ChannelKit {
    MessageFormatter formatter();
    MessageSender sender();
}
ChannelKit kit = new SlackKit();   // or TeamsKit, EmailKit
kit.sender().send(kit.formatter().format(result));`],qa:[['When over Factory Method?','When several related objects must always be created together and stay consistent.']]},
 {name:'Prototype',why:'Creates new objects by <b>copying</b> a pre-configured one — e.g. new suite settings copied from a project default.',
  code:['Settings.java','java',`
NotificationSettings s = new NotificationSettings(projectDefaults);
s.setSlackEnabled(true);   // tweak the copy only`],qa:[['Shallow vs deep copy?','Shallow copies references (shared lists!); deep copies the whole object graph.'],['Is Spring "prototype" scope this?','No — it just creates a new bean per lookup.']]}
 ]},

{id:'structural',n:2,col:'purple',title:'Structural Patterns',lede:'How classes and objects are wrapped and combined — without changing existing code.',
 must:[
 {name:'Adapter',
  problem:'We want <b>WhatsApp</b> next to Email, Slack and Teams. The WhatsApp Business client has its own API — different method, phone format, template names — and does not implement our <code>Notifier</code>.',
  bad:['NotificationService.java','java',`
public void notify(ExecutionResult r, List<String> channels) {
    for (String ch : channels) {
        if (ch.equals("WHATSAPP")) {
            // ❌ vendor-specific code inside our service
            whatsAppClient.sendTemplateMessage(
                    "+91" + user.phone(),          // ❌ format rules here
                    "run_completed",
                    Map.of("suite", r.suiteName(), "status", r.status()));
        } else {
            notifiers.get(ch).send(r);
        }
    }
}
// ❌ every caller that wants WhatsApp repeats this
// ❌ change WhatsApp provider = edit all callers`],
  good:[['WhatsAppNotifier.java','java',`
// Third-party SDK — we can't change it
class WhatsAppClient {
    void sendTemplateMessage(String phoneE164, String template,
                             Map<String, String> params) { ... }
}

@Component("WHATSAPP")
class WhatsAppNotifier implements Notifier {      // ✅ the adapter
    private final WhatsAppClient client;
    private final String phone;                   // constructor omitted

    public void send(ExecutionResult r) {         // ✅ OUR interface
        client.sendTemplateMessage(phone, "run_completed",
                Map.of("suite", r.suiteName(), "status", r.status()));
    }
}

// ✅ callers treat it like Email / Slack / Teams
notifiers.get("WHATSAPP").send(result);`]],
  adv:['Use a third-party API without changing it','Vendor details live in one class','Swap providers or mock in tests easily'],
  cons:['One more class to maintain','Can hide the wrapped API\'s cost or limits (WhatsApp is paid per message)'],
  qa:[['Adapter vs Facade?','Adapter <i>converts</i> one interface into another (WhatsApp → Notifier). Facade <i>simplifies</i> many classes behind one entry point.'],
      ['Object adapter vs class adapter?','Object adapter holds the client (composition, shown here). Class adapter extends it — limited in Java (single inheritance).']]},
 {name:'Decorator',
  problem:'We want <b>logging and an audit trail</b> for notifications — sometimes for every channel, sometimes only Slack. Putting it inside each notifier duplicates code; subclasses like <code>AuditedLoggedSlackNotifier</code> explode.',
  bad:['SlackNotifier.java','java',`
class SlackNotifier implements Notifier {
    public void send(ExecutionResult r) {
        log.info("Sending {} to Slack", r.runId());     // ❌ logging copied
        webhook.post(toSlackBlocks(r));
        auditRepo.save(new Audit("SLACK", r.runId()));  // ❌ audit copied
    }
}

class TeamsNotifier implements Notifier {
    public void send(ExecutionResult r) {
        log.info("Sending {} to Teams", r.runId());     // ❌ same again
        webhook.post(toAdaptiveCard(r));
        auditRepo.save(new Audit("TEAMS", r.runId()));  // ❌ and again
    }
}
// ❌ or subclasses: LoggedSlackNotifier, AuditedLoggedSlackNotifier ...`],
  good:[['NotifierDecorators.java','java',`
class LoggingNotifier implements Notifier {
    private final Notifier inner;
    LoggingNotifier(Notifier inner) { this.inner = inner; }

    public void send(ExecutionResult r) {
        log.info("Sending run {}", r.runId());
        inner.send(r);                        // ✅ add behaviour, delegate
    }
}

class AuditNotifier implements Notifier {
    private final Notifier inner;
    AuditNotifier(Notifier inner) { this.inner = inner; }

    public void send(ExecutionResult r) {
        inner.send(r);
        auditRepo.save(new Audit(r.runId())); // ✅ audit after success
    }
}

// ✅ chain at runtime, in any combination
Notifier slack = new AuditNotifier(new LoggingNotifier(new SlackNotifier()));
Notifier teams = new LoggingNotifier(new TeamsNotifier());  // log only`]],
  adv:['Combine features at runtime per channel','Each feature is one small class','Add new wrappers (Retry, Metrics…) without touching the notifiers'],
  cons:['Order matters — Audit outside Logging behaves differently','Many small wrapper objects; deeper stack traces'],
  qa:[['Decorator vs inheritance?','Inheritance fixes the combination at compile time and multiplies subclasses. Decorators combine freely at runtime.'],
      ['Decorator vs Proxy?','Same wrapper shape. Decorator <i>adds</i> features and you build the chain; a Proxy <i>controls access</i> and is usually invisible (Spring AOP).']]},
 {name:'Proxy',
  problem:'Sending Email, Slack and Teams takes seconds. If the execution thread sends them itself the run finishes late; doing <b>manual threading + error handling</b> in every method buries the real logic.',
  bad:['ExecutionResultService.java','java',`
public void onRunCompleted(ExecutionResult r) {
    executor.submit(() -> {                    // ❌ manual threading
        try {
            emailNotifier.send(r);
        } catch (Exception e) {
            log.error("Email failed", e);      // ❌ copied error handling
        }
    });
    executor.submit(() -> {                    // ❌ same block again
        try { slackNotifier.send(r); }
        catch (Exception e) { log.error("Slack failed", e); }
    });
}
// ❌ plumbing hides the business logic
// ❌ every new async method repeats this`],
  good:[['NotificationService.java','java',`
@Service
public class NotificationService {

    @Async("notificationExecutor")   // ✅ Spring proxy runs it on another thread
    public void sendAll(ExecutionResult r) {
        notifiers.values().forEach(n -> n.send(r)); // ✅ business logic only
    }
}

// What Spring's proxy does, conceptually:
class NotificationServiceProxy extends NotificationService {
    public void sendAll(ExecutionResult r) {
        executor.submit(() -> super.sendAll(r));    // ✅ caller returns at once

const qaList=(qa,c)=>`<ul class="qa">${qa.map(([q,a])=>`<li style="border-color:${c.lt}"><span class="q">Q. ${q}</span>${a}</li>`).join('')}</ul>`;
function mustCard(p,c){
  return `<article class="card" style="background:${c.bg};border-color:${c.bd}">
   <h2><span class="badge must">Must know</span>${p.name}</h2>
   <div class="lbl" style="color:${c.dk}">Problem</div>
   <p class="problem" style="border-color:${c.lt}">${p.problem}</p>
   <div class="lbl" style="color:${c.dk}">Code — without vs with the pattern</div>
   <div class="vs">
     <div class="col"><span class="side bad">✗ Without pattern</span>${mac(p.bad[0],p.bad[1],p.bad[2])}</div>
     <div class="col"><span class="side ok">✓ With ${p.name}</span>${p.good.map(([f,l,s])=>mac(f,l,s)).join('')}</div>
   </div>
   <div class="below">
     <div><div class="lbl" style="color:${c.dk}">Advantages</div><ul class="list pro" style="border-color:${c.lt}">${p.adv.map(a=>`<li>${a}</li>`).join('')}</ul></div>
     <div><div class="lbl" style="color:${c.dk}">Trade-offs</div><ul class="list con" style="border-color:${c.lt}">${p.cons.map(a=>`<li>${a}</li>`).join('')}</ul></div>
   </div>
   <div class="lbl" style="color:${c.dk}">Interview questions</div>
   ${qaList(p.qa,c)}
  </article>`;
}
function goodCard(g,c){
  return `<div class="gcard" style="border-color:${c.bd}"><h4>${g.name}</h4><p>${g.why}</p>${mac(g.code[0],g.code[1],g.code[2])}${qaList(g.qa,c)}</div>`;
}
function page(P){
  const c=COL[P.col];
  return `<div class="page" id="${P.id}">
   <div class="ph"><div class="n" style="background:${c.bd}">${P.n}</div><h1>${P.title}</h1><div class="tag">Design Patterns for Java Interviews · ${P.n} / ${PAGES.length}</div></div>
   <p class="lede">${P.lede}</p>
   <div class="legend"><span class="badge must">Must know · ${P.must.length}</span><span class="badge good">Good to know · ${P.good.length}</span></div>
   <div class="runex" style="border-color:${c.bd}"><div class="lbl" style="color:${c.dk};margin-top:0">Running example — every pattern below builds on this</div>${mac(RUNEX[0],RUNEX[1],RUNEX[2])}</div>
   ${P.must.map(p=>mustCard(p,c)).join('')}
   <div class="gh"><span class="badge good">Good to know</span><h3>${P.id==='resilience'?'Setup & rules of thumb':'If you have time'}</h3></div>
   <div class="ggrid">${P.good.map(g=>goodCard(g,c)).join('')}</div>
  </div>`;
}

document.getElementById('root').innerHTML=list.map(page).join('');

else{document.getElementById('nav').innerHTML=PAGES.map(p=>{const c=COL[p.col];return `<a href="#${p.id}" style="color:${c.dk};border-color:${c.bd}">${p.n}. ${p.title.replace(' Patterns','').replace(' & Messaging (Kafka)','')}</a>`;}).join('');}
