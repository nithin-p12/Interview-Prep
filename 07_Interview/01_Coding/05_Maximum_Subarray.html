<html lang="en"><head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5. Maximum Subarray (Kadane’s) · Coding Practice · v1.0</title>
<link rel="stylesheet" href="../../_shared/design-tokens.css">
<link rel="stylesheet" href="engine/ds.css">
</head>
<body>
<script src="engine/ds.js"></script>
<script src="engine/player.js"></script>
<script>
const CODE=`public int maxSubArray(int[] nums) {
    int current = nums[0];
    int best = nums[0];
    for (int i = 1; i < nums.length; i++) {
        current = Math.max(nums[i], current + nums[i]);
        best = Math.max(best, current);
    }
    return best;
}`;

// The real algorithm. After every line that matters we save a snapshot (= one step).
function run(nums){
 const S=[],n=nums.length;let current=nums[0],best=nums[0],start=0,bs=0,be=0;
 function snap(o){const i=o.i,inLoop=i!=null&&i<n,hl={};
  for(let k=bs;k<=be;k++)hl[k]='hit';
  if(inLoop&&!o.final)hl[i]='cur';
  const hi=o.final?be:inLoop?(o.pre?i-1:i):0,lo=o.final?bs:start;
  S.push({line:o.line,ann:o.ann,text:o.text,tone:o.tone||'',result:o.result,
   viz:{vals:nums,hl,ptrs:{i:inLoop&&!o.final?i:null},win:[lo,hi],winLabel:o.final?`best = ${best}`:`current run = ${o.pre?o.cur:current}`},
   vars:[{t:'method',note:'whole call',v:[['current',o.pre?o.cur:current],['best',best,o.result!=null?'res':'']]},
         {t:'loop',note:'new each turn',v:[['i',inLoop&&!o.final?i:undefined],['nums[i]',inLoop&&!o.final?nums[i]:undefined]]},
         {t:'expr',v:[['current + nums[i]',o.sum]]}]});}

 snap({i:0,line:[2,3],ann:{2:`current = ${current}`,3:`best = ${best}`},text:`Start with the first number: <b>current = best = ${nums[0]}</b> (a subarray needs at least one number).`});
 for(let i=1;i<n;i++){const x=nums[i],cur0=current;
  snap({i,pre:true,cur:cur0,line:[4],ann:{4:`i = ${i}`},text:`<b>for</b> loop: i = ${i}, nums[i] = <b>${x}</b>. Blue box = the run that ends at i − 1.`});
  const sum=cur0+x;
  if(x>sum){current=x;start=i;}else current=sum;
  snap({i,sum,line:[5],ann:{5:`${current} (${x>sum?'restart':'extend'})`},tone:x>sum?'bad':'',
   text:x>sum?`The old run (${cur0}) only hurts: ${x} alone beats ${cur0} + ${x} = ${sum} → <b>restart</b> the run at i = ${i}.`:`Extending is better: ${cur0} + ${x} = <b>${sum}</b> ≥ ${x} → <b>extend</b> the run.`});
  const old=best;best=Math.max(best,current);if(best>old){bs=start;be=i;}
  snap({i,sum,line:[6],ann:{6:`max(${old}, ${current}) = ${best}`},tone:best>old?'good':'',
   text:best>old?`New record: <b>best = ${best}</b> 🏆 (green cells).`:`${current} is not more than ${old} → best stays <b>${best}</b>.`});
 }
 snap({i:n,final:true,line:[8],ann:{8:`return ${best}`},tone:'good',result:best,text:`Done. The best subarray is <b>[${nums.slice(bs,be+1).join(', ')}]</b> with sum <b>${best}</b>.`});
 return S;}

PLAYER.start({
 title:'5. Maximum Subarray (Kadane’s)',code:CODE,run,
 problem:{pattern:'Kadane · extend or restart',text:'Return the largest sum of a <b>contiguous</b> subarray of <code>nums</code> (at least one number).',example:'[-2, 1, -3, 4, -1, 2, 1, -5, 4] → 6'},
 viz:{kind:'array',title:'nums — blue box = current run · green = best so far',opts:{cw:46,ptrColors:{i:'#F97316'}}},
 ds:[],dsNote:'No collection needed — the whole state is <b>two ints</b>: <code>current</code> (best sum of a run that <b>ends here</b>) and <code>best</code> (best seen anywhere).<br>That is why the space is <b>O(1)</b>.',
 input:{label:'nums =',value:'-2,1,-3,4,-1,2',presets:['4,-1,2,1,-5,4','5,4,-1,7,8','-3,-1,-2','2,-5,3'],
  parse(v){const a=v.match(/-?\d+/g)?.map(Number)||[];if(a.length<1||a.length>9)throw 'nums: 1 to 9 numbers, e.g. -2,1,-3,4';return a;}},
 remember:{
  mnem:{letters:['S','L','E','B'],phrase:'Seed · Loop · Extend · Best',sub:'At every number ask: join the old run, or start fresh here?'},
  chunks:[
   {t:'Seed',d:'current = best = nums[0]',lines:[2,3]},
   {t:'Loop',d:'for i = 1..n−1',lines:[4]},
   {t:'Extend',d:'or restart: current = max(nums[i], current + nums[i])',lines:[5]},
   {t:'Best',d:'best = max(best, current); return best',lines:[6,8]}],
  declare:[
   ['int current = nums[0];','best sum of a run that ends at i'],
   ['int best = nums[0];','best sum seen anywhere so far'],
   ['for (int i = 1; i &lt; nums.length; i++)','index 0 is already the seed']],
  forget:[
   'Seed with <b>nums[0]</b>, not 0 — all negatives ([-3, -1, -2]) must return −1.',
   'Loop starts at <b>i = 1</b>.',
   'It is <code>max(nums[i], current + nums[i])</code> — a negative running sum is dropped.',
   'Update <b>best on every step</b>, not only when you restart.'],
  cx:{time:'O(n)',timeWhy:'one pass, O(1) work per number',space:'O(1)',spaceWhy:'only current and best',
   rows:[['Every start, every end','O(n²)','O(1)','running sum per start',false],
    ['Divide and conquer','O(n log n)','O(log n)','classic, but longer to write',false],
    ['Kadane (one pass)','O(n)','O(1)','extend or restart ✓',true]],
   follow:[
    ['Return the subarray itself?','Track <code>start</code> when you restart; when best improves save (start, i).'],
    ['Maximum product subarray?','Keep both max and min ending here — a negative × negative can become the max.'],
    ['Circular array?','max(Kadane, total − minimum subarray); all negative → plain Kadane.']]}}
});
</script>
</body></html>
